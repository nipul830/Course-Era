<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — Aura Farming</title><link rel="stylesheet" href="styles.css"><style>.auth-card{max-width:430px}.back{display:inline-block;margin-top:14px}.msg{min-height:22px}</style></head><body><div class="auth-wrap"><div class="auth-card"><a class="brand" href="index.html">Aura <span>Farming</span></a><h1>Reset password</h1><p>Enter your account email and we’ll send a secure password reset link.</p><form id="resetForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><button id="resetBtn" class="btn primary full" type="submit">Send reset link</button></form><p id="resetMsg" class="msg"></p><a class="back" href="login.html">Back to login</a></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=9"></script><script>
const form=document.getElementById("resetForm"),emailEl=document.getElementById("email"),btn=document.getElementById("resetBtn"),msg=document.getElementById("resetMsg");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;msg.textContent="Sending reset link…";try{await ceAuth.sendPasswordResetEmail(emailEl.value.trim());msg.textContent="If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.";form.reset();}catch(err){const map={"auth/invalid-email":"Please enter a valid email address.","auth/too-many-requests":"Too many reset requests. Please try again later.","auth/network-request-failed":"Network error. Check your internet connection and try again."};msg.textContent=map[err.code]||"If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.";console.warn("PASSWORD_RESET",err.code||err.message);}finally{btn.disabled=false;}});
</script></body></html>
