<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Meeting — Course Era</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a><nav><a href="courses.html">Courses</a><a href="my-courses.html">My Courses</a><a class="active" href="zoom-meeting.html">Live Meeting</a><a href="profile.html">Profile</a></nav></header>
<main class="container narrow"><div class="page-title"><p class="eyebrow">LIVE CLASS</p><h1>Join Live Meeting</h1><p class="muted">Enter the meeting code shared by Course Era. The live class opens directly here.</p></div>
<div id="meeting" class="panel">Loading meeting details…</div>
<div id="roomWrap" class="panel hidden" style="margin-top:18px;padding:10px"><div id="roomInfo" style="padding:8px 8px 12px"></div><iframe id="jitsiFrame" title="Course Era Live Meeting" allow="camera; microphone; fullscreen; display-capture; autoplay" style="width:100%;height:70vh;min-height:520px;border:0;border-radius:14px;background:#020705"></iframe></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=7"></script><script src="app.js?v=14"></script>
<script>
protectPage("zoom-meeting");
let scheduled={};
ceAuth.onAuthStateChanged(async u=>{if(!u)return;try{const d=await apiFetch('/api/meeting');scheduled=d.meeting||{};renderScheduled();const q=new URLSearchParams(location.search);if(q.get('code')){codeInput.value=q.get('code');joinMeeting();}}catch(e){meeting.innerHTML='<p class="msg">'+esc(e.message)+'</p>'}});
function renderScheduled(){if(!scheduled.enabled||!scheduled.meetingId){meeting.innerHTML='<div class="empty"><h2>No live meeting scheduled</h2><p class="muted">The next class will appear here when the admin schedules it.</p></div>';return}meeting.innerHTML='<div><p class="eyebrow">SCHEDULED CLASS</p><h2>'+esc(scheduled.title)+'</h2>'+(scheduled.date?'<p class="muted">📅 '+esc(scheduled.date)+(scheduled.time?' · ⏰ '+esc(scheduled.time):'')+'</p>':'')+'<p class="muted">Meeting code</p><input id="codeInput" value="'+esc(scheduled.meetingId)+'" placeholder="Enter meeting code" autocomplete="off"><div class="actions"><button class="btn primary full" type="button" onclick="joinMeeting()">Join Live Class</button></div></div>';}
function joinMeeting(){const code=(document.getElementById('codeInput')?.value||'').trim();if(!code){meeting.innerHTML+='<p class="msg">Please enter the meeting code.</p>';return}const room='CourseEra-'+code.replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,80);document.getElementById('roomWrap').classList.remove('hidden');document.getElementById('roomInfo').innerHTML='<p class="eyebrow">LIVE NOW</p><h3>'+esc(scheduled.title||'Course Era Live Class')+'</h3><p class="muted">Room code: <b>'+esc(code)+'</b></p>';document.getElementById('jitsiFrame').src='https://meet.jit.si/'+encodeURIComponent(room)+'#config.prejoinConfig.enabled=true';document.getElementById('roomWrap').scrollIntoView({behavior:'smooth'});}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
