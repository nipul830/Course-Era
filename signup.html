<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Aura Farming</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth-wrap"><div class="auth-card"><a class="brand" href="index.html">Aura <span>Farming</span></a><h1>Create account</h1><p>Save your purchases and access your trading account anytime.</p><form onsubmit="signupDemo(event)"><label>Full name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters"></label><button class="btn primary full">Create Account</button></form><p class="muted">Already registered? <a id="loginLink" href="login.html">Login</a></p><p id="signupMsg" class="msg"></p></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=5"></script><script src="app.js?v=5"></script><script>
const signupNext=new URLSearchParams(location.search).get('next')||'courses.html';
document.getElementById('loginLink').href='login.html?next='+encodeURIComponent(signupNext);
async function signupDemo(e){
  e.preventDefault();
  const msg=document.getElementById('signupMsg');
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=e.submitter;
  if(btn)btn.disabled=true;
  if(msg)msg.textContent='Creating account…';
  try{
    const cred=await ceAuth.createUserWithEmailAndPassword(email,password);
    await cred.user.updateProfile({displayName:name});
    localStorage.setItem('ce_user',JSON.stringify({uid:cred.user.uid,name:name,email:cred.user.email}));
    location.replace(signupNext);
  }catch(err){
    if(msg)msg.textContent=firebaseAuthError(err);
    if(btn)btn.disabled=false;
  }
}
</script></body></html>
