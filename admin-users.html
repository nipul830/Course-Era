<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management — Course Era</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a><nav><a href="admin.html">Dashboard</a></nav></header>
<main class="container"><div class="page-title"><p class="eyebrow">ADMIN / USERS</p><h1>User Management</h1><p class="muted">View accounts, disable users and revoke individual course access.</p></div><div id="users" class="grid"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=7"></script><script src="app.js?v=11"></script>
<script>
protectPage("admin-users");
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadUsers(){
 const box=document.getElementById('users');box.innerHTML='<div class="panel empty">Loading users…</div>';
 try{
  const data=await apiFetch('/api/admin/users');const users=data.users||[];
  if(!users.length){box.innerHTML='<div class="panel empty">No users found.</div>';return}
  box.innerHTML=users.map(u=>'<article class="panel"><p class="eyebrow">'+(u.disabled?'DISABLED':'ACTIVE')+'</p><h3>'+esc(u.name||'Unnamed user')+'</h3><p class="muted">'+esc(u.email)+'</p><p class="muted">Joined: '+esc(u.createdAt?new Date(u.createdAt).toLocaleString():'—')+'</p><div class="actions"><button class="btn ghost" onclick="showCourses(\''+u.uid+'\',this)">View Access</button>'+(u.uid===ceAuth.currentUser.uid?'':'<button class="btn '+(u.disabled?'primary':'ghost')+'" onclick="toggleUser(\''+u.uid+'\','+(u.disabled?'false':'true')+')">'+(u.disabled?'Enable':'Disable')+'</button>')+'</div><div id="courses-'+u.uid+'" class="muted" style="margin-top:12px"></div></article>').join('');
 }catch(e){box.innerHTML='<div class="panel empty">'+esc(e.message)+'</div>'}
}
async function toggleUser(uid,disabled){try{await apiFetch('/api/admin/users/'+encodeURIComponent(uid),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({disabled})});loadUsers()}catch(e){alert(e.message)}}
async function showCourses(uid,btn){
 const box=document.getElementById('courses-'+uid);box.textContent='Loading access…';
 try{
  const data=await apiFetch('/api/admin/users/'+encodeURIComponent(uid)+'/courses');
  box.innerHTML=data.courses?.length?data.courses.map(c=>'<div class="panel" style="margin-top:8px;padding:14px"><b>'+esc(c.title)+'</b><button class="btn ghost" style="float:right;padding:7px 10px" onclick="revoke(\''+uid+'\',\''+c.id+'\')">Revoke</button></div>').join(''):'No course access.';
 }catch(e){box.textContent=e.message}
}
async function revoke(uid,cid){if(!confirm('Revoke this course access?'))return;try{await apiFetch('/api/admin/users/'+encodeURIComponent(uid)+'/courses/'+encodeURIComponent(cid),{method:'DELETE'});showCourses(uid)}catch(e){alert(e.message)}}
ceAuth.onAuthStateChanged(u=>{if(u)loadUsers()});
</script></body></html>
