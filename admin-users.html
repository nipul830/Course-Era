<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Users & Passwords</title><style>:root{--gold:#f1d98a;--gold2:#d6b35a;--bg:#000;--card:#070707;--line:#302713;--muted:#9b8552;--ok:#7ee2a8;--err:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#000;z-index:10}.brand{font-size:24px;font-weight:900}.actions{display:flex;gap:7px}.link,.logout{border:1px solid var(--line);background:#080706;color:var(--gold);border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;text-decoration:none;font-size:12px}.wrap{max-width:1050px;margin:auto;padding:28px 3% 60px}.eyebrow{color:var(--gold2);font-size:12px;font-weight:900;letter-spacing:3px}.title{display:flex;align-items:end;justify-content:space-between;gap:20px}.title h1{font-size:38px;margin:7px 0;color:var(--gold)}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.muted{color:var(--muted);font-size:12px}.user{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(90px,.6fr) minmax(100px,.7fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;background:#030303}.name{font-weight:900}.email,.uid{color:var(--muted);font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:11px}.active{color:var(--ok)}.disabled{color:var(--err)}.reset{background:var(--gold);color:#080808;border:1px solid var(--gold);border-radius:7px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer}.reset:disabled{opacity:.5}.msg{min-height:18px;margin-top:10px;font-size:12px}.error{color:var(--err)}.success{color:var(--ok)}@media(max-width:650px){.wrap{padding:22px 10px}.title h1{font-size:28px}.user{grid-template-columns:1fr auto}.user .status{grid-column:1}.user .action{grid-column:2;grid-row:1/3}.link,.logout{padding:8px 9px;font-size:10px}}</style></head><body><header class="top"><div class="brand">Aura Farming</div><div class="actions"><a class="link" href="admin-panel.html">Admin Panel</a><button class="logout" id="logout">Logout</button></div></header><main class="wrap"><div class="eyebrow">AURA FARMING ADMIN</div><div class="title"><h1>Users & Passwords</h1></div><div class="panel"><div class="head"><div class="muted">Force re-register invalidates the old login and requires a fresh registration.</div><div class="muted" id="updated">Loading…</div></div><div id="users"><div class="muted">Loading users…</div></div><div id="msg" class="msg"></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=12"></script><script>
let currentUser=null,users=[];const list=document.getElementById("users"),msg=document.getElementById("msg"),updated=document.getElementById("updated");
async function token(){return currentUser.getIdToken(true)}
async function api(path,opt={}){const headers={...(opt.headers||{}),Authorization:"Bearer "+await token()};const r=await fetch(path,{...opt,headers});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d.error||"Request failed");return d}
function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){if(!users.length){list.innerHTML='<div class="muted">No users found.</div>';return}list.innerHTML=users.map(u=>'<article class="user"><div><div class="name">'+esc(u.name||u.email||"User")+'</div><div class="email">'+esc(u.email||"No email")+'</div><div class="uid">UID: '+esc(u.uid)+'</div></div><div class="status '+(u.disabled?"disabled":"active")+'">'+(u.disabled?"Disabled":"Active")+'</div><div class="action"><button class="reset" data-uid="'+esc(u.uid)+'" data-email="'+esc(u.email||"")+'" '+(!u.uid?"disabled":"")+'>Force re-register</button></div></article>').join("");document.querySelectorAll(".reset").forEach(b=>b.onclick=resetUser)}
async function load(){try{const d=await api("/api/admin/users");users=Array.isArray(d.users)?d.users:[];render();updated.textContent="Updated "+new Date().toLocaleTimeString()}catch(e){msg.className="msg error";msg.textContent=e.message}}
async function resetUser(e){const b=e.currentTarget,uid=b.dataset.uid,email=b.dataset.email;if(!uid)return;if(!confirm("Force re-register "+(email||"this user")+"? Their current login will be invalidated and they must register again."))return;b.disabled=true;msg.className="msg";msg.textContent="Resetting account…";try{const d=await api("/api/admin/users/"+encodeURIComponent(uid)+"/force-reregister",{method:"POST"});msg.className="msg success";msg.textContent=d.message||"Account reset. User must register again.";await load()}catch(err){msg.className="msg error";msg.textContent=err.message||"Could not reset account."}finally{b.disabled=false}}
document.getElementById("logout").onclick=async()=>{await ceAuth.signOut();location.replace("admin.html")};ceAuth.onAuthStateChanged(async u=>{if(!u){location.replace("admin.html");return}currentUser=u;try{const r=await fetch("/api/admin/payments",{headers:{Authorization:"Bearer "+await token()}});if(!r.ok){await ceAuth.signOut();location.replace("admin.html");return}await load()}catch{location.replace("admin.html")}});
</script></body></html>
