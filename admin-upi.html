<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI — Aura Farming Admin</title><style>:root{--g:#f1d98a;--g2:#d6b35a;--bg:#000;--card:#070707;--line:#302713;--muted:#9b8552;--ok:#7ee2a8;--err:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding-bottom:78px}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#000;z-index:10}.brand{font-size:25px;font-weight:900}.logout{border:1px solid var(--line);background:#080706;color:var(--g);border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:28px 3% 50px}.eyebrow{color:var(--g2);font-size:12px;font-weight:900;letter-spacing:3px}.title{font-size:38px;color:var(--g);margin:7px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.card h2{color:var(--g);font-size:18px;margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#000;color:#fff}.note{color:var(--muted);font-size:11px;line-height:1.6;margin-top:12px}.status{color:var(--muted);font-size:11px;margin-top:12px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#050505ef;border-top:1px solid var(--line);backdrop-filter:blur(12px);display:flex;justify-content:center;z-index:40;overflow-x:auto}.bottom-nav a{flex:0 0 auto;min-width:72px;padding:9px 8px 6px;color:var(--muted);text-decoration:none;text-align:center;font-size:10px;font-weight:900}.bottom-nav a .ico{display:block;font-size:19px;line-height:23px}.bottom-nav a.active,.bottom-nav a:hover{color:var(--g)}.bottom-nav a.active{background:#0d0b07}@media(max-width:650px){.wrap{padding:22px 10px 35px}.title{font-size:30px}.brand{font-size:21px}.grid{grid-template-columns:1fr}.bottom-nav{justify-content:flex-start}.bottom-nav a{min-width:70px;padding-left:5px;padding-right:5px}}</style></head><body><header class="top"><div class="brand">Aura Farming</div><button class="logout" id="logout">Logout</button></header><main class="wrap"><div class="eyebrow">AURA FARMING ADMIN</div><h1 class="title">UPI Payment</h1><div class="grid"><section class="card"><h2>QR / Main UPI</h2><div class="field"><label>Merchant Name</label><input id="merchantName" readonly></div><div class="field"><label>QR UPI ID</label><input id="qrUpi" readonly></div><div class="field"><label>Google Pay UPI</label><input id="googlePayUpi" readonly></div></section><section class="card"><h2>One Tap Apps</h2><div class="field"><label>PhonePe UPI</label><input id="phonePeUpi" readonly></div><div class="field"><label>Paytm UPI</label><input id="paytmUpi" readonly></div><div class="note">Ye section existing checkout ke UPI payment settings ko admin dashboard me alag dikhata hai. Existing payment flow ko change nahi kiya gaya.</div></section></div><div class="status" id="status">Loading payment settings…</div></main><nav class="bottom-nav"><a href="admin-dashboard.html"><span class="ico">⌂</span>Dashboard</a><a href="admin-panel.html"><span class="ico">▣</span>Payment Queue</a><a href="admin-challenges.html"><span class="ico">◈</span>Challenge</a><a href="admin-challenge-rules.html"><span class="ico">☷</span>Rules</a><a class="active" href="admin-upi.html"><span class="ico">₹</span>UPI</a><a href="admin-usdt.html"><span class="ico">₮</span>USDT</a><a href="admin-users.html"><span class="ico">♙</span>Users</a></nav><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=12"></script><script>const $=id=>document.getElementById(id);firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('admin.html');return}try{const token=await u.getIdToken(true);const r=await fetch('/api/payment-settings',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'Could not load payment settings');const s=d.settings||{};['merchantName','qrUpi','googlePayUpi','phonePeUpi','paytmUpi'].forEach(k=>$(k).value=s[k]||'Not configured');$('status').textContent='Current checkout UPI configuration loaded.'}catch(e){$('status').textContent=e.message}});$('logout').onclick=async()=>{await firebase.auth().signOut();location.replace('admin.html')}</script></body></html>
