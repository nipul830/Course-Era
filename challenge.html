<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenges — Aura Farming</title>
<link rel="stylesheet" href="aura.css">
<style>
.challenge-page{max-width:1200px;margin:0 auto;padding:42px 5% 80px}
.challenge-head{text-align:center;margin-bottom:34px}.challenge-head h1{font-size:44px;color:var(--text);margin:8px 0}.challenge-head p{color:var(--muted);max-width:680px;margin:auto;line-height:1.7}
.challenge-tabs{display:flex;justify-content:center;gap:10px;margin:25px 0 34px;flex-wrap:wrap}.challenge-tab{border:1px solid var(--line);background:#050505;color:var(--muted);border-radius:12px;padding:13px 24px;font-weight:800;cursor:pointer}.challenge-tab.active{background:var(--accent);color:#080808;border-color:var(--accent)}
.challenge-panel{display:none}.challenge-panel.active{display:block}.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.account-card{background:#060606;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #0008}.account-card h2{color:#fff;margin:0 0 6px;font-size:28px}.account-type{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.12em}.account-rule{margin:18px 0;color:var(--muted);font-size:14px}.buy-now{width:100%;border:0;border-radius:12px;background:var(--accent);color:#080808;padding:14px;font-size:16px;font-weight:900;cursor:pointer}.price{font-size:22px;color:#fff;font-weight:900;margin:8px 0 4px}.price-discount{display:inline-flex;align-items:baseline;gap:7px;flex-wrap:wrap}.price-old{text-decoration:line-through;opacity:.5;font-size:15px;font-weight:800}.price-new{font-size:22px;font-weight:900}.price-off{display:block;width:100%;font-size:12px;color:#f1d98a;font-weight:900}.currency-row{display:flex;gap:8px;margin:10px 0 12px}.currency-btn{flex:1;border:1px solid var(--line);border-radius:10px;background:#090909;color:var(--muted);padding:9px;font-weight:800;cursor:pointer}.currency-btn.active{background:var(--accent);color:#080808;border-color:var(--accent)}.challenge-status{text-align:center;color:var(--muted);margin:-12px 0 24px;font-size:13px}.buy-now:hover{background:var(--accent2)}
.rule-toggle{width:100%;border:1px solid var(--line);background:#0a0a0a;color:#f1c75b;border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:900;margin-top:16px}.rule-arrow{display:inline-block;font-size:18px;line-height:1;margin-left:8px;transition:transform .2s ease}.account-card.rules-open .rule-arrow{transform:rotate(180deg)}.rule-list{display:none;flex-direction:column;gap:12px;margin-top:12px}.account-card.rules-open .rule-list{display:flex}.rule-row{background:#0a0a0a;min-height:64px;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.rule-main{min-width:0}.rule-label{display:block;color:#f1c75b;font-size:17px;font-weight:800;line-height:1.25}.rule-sub{display:block;color:#8c8c8c;font-size:13px;margin-top:6px;line-height:1.3}.rule-value{color:#fff;font-size:21px;font-weight:900;text-align:right;white-space:nowrap}.rule-start{margin-top:14px;padding:14px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}.rule-start b{color:#fff;font-size:17px}
@media(max-width:800px){.challenge-page{padding:30px 4% 60px}.challenge-head h1{font-size:34px}.account-grid{grid-template-columns:1fr}.challenge-tabs{display:grid;grid-template-columns:repeat(3,1fr)}.challenge-tab{padding:12px 6px;font-size:13px}.rule-row{padding:13px 19px;min-height:62px}.rule-label{font-size:16px}.rule-value{font-size:20px}.rule-sub{font-size:12px}}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="auraGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7df98"/><stop offset=".45" stop-color="#d6b35a"/><stop offset="1" stop-color="#9b671f"/></linearGradient></defs><path d="M12 53 31 9l21 44h-9l-5.3-12H25l-5 12zM28 34h7l-3.5-8z" fill="none" stroke="url(#auraGold)" stroke-width="4.2" stroke-linejoin="round"/><path d="M20 42C9 39 5 31 5 25c9 1 16 6 18 13-1 1-2 2-3 4z" fill="#1f7a32" stroke="#d6b35a" stroke-width="1.4"/><path d="M25 48c1-10 8-17 19-19-1 10-7 17-18 21z" fill="#39a844" stroke="#d6b35a" stroke-width="1.4"/></svg></span><span>Aura Farming</span></a>
  <nav class="top-links"><a href="index.html">Home</a><a href="challenge.html">Challenge</a><a href="transparency.html">Transparency</a><a href="reviews.html">Reviews</a><a href="leaderboard.html">Leaderboard</a><a href="competition.html">Competition</a><a href="terminal.html">Terminal</a><a href="affiliate.html">Affiliate</a><a href="help.html">Help</a></nav>
</header>
<main class="challenge-page">
  <section class="challenge-head"><p class="eyebrow">AURA FARMING</p><h1>Choose Your Challenge</h1><p>Select your simulated account and choose your payment currency.</p></section>
  <div class="challenge-tabs"><button class="challenge-tab active" data-tab="one">1 Step</button><button class="challenge-tab" data-tab="two">2 Step</button><button class="challenge-tab" data-tab="instant">Instant</button></div>
  <div id="challengeStatus" class="challenge-status">Loading challenges…</div>
  <section class="challenge-panel active" id="one"><div class="account-grid" id="oneGrid"></div></section>
  <section class="challenge-panel" id="two"><div class="account-grid" id="twoGrid"></div></section>
  <section class="challenge-panel" id="instant"><div class="account-grid" id="instantGrid"></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=7"></script>
<script>
let challengeRules={};
const challengeTabKey='auraSelectedChallengeTab';
function activateChallengeTab(tabName,save=true){
  const tab=document.querySelector('.challenge-tab[data-tab="'+tabName+'"]');
  const panel=document.getElementById(tabName);
  if(!tab||!panel)return;
  document.querySelectorAll('.challenge-tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.challenge-panel').forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  panel.classList.add('active');
  if(save)localStorage.setItem(challengeTabKey,tabName);
}
async function loadChallenges(){const res=await fetch('/api/challenges');const data=await res.json();if(!res.ok)throw new Error(data.error||'Could not load challenges');return data.challenges||[]}
async function loadChallengeRules(){const res=await fetch('/api/challenge-rules');if(!res.ok)return{};const data=await res.json();return data.rules||{}}
function escapeHtml(value){return String(value??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function parseExtraRule(rule){
  if(rule&&typeof rule==='object'){
    return {label:String(rule.label??rule.name??rule.key??'').trim(),value:String(rule.value??rule.val??'').trim()};
  }
  const text=String(rule??'').trim();
  const match=text.match(/^\s*([^:]+):\s*(.*)$/);
  return match?{label:match[1].trim(),value:match[2].trim()}:{label:text,value:''};
}
function addRuleRow(rules,label,value,sub=''){
  if(!label)return;
  rules.push('<div class="rule-row"><div class="rule-main"><span class="rule-label">'+escapeHtml(label)+'</span>'+(sub?'<span class="rule-sub">'+escapeHtml(sub)+'</span>':'')+'</div><span class="rule-value">'+escapeHtml(value||'—')+'</span></div>');
}
function renderPrice(priceEl,currency){
  const originalUsdt=Number(priceEl.dataset.originalUsdt||0);
  const finalUsdt=Number(priceEl.dataset.usdt||0);
  const originalInr=Number(priceEl.dataset.originalInr||0);
  const finalInr=Number(priceEl.dataset.inr||0);
  const discount=Number(priceEl.dataset.discount||0);
  if(discount>0){
    if(currency==='USDT')priceEl.innerHTML='<span class="price-discount"><span class="price-old">'+originalUsdt.toFixed(2)+' USDT</span><span class="price-new">'+finalUsdt.toFixed(2)+' USDT</span><small class="price-off">'+discount+'% OFF</small></span>';
    else priceEl.innerHTML='<span class="price-discount"><span class="price-old">₹'+originalInr.toLocaleString('en-IN')+'</span><span class="price-new">₹'+finalInr.toLocaleString('en-IN')+'</span><small class="price-off">'+discount+'% OFF</small></span>';
  }else priceEl.textContent=currency==='USDT'?finalUsdt.toFixed(2)+' USDT':'₹'+originalInr.toLocaleString('en-IN');
}
function card(x){
  const discount=Math.min(100,Math.max(0,Number(x.discountPercent)||0));
  const originalUsdt=Number(x.price)||0;
  const finalPrice=Math.round(originalUsdt*(1-discount/100)*100)/100;
  const originalInr=Math.round(originalUsdt*98);
  const inr=Math.round(finalPrice*98);
  const rules=[];
  if(x.profitTarget)addRuleRow(rules,'Profit Target/Phase',x.profitTarget,'Phase 1: '+(x.phase1Profit||'—')+' | Funded: '+(x.phase2Profit||'—'));
  if(x.dailyDrawdown)addRuleRow(rules,'Max Daily Loss (EOD)',x.dailyDrawdown);
  if(x.totalDrawdown)addRuleRow(rules,'Overall Loss (Static)',x.totalDrawdown);
  const extra=Array.isArray(challengeRules[x.model])?challengeRules[x.model]:[];
  extra.forEach(rule=>{const p=parseExtraRule(rule);if(p.label)addRuleRow(rules,p.label,p.value)});
  if(x.evaluation)addRuleRow(rules,'Evaluation',x.evaluation);
  return '<article class="account-card"><div class="account-type">'+escapeHtml(String(x.model||'').toUpperCase())+'</div><h2>'+escapeHtml(x.size||'')+'</h2><div class="price" data-original-usdt="'+originalUsdt.toFixed(2)+'" data-usdt="'+finalPrice.toFixed(2)+'" data-original-inr="'+originalInr+'" data-inr="'+inr+'" data-discount="'+discount+'">'+(discount>0?'<span class="price-discount"><span class="price-old">₹'+originalInr.toLocaleString('en-IN')+'</span><span class="price-new">₹'+inr.toLocaleString('en-IN')+'</span><small class="price-off">'+discount+'% OFF</small></span>':'₹'+originalInr.toLocaleString('en-IN'))+'</div><div class="currency-row"><button type="button" class="currency-btn active" data-currency="INR">INR</button><button type="button" class="currency-btn" data-currency="USDT">USDT</button></div><div class="account-rule"><button type="button" class="rule-toggle" aria-expanded="false">View Rules <span class="rule-arrow" aria-hidden="true">↓</span></button><div class="rule-list">'+rules.join('')+'</div><div class="rule-start">Starting simulated balance: <b>$'+Number(x.accountSize||0).toLocaleString('en-US')+'</b></div></div><button class="buy-now" type="button" data-id="'+escapeHtml(x.id)+'">Buy Now</button></article>';
}
(async function(){
  try{
    const items=await loadChallenges();
    challengeRules=await loadChallengeRules();
    ['one','two','instant'].forEach(model=>{const key=model==='one'?'1 Step':model==='two'?'2 Step':'Instant';document.getElementById(model+'Grid').innerHTML=items.filter(x=>x.model===key).map(card).join('')});
    document.getElementById('challengeStatus').textContent='Choose an account to continue to checkout.';
    document.querySelectorAll('.account-card').forEach(card=>{
      const ruleToggle=card.querySelector('.rule-toggle');
      ruleToggle.onclick=()=>{const open=card.classList.toggle('rules-open');ruleToggle.setAttribute('aria-expanded',String(open))};
      card.querySelectorAll('.currency-btn').forEach(b=>{b.onclick=()=>{card.querySelectorAll('.currency-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderPrice(card.querySelector('.price'),b.dataset.currency)}});
      const buy=card.querySelector('.buy-now');
      buy.onclick=()=>{const id=buy.dataset.id;const currency=card.querySelector('.currency-btn.active')?.dataset.currency||'INR';localStorage.setItem('auraSelectedChallengeId',id);localStorage.setItem('auraSelectedCurrency',currency);location.href='checkout-v3.html?challengeId='+encodeURIComponent(id)+'&currency='+encodeURIComponent(currency)};
    });
    const savedTab=localStorage.getItem(challengeTabKey);
    activateChallengeTab(['one','two','instant'].includes(savedTab)?savedTab:'one',false);
  }catch(e){document.getElementById('challengeStatus').textContent=e.message}
})();
document.querySelectorAll('.challenge-tab').forEach(tab=>tab.addEventListener('click',function(){activateChallengeTab(tab.dataset.tab,true)}));
</script>
</body>
</html>
