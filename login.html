<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050805">
  <title>Login — Aura Farming</title>
  <link rel="stylesheet" href="styles.css?v=login-ui-2">
  <style>
    :root{--gold:#f5c542;--gold2:#ffe071;--green:#39e58b;--bg:#050805;--card:#0b110d;--line:#263a2d;--muted:#8fa197}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050805}
    body{min-height:100vh;color:#f5f7f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -15%,#214c2c 0%,#0d1b12 31%,#050805 72%)}
    .login-page:before,.login-page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .login-page:before{width:520px;height:520px;top:-330px;left:50%;transform:translateX(-50%);background:#f5c54212;filter:blur(12px)}
    .login-page:after{width:280px;height:280px;right:-150px;bottom:-130px;background:#39e58b09;filter:blur(4px)}
    .login-card{position:relative;z-index:1;width:min(430px,100%);padding:34px;border:1px solid #304637;border-radius:26px;background:linear-gradient(145deg,#101a13 0%,#080d0a 100%);box-shadow:0 28px 80px #000c,0 0 45px #f5c5420b}
    .brand-mark{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 0 28px;text-decoration:none;color:#fff;font-size:26px;font-weight:900;letter-spacing:-.4px}
    .brand-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111508;font-size:20px;font-weight:1000;box-shadow:0 8px 22px #f5c54224}
    .brand-mark span{color:var(--gold)}
    .eyebrow{display:block;text-align:center;color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
    .login-card h1{text-align:center;color:#fff;font-size:32px;line-height:1.12;margin:0 0 10px;letter-spacing:-.7px}
    .subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 27px}
    .field{display:block;margin:0 0 17px}
    .field span{display:flex;align-items:center;justify-content:space-between;color:#dce6df;font-size:12px;font-weight:800;margin:0 0 8px}
    .field input{display:block;width:100%;height:50px;padding:0 14px;border:1px solid #2a4032;border-radius:12px;background:#050906;color:#fff;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
    .field input::placeholder{color:#5f7066}
    .field input:focus{border-color:var(--gold);background:#070c08;box-shadow:0 0 0 3px #f5c54217}
    .login-btn{width:100%;height:51px;margin-top:3px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#151306;font-size:15px;font-weight:950;cursor:pointer;box-shadow:0 10px 28px #f5c54225;transition:transform .15s,filter .15s}
    .login-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
    .login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
    .forgot{display:block;text-align:center;margin:18px 0 0;color:var(--gold2);font-size:13px;font-weight:800;text-decoration:none}
    .forgot:hover{text-decoration:underline}
    .signup-line{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 0;padding-top:20px;border-top:1px solid #203026}
    .signup-line a{color:#fff;font-weight:850;text-decoration:none}
    .signup-line a:hover{color:var(--gold2)}
    .login-msg{min-height:20px;text-align:center;color:var(--gold2);font-size:13px;margin:14px 0 0}
    .secure-note{text-align:center;color:#62736a;font-size:10px;letter-spacing:.7px;text-transform:uppercase;margin:18px 0 0}
    @media(max-width:520px){.login-page{padding:16px}.login-card{padding:27px 21px;border-radius:21px}.brand-mark{margin-bottom:24px}.login-card h1{font-size:28px}.subtitle{margin-bottom:23px}}
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-label="Aura Farming login">
      <a class="brand-mark" href="index.html"><span class="brand-icon">A</span><span>Aura</span> Farming</a>
      <span class="eyebrow">Trading Terminal</span>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to your trading account.</p>
      <form id="loginForm">
        <label class="field"><span>Email address</span><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></label>
        <button id="loginBtn" class="login-btn" type="submit">Login to Aura Farming</button>
      </form>
      <a class="forgot" href="forgot-password.html">Forgot password?</a>
      <p class="signup-line">New here? <a href="signup.html">Create an account</a></p>
      <p id="loginMsg" class="login-msg"></p>
      <p class="secure-note">Secure account access</p>
    </section>
  </main>
  <script src="firebase-config.js?v=mongo1"></script>
  <script>
    const loginParams=new URLSearchParams(location.search);
    const nextTarget=loginParams.get("next")||"courses.html";
    async function loginDemo(e){
      e.preventDefault();
      const msg=document.getElementById("loginMsg"),btn=document.getElementById("loginBtn");
      const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
      btn.disabled=true;msg.textContent="Signing in…";
      try{
        const signIn=ceAuth.signInWithEmailAndPassword(email,password);
        const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error("Login timed out. Please check your connection and try again.")),15000));
        const cred=await Promise.race([signIn,timeout]);
        localStorage.setItem("ce_user",JSON.stringify({uid:cred.user.uid,name:cred.user.displayName||cred.user.email.split("@")[0],email:cred.user.email}));
        location.replace(nextTarget);
      }catch(err){
        const map={"auth/invalid-credential":"Email or password is incorrect.","auth/user-not-found":"No account found with this email.","auth/wrong-password":"Incorrect password.","auth/too-many-requests":"Too many attempts. Please try again later.","auth/network-request-failed":"Network error. Check your internet connection and try again."};
        msg.textContent=map[err.code]||err.message||"Authentication failed.";btn.disabled=false;
      }
    }
    document.getElementById("loginForm").addEventListener("submit",loginDemo);
    if(window.ceAuth&&typeof ceAuth.onAuthStateChanged==="function")ceAuth.onAuthStateChanged(function(user){if(user&&!loginParams.has("logout"))location.replace(nextTarget);});
  </script>
</body>
</html>
