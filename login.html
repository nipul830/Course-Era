<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050805">
  <title>Login — Aura Firming</title>
  <link rel="stylesheet" href="styles.css?v=login-ui-5">
  <style>
    :root{--gold:#f5c542;--gold2:#ffe071;--green:#39e58b;--muted:#8fa197}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050805}
    body{min-height:100vh;color:#f5f7f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% -15%,#214c2c 0%,#0d1b12 31%,#050805 72%)}
    .login-page:before,.login-page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.login-page:before{width:520px;height:520px;top:-330px;left:50%;transform:translateX(-50%);background:#f5c54212;filter:blur(12px)}.login-page:after{width:280px;height:280px;right:-150px;bottom:-130px;background:#39e58b09;filter:blur(4px)}
    .login-card{position:relative;z-index:1;width:min(430px,100%);padding:34px;border:1px solid #304637;border-radius:26px;background:linear-gradient(145deg,#101a13 0%,#080d0a 100%);box-shadow:0 28px 80px #000c,0 0 45px #f5c5420b}
    .brand-mark{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 0 20px;text-decoration:none;color:#fff}.brand-logo-full{display:block;width:min(205px,72vw);height:auto;margin:0 auto -2px;mix-blend-mode:screen;filter:drop-shadow(0 8px 22px #f5c54245)}.firming-word{font-size:25px;font-weight:900;letter-spacing:-.4px;color:#fff}.firming-word b{color:var(--gold)}
    .login-card h1{text-align:center;color:#fff;font-size:32px;line-height:1.12;margin:0 0 10px;letter-spacing:-.7px}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 27px}
    .field{display:block;margin:0 0 17px}.field span{display:flex;align-items:center;justify-content:space-between;color:#dce6df;font-size:12px;font-weight:800;margin:0 0 8px}.field input{display:block;width:100%;height:50px;padding:0 14px;border:1px solid #2a4032;border-radius:12px;background:#050906;color:#fff;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}.field input::placeholder{color:#5f7066}.field input:focus{border-color:var(--gold);background:#070c08;box-shadow:0 0 0 3px #f5c54217}
    .login-btn{width:100%;height:51px;margin-top:3px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#151306;font-size:15px;font-weight:950;cursor:pointer;box-shadow:0 10px 28px #f5c54225}.login-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}.forgot{display:block;text-align:center;margin:18px 0 0;color:var(--gold2);font-size:13px;font-weight:800;text-decoration:none}.forgot:hover{text-decoration:underline}.signup-line{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 0;padding-top:20px;border-top:1px solid #203026}.signup-line a{color:#fff;font-weight:850;text-decoration:none}.signup-line a:hover{color:var(--gold2)}.login-msg{min-height:20px;text-align:center;color:var(--gold2);font-size:13px;margin:14px 0 0}.secure-note{text-align:center;color:#62736a;font-size:10px;letter-spacing:.7px;text-transform:uppercase;margin:18px 0 0}
    @media(max-width:520px){.login-page{padding:16px}.login-card{padding:27px 21px;border-radius:21px}.brand-logo-full{width:min(190px,70vw)}.firming-word{font-size:23px}.login-card h1{font-size:28px}.subtitle{margin-bottom:23px}}
  </style>
</head>
