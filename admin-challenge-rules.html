<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenge Rules — Aura Farming</title><style>:root{--g:#f1d98a;--g2:#d6b35a;--bg:#000;--card:#070707;--line:#302713;--muted:#9b8552;--ok:#7ee2a8;--err:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;background:#000;z-index:5}.brand{font-size:24px;font-weight:900}.top a,.top button{color:var(--g);background:#080706;border:1px solid var(--line);border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:25px 3% 60px}.eyebrow{color:var(--g2);font-size:11px;font-weight:900;letter-spacing:3px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{color:var(--g);margin:6px 0 8px;font-size:34px}.sub{color:var(--muted);font-size:12px;margin:0 0 20px}.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:14px 0}.stage h2{margin:0 0 12px;color:var(--g);font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#030303}.card h3{margin:0 0 10px;color:var(--g2);font-size:14px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#000;color:#fff}.check{display:flex;align-items:center;gap:8px;color:var(--g2);font-size:12px;font-weight:800;margin-bottom:10px}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:1px solid var(--g2);background:var(--g2);color:#080808;border-radius:8px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.secondary{background:#0b0a07;color:var(--g)}.status{min-height:20px;margin:12px 0;font-size:12px}.ok{color:var(--ok)}.err{color:var(--err)}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.head h1{font-size:28px}.actions .btn{flex:1}.top .brand{font-size:20px}}</style></head><body><header class="top"><div class="brand">Aura Farming</div><div><a href="admin-challenges.html">Challenges</a> <button id="logout">Logout</button></div></header><main class="wrap"><div class="eyebrow">AURA FARMING ADMIN</div><div class="head"><div><h1>Challenge Rules</h1><p class="sub">Rules are separate from the challenge catalog. Configure each stage independently.</p></div></div><div id="status" class="status"></div><div id="rules"></div><div class="actions"><button class="btn" id="save">Save Rules</button><button class="btn secondary" id="reload">Reload</button></div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=13"></script><script>let user=null;const $=id=>document.getElementById(id),status=$("status");const models={"1 Step":["Phase 1","Funded"],"2 Step":["Phase 1","Phase 2","Funded"],"Instant":["Funded"]};const pct=[0.25,0.5,0.75,1,1.25,1.5,1.75,2,2.25,2.5];function api(path,opt={}){return user.getIdToken(true).then(token=>fetch(path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}})).then(async r=>{const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d})}function stageKey(model,stage){return model+'__'+stage.replace(/\s+/g,'_')}function parseStored(model,raw){const out={};if(Array.isArray(raw))raw.forEach(v=>{try{const x=typeof v==='string'?JSON.parse(v):v;if(x&&x.stage)out[x.stage]=x}catch{}});else if(raw&&typeof raw==='object')Object.assign(out,raw);return out}function render(data){const root=$("rules");root.innerHTML=Object.entries(models).map(([model,stages])=>'<section class="stage"><h2>'+model+'</h2><div class="grid">'+stages.map(stage=>{const key=stageKey(model,stage),r=(data[model]&&data[model][stage])||{};return '<div class="card"><h3>'+stage+'</h3><label class="check"><input type="checkbox" id="'+key+'__enabled" '+(r.floatingLossEnabled!==false?'checked':'')+'> Floating Loss</label><div class="field"><label>Floating Loss %</label><select id="'+key+'__floating">'+pct.map(v=>'<option value="'+v+'" '+(Number(r.floatingLossPercent||1)===v?'selected':'')+'>'+v.toFixed(2)+'%</option>').join('')+'</select></div><div class="field"><label>Minimum Trading Days</label><select id="'+key+'__days">'+Array.from({length:11},(_,i)=>'<option value="'+i+'" '+(Number(r.minimumTradingDays??5)===i?'selected':'')+'>'+i+' day'+(i===1?'':'s')+'</option>').join('')+'</select></div></div>'}).join('')+'</div></section>').join('')}function collect(){const out={};for(const [model,stages] of Object.entries(models)){out[model]=stages.map(stage=>JSON.stringify({stage,floatingLossEnabled:$(stageKey(model,stage)+'__enabled').checked,floatingLossPercent:Number($(stageKey(model,stage)+'__floating').value),minimumTradingDays:Number($(stageKey(model,stage)+'__days').value)}))}return out}async function load(){status.className='status';status.textContent='Loading…';try{const d=await api('/api/challenge-rules');const r=d.rules||{};const normalized={};for(const model of Object.keys(models))normalized[model]=parseStored(model,r[model]);render(normalized);status.textContent=''}catch(e){status.className='status err';status.textContent=e.message}}$('save').onclick=async()=>{status.className='status';status.textContent='Saving…';try{await api('/api/challenge-rules',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:collect()})});status.className='status ok';status.textContent='Challenge rules saved.'}catch(e){status.className='status err';status.textContent=e.message}};$('reload').onclick=load;$('logout').onclick=async()=>{await firebase.auth().signOut();location.replace('admin.html')};firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('admin.html');return}user=u;load()});</script></body></html>
