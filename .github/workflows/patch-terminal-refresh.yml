name: Patch terminal refresh and TP SL lines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply terminal patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('terminal.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AURA_5MS_REFRESH_TPSL_05PX_V1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          css = '''\n/* AURA_5MS_REFRESH_TPSL_05PX_V1 */\n.chart-risk-handle[data-risk-type="stopLoss"]::after,.chart-risk-handle[data-risk-type="takeProfit"]::after{content:"";position:absolute;left:0;right:0;top:24px;height:.5px;pointer-events:none}\n.chart-risk-handle[data-risk-type="stopLoss"]::after{background:#e6004d}\n.chart-risk-handle[data-risk-type="takeProfit"]::after{background:#00a875}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          js = '''\n<script>\n/* AURA chart refresh target: 5ms */\nwindow.AURA_CHART_REFRESH_MS=5;\nwindow.dispatchEvent(new CustomEvent('aura-chart-refresh-rate',{detail:{ms:5}}));\n</script>\n'''
          s = s.replace('</body>', js + '</body>', 1)
          s = s.replace('content="2026-09-26-order-lines-fix-2"','content="2026-10-02-refresh-5ms-tpsl-05px"',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terminal.html .github/workflows/patch-terminal-refresh.yml
          git commit -m 'Set 5ms chart refresh and 0.5px TP SL lines [skip ci]'
          git push
