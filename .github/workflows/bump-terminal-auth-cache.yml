name: Bump terminal auth script cache once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump firebase-config cache version on terminal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('terminal.html')
          s=p.read_text()
          old='firebase-config.js?v=6'
          new='firebase-config.js?v=7'
          if old not in s:
              raise SystemExit('terminal auth script reference not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add terminal.html .github/workflows/bump-terminal-auth-cache.yml
          git rm .github/workflows/bump-terminal-auth-cache.yml
          git commit -m 'Bump terminal auth cache version [skip ci]'
          git push
