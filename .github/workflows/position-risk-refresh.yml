name: Position Risk UI Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch position risk UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('position.html')
          s = p.read_text()
          changed = False

          # Keep existing risk-color patch and only change the refresh interval.
          old = 'setInterval(refreshPosition,3000);'
          new = 'setInterval(refreshPosition,50);'
          if old in s:
              s = s.replace(old, new, 1)
              changed = True
              print('Position auto refresh changed to 50ms')
          elif new in s:
              print('Position auto refresh already 50ms')
          else:
              raise SystemExit('Position refresh interval not found')

          p.write_text(s)
          print('Changed:', changed)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add position.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Set position auto refresh to 50ms"
            git push
          fi
