name: One-time terminal close toolbar patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-terminal-close-toolbar.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[terminal-close-toolbar-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminal close control
        shell: python
        run: |
          from pathlib import Path
          p = Path('terminal.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.chart-close-btn{position:absolute;right:8px;width:28px;height:28px;'
          if old_css not in s:
              raise SystemExit('Expected chart close button CSS was not found')
          s = s.replace(old_css, '.chart-close-btn{display:none!important;position:absolute;right:8px;width:28px;height:28px;', 1)

          old_fn = """function updateChartOrderActions(){
  if(!chartOrderActions||!candleSeries)return;
  updateChartRiskHandles();"""
          new_fn = """function updateChartToolbarCloseTrade(){
  const btn=document.getElementById('chartToolbarCloseTrade');
  if(!btn)return;
  const positions=Array.isArray(terminalPositions)?terminalPositions.filter(p=>p&&p.symbol===currentSymbol&&p.id):[];
  const position=positions[0]||null;
  btn.style.display=position?'inline-flex':'none';
  btn.dataset.positionId=position?String(position.id):'';
}
function updateChartOrderActions(){
  if(!chartOrderActions||!candleSeries)return;
  updateChartToolbarCloseTrade();
  updateChartRiskHandles();"""
          if old_fn not in s:
              raise SystemExit('Expected updateChartOrderActions function was not found')
          s = s.replace(old_fn, new_fn, 1)

          old_toolbar = """    const live=document.createElement('span');live.textContent='● LIVE';live.className='aura-chart-live';toolbar.appendChild(live);
    const canvas=document.createElement('div');canvas.className='aura-chart-canvas';"""
          new_toolbar = """    const live=document.createElement('span');live.textContent='● LIVE';live.className='aura-chart-live';toolbar.appendChild(live);
    const closeTradeBtn=document.createElement('button');
    closeTradeBtn.type='button';
    closeTradeBtn.id='chartToolbarCloseTrade';
    closeTradeBtn.className='chart-toolbar-close';
    closeTradeBtn.textContent='Close Trade';
    closeTradeBtn.style.display='none';
    closeTradeBtn.addEventListener('click',ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      const id=String(closeTradeBtn.dataset.positionId||'');
      const position=terminalPositions.find(x=>String(x.id)===id)||terminalPositions.find(x=>x&&x.symbol===currentSymbol);
      if(position)confirmCloseTrade(position);
    });
    toolbar.appendChild(closeTradeBtn);
    const canvas=document.createElement('div');canvas.className='aura-chart-canvas';"""
          if old_toolbar not in s:
              raise SystemExit('Expected chart toolbar construction was not found')
          s = s.replace(old_toolbar, new_toolbar, 1)

          old_style = '.aura-chart-live{margin-left:auto;margin-right:0}'
          new_style = '.aura-chart-live{margin-left:auto;margin-right:0}.chart-toolbar-close{display:inline-flex;align-items:center;justify-content:center;margin-left:4px;height:30px;padding:0 9px;border:1px solid #e6004d;border-radius:8px;background:#fff;color:#e6004d;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer;touch-action:manipulation}.chart-toolbar-close:active{transform:scale(.96)}'
          if old_style not in s:
              raise SystemExit('Expected chart live style was not found')
          s = s.replace(old_style, new_style, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-terminal-close-toolbar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.html .github/workflows/one-time-terminal-close-toolbar.yml
          git diff --cached --quiet && exit 0
          git commit -m "Move trade close control to chart toolbar [terminal-close-toolbar-patched]"
          git push
# retrigger after workflow-file creation
