name: Repair daily P&L

on:
  push:
    branches: [main]
    paths-ignore:
      - 'aura-account.js'
      - '.github/workflows/repair-daily-pnl.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch daily P&L timestamp fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('aura-account.js')
          s = p.read_text()
          old = "const when=trade?.closedAt||trade?.closeTime||trade?.closed_at;"
          new = "const when=trade?.closedAt||trade?.closeTime||trade?.closed_at||trade?.updatedAt||trade?.updated_at;"
          if old not in s:
              raise SystemExit('Target line not found; refusing unsafe edit')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aura-account.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Today P&L daily reset timestamp'
          git push
