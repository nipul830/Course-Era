name: Fix position refresh interval

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only position polling interval
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('position.html')
          s=p.read_text()
          old='setInterval(()=>{if(terminalSessionToken&&!closeAllRunning)loadPositions().catch(()=>{});},500);'
          new='setInterval(()=>{if(terminalSessionToken&&!closeAllRunning)loadPositions().catch(()=>{});},3000);'
          if old not in s:
              raise SystemExit('Expected 500ms position refresh line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add position.html
          git commit -m "Set position refresh to 3 seconds"
          git push
