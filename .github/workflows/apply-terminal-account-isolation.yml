name: Apply terminal account isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-terminal-account-isolation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch terminal account isolation
        shell: python
        run: |
          from pathlib import Path

          # 1) Require the website Firebase user to authenticate terminal login.
          p = Path('backend/server.js')
          s = p.read_text()
          old = 'app.post("/api/terminal/login", terminalLoginRateLimit, async (req, res) => {'
          new = 'app.post("/api/terminal/login", requireAuth, terminalLoginRateLimit, async (req, res) => {'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('terminal login route marker not found')

          old = '''    const credential = snap.data() || {};
    if (credential.status !== "active") return res.status(403).json({ error: "Terminal credentials are revoked" });'''
          new = '''    const credential = snap.data() || {};
    if (credential.status !== "active") return res.status(403).json({ error: "Terminal credentials are revoked" });
    if (String(credential.userId || "") !== String(req.user.uid || "")) {
      return res.status(403).json({ error: "This terminal account belongs to a different user." });
    }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('terminal credential ownership marker not found')
          p.write_text(s)

          # 2) Load the client guard before terminal's inline login code. It binds
          # the terminal session to the same website user and adds Firebase auth.
          p = Path('terminal.html')
          s = p.read_text()
          marker = '<script src="aura-account.js"></script>'
          tag = '<script src="terminal-auth-guard.js?v=2"></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('terminal.html aura-account marker not found')
              s = s.replace(marker, marker + '\n<script src="terminal-account-unlock.js?v=1"></script>\n' + tag, 1)
          p.write_text(s)

          # 3) Add a small terminal-only unlock layer. Existing UI remains intact;
          # the switcher is rebuilt to show only accounts actually logged into on
          # this website-user/browser session. Each successful terminal login keeps
          # its own signed session token so switching never silently logs into an
          # account whose credentials were never entered.
          unlock = Path('terminal-account-unlock.js')
          if not unlock.exists():
              unlock.write_text(r'''(function(){
  'use strict';
  if(!/\/terminal(?:\.html)?(?:\/|$)/i.test(location.pathname))return;

  const PREFIX='auraTerminalUnlocked:';
  const OWNER='auraTerminalUnlockOwner';

  function uid(){return String(window.ceAuth?.currentUser?.uid||'').trim()}
  function key(){const u=uid();return u?PREFIX+u:''}
  function read(){
    try{const k=key();if(!k)return{};return JSON.parse(sessionStorage.getItem(k)||'{}')||{}}
    catch{return{}}
  }
  function write(v){try{const k=key();if(k)sessionStorage.setItem(k,JSON.stringify(v||{}))}catch{}}
  function clearUnlocks(){try{
    const u=uid();
    if(u)sessionStorage.removeItem(PREFIX+u);
    sessionStorage.removeItem(OWNER);
  }catch{}}

  function decode(token){
    try{
      const p=String(token||'').split('.');
      if(p.length!==3||p[0]!=='AF1')return null;
      let raw=p[1].replace(/-/g,'+').replace(/_/g,'/');
      while(raw.length%4)raw+='=';
      return JSON.parse(atob(raw));
    }catch{return null}
  }

  function remember(token,data){
    const u=uid(),p=decode(token),id=String(p?.accountId||data?.account?.id||'').trim();
    if(!u||!p?.uid||String(p.uid)!==u||!id)return;
    const all=read();
    all[id]={token,role:String(p.role||'trader'),account:data?.account||{id},savedAt:Date.now()};
    write(all);sessionStorage.setItem(OWNER,u);
  }

  // Capture successful terminal logins. The terminal-auth-guard wrapper runs
  // underneath this wrapper and adds the website Firebase Authorization header.
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input?.url||'');
    if(!/\/api\/terminal\/login(?:\?|$)/i.test(url))return nativeFetch(input,init);
    const response=await nativeFetch(input,init);
    try{
      const data=await response.clone().json();
      if(response.ok&&data?.token)remember(data.token,data);
    }catch{}
    return response;
  };

  function switchTo(id){
    const item=read()[String(id||'').trim()];
    if(!item?.token){
      setStatus('Login this account once with its Terminal ID + password.');
      return;
    }
    const p=decode(item.token);
    if(!p?.uid||p.uid!==uid()||p.exp<Date.now()/1000){
      const all=read();delete all[String(id||'').trim()];write(all);
      setStatus('This terminal session expired. Login this account again.');
      render();
      return;
    }
    sessionStorage.setItem('auraTerminalSession',item.token);
    sessionStorage.setItem('auraTerminalRole',item.role||'trader');
    sessionStorage.setItem('auraTerminalAccount',JSON.stringify(item.account||{}));
    location.reload();
  }

  function setStatus(msg){
    const el=document.getElementById('tradeStatus');
    if(el){el.textContent=msg||'';el.style.color='#e6004d'}
  }

  function render(){
    const root=document.querySelector('.mobile-terminal .m-top');
    if(!root)return;
    const old=root.querySelector('#auraAccountSwitchButton,#auraTerminalAccountSwitcher');
    const oldLabel=root.querySelector('#auraAccountSwitchButton');
    if(oldLabel)oldLabel.replaceWith(oldLabel.cloneNode(true));
    const oldMenu=root.querySelector('#auraTerminalAccountSwitcher');
    if(oldMenu)oldMenu.remove();

    const label=root.querySelector('.account-label');
    if(!label)return;
    const clean=label.cloneNode(false);
    clean.id='auraAccountSwitchButton';
    clean.textContent='Account Switch ▾';
    clean.setAttribute('role','button');clean.setAttribute('aria-haspopup','listbox');clean.setAttribute('aria-expanded','false');
    clean.style.cssText='display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#182332;font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:none;position:relative;';
    label.replaceWith(clean);

    const menu=document.createElement('div');
    menu.id='auraTerminalAccountSwitcher';
    menu.setAttribute('role','listbox');
    menu.style.cssText='display:none;position:absolute;left:28px;right:28px;top:43px;background:#fff;border:1px solid #dce2e7;border-radius:16px;box-shadow:0 12px 30px #0002;z-index:120;overflow:hidden;';
    const head=document.createElement('div');
    head.textContent='LOGGED-IN ACCOUNTS';
    head.style.cssText='padding:10px 14px 7px;color:#8a96a2;font-size:10px;font-weight:900;letter-spacing:.08em;border-bottom:1px solid #eef1f4;';
    menu.appendChild(head);
    const list=document.createElement('div');
    list.style.cssText='max-height:330px;overflow-y:auto;-webkit-overflow-scrolling:touch;';
    menu.appendChild(list);root.style.position='relative';root.appendChild(menu);

    function fill(){
      list.innerHTML='';
      const all=read(),entries=Object.entries(all).sort((a,b)=>Number(b[1]?.savedAt||0)-Number(a[1]?.savedAt||0));
      const current=decode(sessionStorage.getItem('auraTerminalSession')||'')?.accountId||'';
      if(!entries.length){
        list.innerHTML='<div style="padding:16px;color:#7b8793;font-size:12px">No terminal accounts logged in yet.</div>';
        return;
      }
      for(const [id,item] of entries){
        const account=item.account||{};
        const challenge=String(account.challenge||'Account');
        const size=Number(account.balance||account.startingBalance||0);
        const btn=document.createElement('button');btn.type='button';btn.setAttribute('role','option');btn.setAttribute('aria-selected',String(id===current));
        btn.style.cssText='display:block;width:100%;padding:13px 14px;border:0;border-bottom:1px solid #eef1f4;background:'+(id===current?'#fff8e8':'#fff')+';text-align:left;color:#17212b;cursor:pointer;';
        const top=document.createElement('strong');top.textContent=id;top.style.cssText='display:block;font-size:13px;font-weight:900;';
        const sub=document.createElement('span');sub.textContent=challenge+(size?' · $'+size.toLocaleString('en-US'):'');sub.style.cssText='display:block;margin-top:4px;color:#7c8995;font-size:11px;font-weight:800;';
        btn.append(top,sub);btn.addEventListener('click',()=>{menu.style.display='none';clean.setAttribute('aria-expanded','false');switchTo(id)});list.appendChild(btn);
      }
    }

    clean.addEventListener('click',e=>{e.stopPropagation();const open=menu.style.display==='block';menu.style.display=open?'none':'block';clean.setAttribute('aria-expanded',String(!open));if(!open)fill()});
    document.addEventListener('click',e=>{if(menu.style.display==='block'&&!menu.contains(e.target)&&e.target!==clean){menu.style.display='none';clean.setAttribute('aria-expanded','false')}});
    fill();
  }

  function boot(){
    const u=uid();
    const owner=sessionStorage.getItem(OWNER)||'';
    if(owner&&u&&owner!==u)clearUnlocks();
    if(u)sessionStorage.setItem(OWNER,u);
    // Run after aura-account.js has rendered its original switcher.
    setTimeout(render,0);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
  if(window.ceAuth?.onAuthStateChanged)window.ceAuth.onAuthStateChanged(user=>{
    if(!user){clearUnlocks();return}
    const owner=sessionStorage.getItem(OWNER)||'';
    if(owner&&owner!==String(user.uid))clearUnlocks();
    sessionStorage.setItem(OWNER,String(user.uid));
    setTimeout(render,0);
  });
})();
''')

          # Make sure the new file is included even when a future checkout already
          # contains it; terminal.html stays unchanged after this first patch.
          if 'terminal-account-unlock.js?v=1' not in Path('terminal.html').read_text():
              raise SystemExit('terminal-account-unlock script tag missing')

          Path('backend/server.js').write_text(s)
          Path('terminal.html').write_text(Path('terminal.html').read_text())

      - name: Validate
        run: |
          node --check backend/server.js

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js terminal.html terminal-account-unlock.js .github/workflows/apply-terminal-account-isolation.yml
          git commit -m "Isolate terminal accounts by user and login"
          git push origin HEAD:main
