name: Fix dashboard trade history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch dashboard trade data and breached-account retention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text()

          # Dashboard trade-data API.
          marker='// DASHBOARD_TRADING_DATA_V1'
          if marker not in s:
              needle='app.get("/api/trading/history", requireTerminalAuth, async (req,res) => {'
              route=r'''// DASHBOARD_TRADING_DATA_V1
          app.get("/api/dashboard/trading-data", requireAuth, async (req,res) => {
            try {
              initFirebase();
              const accountId=String(req.query.accountId||"").trim();
              if(!accountId) return res.status(400).json({error:"accountId is required"});
              const {ref,data}=await loadTradingAccount(req.user.uid,accountId);
              const snap=await ref.collection("positions").get();
              const toIso=v=>v?.toDate?.()?.toISOString?.() || (v?._seconds?new Date(Number(v._seconds)*1000+(Number(v._nanoseconds||0)/1e6)).toISOString():null);
              const all=snap.docs.map(d=>{const p={id:d.id,...d.data(),name:MARKET_SYMBOLS[d.data()?.symbol]?.name||d.data()?.symbol};p.openedAt=toIso(p.openedAt);p.closedAt=toIso(p.closedAt);p.createdAt=toIso(p.createdAt);p.updatedAt=toIso(p.updatedAt);return p;});
              const open=all.filter(p=>p.status==="open"),pending=all.filter(p=>p.status==="pending"),closed=all.filter(p=>p.status==="closed").sort((a,b)=>String(b.closedAt||"").localeCompare(String(a.closedAt||"")));
              let realized=0,winning=0,losing=0;
              for(const p of closed){const v=Number(p.realizedPnl??p.pnl??0)||0;realized+=v;if(v>0)winning++;else if(v<0)losing++;}
              res.json({account:{id:data.accountId||accountId,balance:Number(data.balance??data.startingBalance??0),equity:Number(data.equity??data.balance??data.startingBalance??0),pnl:Number(data.pnl??realized??0),openPnl:Number(data.openPnl??0),startingBalance:Number(data.startingBalance??data.balance??0),challenge:data.challenge||data.accountType||data.plan||"",status:data.status||"active",dailyDrawdownPct:Number(data.dailyDrawdownPct||0),dailyDrawdownLimit:Number(data.dailyDrawdownLimit||4),maxDrawdownPct:Number(data.maxDrawdownPct||0),maxDrawdownLimit:Number(data.maxDrawdownLimit||8)},open,pending,closed,stats:{realizedPnl:realized,wins:winning,losses:losing,total:closed.length}});
            } catch(e) {
              res.status(500).json({error:"Could not load dashboard trading data",detail:e.message||"Unknown error"});
            }
          });
          '''
              if needle not in s: raise SystemExit('server insertion point not found')
              s=s.replace(needle,route+needle,1)

          # Breach retention: terminal access is revoked immediately; dashboard
          # keeps the breached account/history for exactly 7 days, then it is removed.
          retention_marker='// BREACHED_ACCOUNT_RETENTION_V1'
          if retention_marker not in s:
              admin_old='''    await accountRef.update({
      status:"breached",
      breachReason:reason,
      updatedAt:admin.firestore.FieldValue.serverTimestamp()
    });'''
              admin_new='''    await accountRef.update({
      status:"breached",
      breachReason:reason,
      breachedAt:admin.firestore.FieldValue.serverTimestamp(),
      updatedAt:admin.firestore.FieldValue.serverTimestamp()
    });'''
              if admin_old not in s: raise SystemExit('admin breach marker not found')
              s=s.replace(admin_old,admin_new,1)

              risk_old='''    status, breachReason:breach,
    updatedAt:admin.firestore.FieldValue.serverTimestamp()
  });'''
              risk_new='''    status, breachReason:breach,
    breachedAt: (status === "breached" && data.status !== "breached")
      ? admin.firestore.FieldValue.serverTimestamp()
      : (data.breachedAt || null),
    updatedAt:admin.firestore.FieldValue.serverTimestamp()
  });'''
              if risk_old not in s: raise SystemExit('risk breach marker not found')
              s=s.replace(risk_old,risk_new,1)

              # Default account list is terminal-safe: breached accounts are not
              # returned unless the dashboard explicitly asks for history.
              api_old='''    const snap = await base.collection("tradingAccounts").orderBy("createdAt", "desc").limit(5).get();
    const accounts = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));'''
              api_new='''    const snap = await base.collection("tradingAccounts").orderBy("createdAt", "desc").limit(25).get();
    const allAccounts = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));
    const view = String(req.query?.view || "terminal").toLowerCase();
    const accounts = view === "dashboard"
      ? allAccounts
      : allAccounts.filter(a => String(a.status || "active").toLowerCase() === "active");'''
              if api_old not in s: raise SystemExit('trading accounts API marker not found')
              s=s.replace(api_old,api_new,1)

              cleanup=r'''// BREACHED_ACCOUNT_RETENTION_V1
          const BREACHED_ACCOUNT_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;
          const BREACHED_ACCOUNT_CLEANUP_INTERVAL_MS = 15 * 60 * 1000;

          async function deleteFirestoreQueryDocs(query) {
            const snap = await query.get();
            if (!snap.size) return;
            let batch = db.batch();
            let count = 0;
            for (const doc of snap.docs) {
              batch.delete(doc.ref);
              count++;
              if (count >= 450) {
                await batch.commit();
                batch = db.batch();
                count = 0;
              }
            }
            if (count) await batch.commit();
          }

          async function cleanupExpiredBreachedAccounts() {
            try {
              initFirebase();
              const cutoff = Date.now() - BREACHED_ACCOUNT_RETENTION_MS;
              const snap = await db.collectionGroup("tradingAccounts")
                .where("status", "==", "breached")
                .get();
              for (const doc of snap.docs) {
                const data = doc.data() || {};
                const breachedAt = data.breachedAt?.toDate?.()?.getTime?.()
                  || (data.breachedAt?._seconds ? Number(data.breachedAt._seconds) * 1000 : 0);
                if (!breachedAt || breachedAt > cutoff) continue;

                const accountId = String(data.accountId || doc.id);
                const userDoc = doc.ref.parent.parent;
                const uid = String(userDoc?.id || "");
                if (!uid) continue;

                await deleteFirestoreQueryDocs(doc.ref.collection("positions"));
                const credentialId = String(data.terminalCredentialId || "").trim();
                if (credentialId) await db.collection("terminalCredentials").doc(credentialId).delete().catch(() => {});
                await db.collection("users").doc(uid).collection("challengeAccounts").doc(accountId).delete().catch(() => {});

                const selectedRef = db.collection("users").doc(uid).collection("trading").doc("account");
                const selectedSnap = await selectedRef.get();
                if (selectedSnap.exists && String(selectedSnap.data()?.accountId || "") === accountId) {
                  await selectedRef.delete().catch(() => {});
                }
                await doc.ref.delete();
              }
            } catch (e) {
              console.warn("Breached account cleanup failed:", e?.message || e);
            }
          }

          setTimeout(() => cleanupExpiredBreachedAccounts(), 5000);
          setInterval(() => cleanupExpiredBreachedAccounts(), BREACHED_ACCOUNT_CLEANUP_INTERVAL_MS);

          '''
              needle='async function requireTerminalAuth(req, res, next) {'
              if needle not in s: raise SystemExit('terminal auth insertion point not found')
              s=s.replace(needle,cleanup+needle,1)
          p.write_text(s)

          # Dashboard gets breached accounts/history; terminal/default gets active only.
          js=Path('account-switcher.js')
          ss=js.read_text()
          old="API+'/api/trading-accounts',{headers:{Authorization:'Bearer '+token},cache:'no-store'}"
          new="API+'/api/trading-accounts?view=dashboard',{headers:{Authorization:'Bearer '+token},cache:'no-store'}"
          if old in ss:
              ss=ss.replace(old,new,1)
          elif new not in ss:
              raise SystemExit('dashboard account list call not found')
          js.write_text(ss)

          # Bump dashboard cache version.
          p=Path('courses.html')
          s=p.read_text().replace('account-switcher.js?v=2','account-switcher.js?v=3')
          p.write_text(s)
          PY
          node --check backend/server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js courses.html dashboard-fix.js account-switcher.js
          git diff --cached --quiet || git commit -m 'Fix dashboard history and breached account retention'
          git push
