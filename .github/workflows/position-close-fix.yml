name: Load Position Close Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load close retry script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('position.html')
          s = p.read_text()
          tag = '<script src="position-close-fix.js"></script>'
          anchor = '<script src="position-pnl-fix.js"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('position-pnl-fix.js script tag not found')
              s = s.replace(anchor, anchor + tag, 1)
              p.write_text(s)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/position-close-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add position.html .github/workflows/position-close-fix.yml
          git commit -m "Load robust position close handler"
          git push
