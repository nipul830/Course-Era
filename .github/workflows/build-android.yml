name: Build Course Era APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp *.html *.js *.css www/
          rm -f www/aura-account.js
          rm -f www/terminal-auth-guard.js
          cp terminal.html www/index.html

      - name: Isolate terminal APK authentication and Home watchlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('www/terminal.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]+(?:firebase-app-compat|firebase-auth-compat|firebase-config\\.js|aura-account\\.js|terminal-auth-guard\\.js)[^>]*></script>\\s*', '', s, flags=re.I)
          marker = "if(url.includes('/api/terminal/login'))"
          while marker in s:
              start = s.index(marker)
              brace = s.rfind('{', 0, start)
              if brace < 0:
                  break
              depth = 0
              end = None
              quote = None
              escape = False
              i = brace
              while i < len(s):
                  ch = s[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in "'\\\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  i += 1
              if end is None:
                  break
              s = s[:brace] + s[end:]
          s = s.replace('2026-09-26-order-lines-fix-2', '2026-10-02-terminal-apk-local-v6')
          s = s.replace('href="index.html"', 'href="terminal-home.html"')
          p.write_text(s, encoding='utf-8')
          print('Terminal APK: local terminal + direct auth + simplified Watchlist enabled')
          PY
          cp www/terminal.html www/index.html
          test ! -e www/aura-account.js
          test ! -e www/terminal-auth-guard.js
          ! grep -qi "aura-account.js" www/terminal.html
          ! grep -qi "terminal-auth-guard.js" www/terminal.html
          ! grep -qi "Website login required before terminal login" www/terminal.html
          test -f www/terminal-home.html

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Android screen-share layer
        run: |
          cp -R android-overrides/app/src/main/* android/app/src/main/
          python3 android-overrides/patch_android.py

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-farming-terminal-local-v6-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
