name: Build Course Era APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp *.html *.js *.css www/

      - name: Isolate terminal APK authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/terminal.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>\n', '')
          s = s.replace('<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>\n', '')
          s = s.replace('<script src="firebase-config.js?v=7"></script>\n', '')
          s = s.replace('<script src="aura-account.js"></script>\n', '')
          p.write_text(s, encoding='utf-8')
          print('Terminal APK: removed website/Firebase auth bridge')
          PY
          grep -q "aura-account.js" www/terminal.html && exit 1 || true
          grep -q "Website login required before terminal login" www/terminal.html && exit 1 || true

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Android screen-share layer
        run: |
          cp -R android-overrides/app/src/main/* android/app/src/main/
          python3 android-overrides/patch_android.py

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-farming-terminal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
