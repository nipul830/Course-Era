name: Build Course Era APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "firebase-config.js"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-android.yml"
      - "android-overrides/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp *.html *.js *.css www/

      - name: Add Android platform
        run: npx cap add android

      - name: Apply native Android screen-share layer
        run: |
          cp -R android-overrides/app/src/main/* android/app/src/main/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          dep='implementation "com.squareup.okhttp3:okhttp:4.12.0"'
          if dep not in s:
              s=s.replace("dependencies {", "dependencies {\\n    "+dep)
          p.write_text(s)
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "FOREGROUND_SERVICE_MEDIA_PROJECTION" not in s:
              s=s.replace("<manifest", '<manifest', 1)
              s=s.replace(">", '>\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />', 1)
              s=s.replace("</application>", '    <service android:name=".ScreenShareService" android:exported="false" android:foregroundServiceType="mediaProjection" />\\n    </application>')
          p.write_text(s)
          PY

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: course-era-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
