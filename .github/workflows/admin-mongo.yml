name: Deploy Admin Payment MongoDB

on:
  workflow_run:
    workflows: ["Deploy to VPS"]
    types: [completed]

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Patch admin payment storage to MongoDB
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          command_timeout: 5m
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main

            echo "===== PREPARE ADMIN MONGODB PAYMENT STORAGE ====="
            cd backend
            npm install
            node --check prepare-admin-mongo.js
            node prepare-admin-mongo.js
            node --check server.js

            export FIREBASE_PROJECT_ID='courseera-22425'
            export GOOGLE_CLOUD_PROJECT='courseera-22425'
            export GOOGLE_APPLICATION_CREDENTIALS='/etc/secrets/firebase-service-account.json'
            export FIREBASE_SERVICE_ACCOUNT_JSON=''
            export ADMIN_EMAILS='lipupoddar@gmail.com'

            echo "===== RESTART API ====="
            pm2 restart course-era-api --update-env
            sleep 5

            echo "===== HEALTH ====="
            curl -fsS --max-time 10 http://127.0.0.1:3000/health
            echo

            echo "===== CHALLENGE API ====="
            RESULT=$(curl -fsS --max-time 10 http://127.0.0.1:3000/api/challenges)
            echo "$RESULT"
            node -e 'const d=JSON.parse(process.argv[1]); if(!Array.isArray(d.challenges)||!d.challenges.length) process.exit(1); console.log("MONGODB_CHALLENGE_API_OK="+d.challenges.length);' "$RESULT"

            echo "===== ADMIN MONGODB PAYMENT STORAGE READY ====="
            pm2 save
