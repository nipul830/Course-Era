name: Repair trading server

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix trading auth, phase progression and response handling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe server repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          old = s
          s = s.replace('/2\\\\s*step|two\\\\s*step|2-step/i', '/2\\s*step|two\\s*step|2-step/i')
          s = s.replace('/phase\\\\s*1/i', '/phase\\s*1/i')
          marker = 'app.post("/api/trading/orders", requireTerminalAuth, async (req,res) => {\n  try {'
          replacement = 'app.post("/api/trading/orders", requireTerminalAuth, async (req,res) => {\n  try {\n    if (!req.terminal?.uid || !req.terminal?.accountId || !req.terminal?.accountRef) {\n      return res.status(401).json({ error: "Valid terminal session is required" });\n    }'
          if marker in s and 'Valid terminal session is required' not in s:
              s = s.replace(marker, replacement, 1)
          marker2 = 'app.use((err, req, res, next) => {\n'
          replacement2 = 'app.use((err, req, res, next) => {\n  if (res.headersSent) return next(err);\n'
          if marker2 in s and 'if (res.headersSent) return next(err);' not in s:
              s = s.replace(marker2, replacement2, 1)
          if s == old:
              print('No textual repair required')
          else:
              p.write_text(s)
              print('Server repairs applied')
          PY

      - name: Validate
        run: node --check backend/server.js

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix trading auth, phase progression and response handling'
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/repair-server.yml
          git commit -m 'Remove temporary repair workflow'
          git push
