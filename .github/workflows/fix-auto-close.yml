name: Fix instant auto close

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove order-time reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          old = '    refreshTradingAccount(req.user.uid,quotes).catch(()=>{});'
          if old not in s:
              raise SystemExit('Target line not found; refusing to modify server.js')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY

      - name: Validate and commit
        run: |
          node --check backend/server.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git commit -m "Stop immediate trade reconciliation after order"
          git push
