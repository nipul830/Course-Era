name: Position Tab Fix

on:
  push:
    paths:
      - '.github/workflows/position-tab-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch position tab persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('position.html')
          s = p.read_text()
          old = "let currentTab='open';"
          new = "let currentTab=sessionStorage.getItem('auraPositionTab')||'open';"
          if old not in s:
              raise SystemExit('currentTab marker not found')
          s = s.replace(old, new, 1)
          old2 = "document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));renderCurrentTab();}));"
          new2 = "document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===currentTab)); document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{currentTab=btn.dataset.tab;sessionStorage.setItem('auraPositionTab',currentTab);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));renderCurrentTab();}));"
          if old2 not in s:
              raise SystemExit('tab listener marker not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add position.html
          git diff --cached --quiet || git commit -m 'Fix closed tab persistence on refresh'
          git push
# retrigger
