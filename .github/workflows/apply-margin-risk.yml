name: Apply margin risk patch

on:
  push:
    paths:
      - '.github/workflows/apply-margin-risk.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: node scripts/apply-margin-risk.js

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js position.html .github/workflows/apply-margin-risk.yml scripts/apply-margin-risk.js
          git commit -m "Add automatic leverage margin and risk metrics [skip ci]"
          git push
