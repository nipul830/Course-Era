name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Deploy MongoDB-only backend to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          command_timeout: 5m
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main

            echo "===== REMOVE FIREBASE CLIENT SDK TAGS ====="
            node scripts/remove-firebase-client.mjs

            echo "===== INSTALL BACKEND ====="
            cd backend
            npm install

            echo "===== APPLY MONGODB-ONLY RUNTIME MIGRATION ====="
            node --check prepare-all-mongo.mjs
            node prepare-all-mongo.mjs
            node --check server.js

            echo "===== SANITIZE LEGACY FIREBASE ENV REFERENCES ====="
            node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const p="server.js"; let s=readFileSync(p,"utf8"); s=s.replace(/process\\.env\\.FIREBASE_[A-Z0-9_]+/g,"undefined").replace(/process\\.env\\.GOOGLE_APPLICATION_CREDENTIALS/g,"undefined").replace(/FIREBASE_SERVICE_ACCOUNT_JSON/g,"LEGACY_FIREBASE_SERVICE_ACCOUNT_DISABLED").replace(/FIREBASE_STORAGE_BUCKET/g,"LEGACY_FIREBASE_STORAGE_DISABLED").replace(/FIREBASE_PROJECT_ID/g,"LEGACY_FIREBASE_PROJECT_DISABLED"); writeFileSync(p,s); console.log("LEGACY_FIREBASE_ENV_SANITIZED=OK");'
            node --check server.js

            echo "===== PREPARE MONGODB CATALOG ====="
            node --check prepare-mongo.js
            node prepare-mongo.js
            node --check server.js

            echo "===== PREPARE PASSWORD RESET ====="
            node ensure-password-reset.mjs
            node --check server.js

            echo "===== APPLY TRADING RISK ENGINE ====="
            node --check apply-trading-risk-engine.mjs
            node apply-trading-risk-engine.mjs
            node --check server.js

            if [ -f /root/Course-Era/backend/.env ]; then
              set -a
              . /root/Course-Era/backend/.env
              set +a
            fi
            export MONGO_URI="${MONGO_URI:-mongodb://127.0.0.1:27017/courseera}"
            export MONGO_DB_NAME="${MONGO_DB_NAME:-courseera}"
            export ADMIN_EMAIL="${ADMIN_EMAIL:-lipupoddar@gmail.com}"

            echo "===== REMOVE OLD FIREBASE CREDENTIALS ====="
            rm -f /etc/secrets/firebase-service-account.json
            unset FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_STORAGE_BUCKET FIREBASE_PROJECT_ID GOOGLE_APPLICATION_CREDENTIALS GOOGLE_CLOUD_PROJECT

            echo "===== VERIFY FIREBASE IS NOT USED BY SERVER ====="
            if grep -q 'from "firebase-admin"' server.js; then
              echo "ERROR: firebase-admin import still present after migration"
              exit 1
            fi
            if grep -qE 'process\.env\.FIREBASE_|FIREBASE_SERVICE_ACCOUNT_JSON|FIREBASE_STORAGE_BUCKET|FIREBASE_PROJECT_ID|GOOGLE_APPLICATION_CREDENTIALS' server.js; then
              echo "ERROR: Firebase environment access still present in server.js"
              exit 1
            fi
            echo "MONGODB_ONLY_SERVER=OK"

            echo "===== MONGODB ADMIN ====="
            if [ -n "${ADMIN_PASSWORD:-}" ]; then
              node ensure-admin-mongo.mjs
            else
              echo "MONGO_ADMIN_BOOTSTRAP=SKIPPED (set ADMIN_PASSWORD in backend/.env to create/update the admin password)"
            fi

            echo "===== CLEAN PM2 ENV AND RESTART ====="
            pm2 delete course-era-api 2>/dev/null || true
            cd /root/Course-Era/backend
            pm2 start server.js --name course-era-api --cwd /root/Course-Era/backend
            sleep 5

            echo "===== HEALTH ====="
            curl -fsS --max-time 10 http://127.0.0.1:3000/health
            echo

            echo "===== MONGODB CHALLENGE API ====="
            RESULT=$(curl -fsS --max-time 10 http://127.0.0.1:3000/api/challenges)
            echo "$RESULT"
            node -e 'const d=JSON.parse(process.argv[1]); if(!Array.isArray(d.challenges)||!d.challenges.length) process.exit(1); console.log("MONGODB_CHALLENGE_API_OK="+d.challenges.length);' "$RESULT"

            echo "===== AUTH CONFIG SMOKE CHECK ====="
            CONFIG=$(curl -fsS --max-time 10 http://127.0.0.1:3000/api/config)
            echo "$CONFIG"
            echo "$CONFIG" | grep -q '\"mongoConfigured\":true'
            echo "$CONFIG" | grep -q '\"firebaseConfigured\":false'

            pm2 save
            pm2 status

      - name: Verify VPS email configuration
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          command_timeout: 1m
          script: |
            set -e
            KEY=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s).find(x=>x.name==="course-era-api");process.stdout.write(String(p?.pm2_env?.env?.RESEND_API_KEY||""));}catch{}})')
            if [ -z "$KEY" ]; then
              echo "RESEND_API_KEY_STATUS=MISSING_FROM_PM2_ENV"
              exit 0
            fi
            echo "RESEND_API_KEY_STATUS=PRESENT"
