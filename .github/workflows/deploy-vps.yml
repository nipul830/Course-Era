name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main

            # Account isolation patch: trading data must live under the
            # selected tradingAccounts/{accountId} document, not the shared
            # users/{uid}/trading/account document.
            echo '' | base64 -d > /tmp/apply.py
            python3 /tmp/apply.py
            node --check backend/server.js
            if ! git diff --quiet -- backend/server.js; then
              git add backend/server.js
              git commit -m 'Fix account-specific trading data isolation' || true
              git push origin main || echo 'GitHub push skipped; VPS deployment still uses patched code.'
            fi

            # Capital-based margin enforcement: crypto 1:10, gold 1:50, forex 1:100.
            echo ' bmV3LDEpCnAud3JpdGVfdGV4dChzKQo=' | base64 -d > /tmp/apply-margin.py
            python3 /tmp/apply-margin.py
            node --check backend/server.js
            if ! git diff --quiet -- backend/server.js; then
              git add backend/server.js
              git commit -m 'Enforce capital based trading margin' || true
              git push origin main || echo 'GitHub push skipped; VPS already has patched backend.'
            fi

            node backend/ensure-password-reset.mjs
            cd backend
            npm install

            RESEND_API_KEY_VALUE=""
            for env_file in /root/Course-Era/backend/.env /root/Course-Era/.env /root/.env; do
              if [ -f "$env_file" ]; then
                candidate=$(grep -E '^RESEND_API_KEY=' "$env_file" | tail -n 1 | cut -d= -f2- | tr -d '\r')
                candidate="${candidate#\"}"; candidate="${candidate%\"}"
                candidate="${candidate#\'}"; candidate="${candidate%\'}"
                if [ -n "$candidate" ]; then
                  RESEND_API_KEY_VALUE="$candidate"
                  break
                fi
              fi
            done

            if [ -n "$RESEND_API_KEY_VALUE" ]; then
              export RESEND_API_KEY="$RESEND_API_KEY_VALUE"
            fi
            export RESEND_FROM_EMAIL='Aura Farming <noreply@aurafirming.in>'
            pm2 restart course-era-api --update-env
            pm2 save

      - name: Verify VPS email configuration
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          script: |
            set -e
            KEY=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s).find(x=>x.name==="course-era-api");process.stdout.write(String(p?.pm2_env?.env?.RESEND_API_KEY||""));}catch{}})')
            if [ -z "$KEY" ]; then
              echo "RESEND_API_KEY_STATUS=MISSING_FROM_PM2_ENV"
              exit 0
            fi
            echo "RESEND_API_KEY_STATUS=PRESENT"
            DOMAIN_RESULT=$(curl -fsS -H "Authorization: Bearer $KEY" https://api.resend.com/domains)
            node -e 'const d=JSON.parse(process.argv[1]); const x=(d.data||[]).find(v=>v.name==="aurafirming.in"); console.log("RESEND_DOMAIN_STATUS="+(x?.status||"NOT_FOUND")); console.log("RESEND_DOMAIN_SENDING="+(x?.capabilities?.sending||"UNKNOWN"));' "$DOMAIN_RESULT"
