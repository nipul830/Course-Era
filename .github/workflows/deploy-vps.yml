name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          script_stop: true
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main
            node backend/ensure-password-reset.mjs
            node --check backend/server.js
            cd backend
            npm install
            export RESEND_FROM_EMAIL='Aura Farming <noreply@aurafirming.in>'
            pm2 restart course-era-api --update-env
            pm2 save
