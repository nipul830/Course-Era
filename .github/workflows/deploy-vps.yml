name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main
            node backend/ensure-password-reset.mjs
            node backend/fix-selected-account-trades.mjs
            node --check backend/server.js

            # Fast navigation cache: serve the already-loaded terminal/position
            # shell immediately while the browser refreshes it in background.
            cat > sw.js <<'SWEOF'
            const CACHE='aura-speed-v1';
            const CORE=['/terminal.html','/position.html','/aura.css','/aura-account.js','/firebase-config.js'];
            function accountKey(request){
              try{
                const h=request.headers.get('Authorization')||'';
                const token=h.startsWith('Bearer ')?h.slice(7):'';
                const p=token.split('.')[1];
                if(!p)return '';
                const raw=p.replace(/-/g,'+').replace(/_/g,'/');
                const json=atob(raw+'='.repeat((4-raw.length%4)%4));
                const payload=JSON.parse(json);
                return String(payload.accountId||'');
              }catch{return '';}
            }
            self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(CORE)).then(()=>self.skipWaiting())));
            self.addEventListener('activate',event=>event.waitUntil(self.clients.claim()));
            self.addEventListener('fetch',event=>{
              const request=event.request;
              if(request.method!=='GET')return;
              const url=new URL(request.url);
              if(url.origin!==self.location.origin)return;
              const isNavigation=request.mode==='navigate';
              const isCore=CORE.includes(url.pathname);
              const isHistory=url.pathname==='/api/trading/history';
              if(!isNavigation&&!isCore&&!isHistory)return;
              event.respondWith(caches.open(CACHE).then(async cache=>{
                let key=request;
                if(isNavigation)key='/'+(url.pathname.split('/').pop()||'terminal.html');
                if(isHistory){
                  const aid=accountKey(request);
                  if(aid)key=new Request(url.origin+url.pathname+'?__aura_account='+encodeURIComponent(aid));
                }
                const cached=await cache.match(key);
                const fresh=fetch(request).then(response=>{
                  if(response.ok)cache.put(key,response.clone());
                  return response;
                }).catch(()=>null);
                return cached||await fresh||new Response('Offline',{status:503});
              }));
            });
            SWEOF

            python3 - <<'PY'
            from pathlib import Path
            reg="<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));}</script>"
            for name in ('terminal.html','position.html'):
                p=Path(name)
                text=p.read_text()
                if '/sw.js' not in text:
                    p.write_text(text.replace('</body>',reg+'</body>',1))
            PY

            cd backend
            npm install

            RESEND_API_KEY_VALUE=""
            for env_file in /root/Course-Era/backend/.env /root/Course-Era/.env /root/.env; do
              if [ -f "$env_file" ]; then
                candidate=$(grep -E '^RESEND_API_KEY=' "$env_file" | tail -n 1 | cut -d= -f2- | tr -d '\r')
                candidate="${candidate#\"}"; candidate="${candidate%\"}"
                candidate="${candidate#\'}"; candidate="${candidate%\'}"
                if [ -n "$candidate" ]; then
                  RESEND_API_KEY_VALUE="$candidate"
                  break
                fi
              fi
            done

            if [ -n "$RESEND_API_KEY_VALUE" ]; then
              export RESEND_API_KEY="$RESEND_API_KEY_VALUE"
            fi
            export RESEND_FROM_EMAIL='Aura Farming <noreply@aurafirming.in>'
            pm2 restart course-era-api --update-env
            pm2 save

      - name: Verify VPS email configuration
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          script: |
            set -e
            KEY=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const p=JSON.parse(s).find(x=>x.name==="course-era-api");process.stdout.write(String(p?.pm2_env?.env?.RESEND_API_KEY||""));}catch{}})')
            if [ -z "$KEY" ]; then
              echo "RESEND_API_KEY_STATUS=MISSING_FROM_PM2_ENV"
              exit 0
            fi
            echo "RESEND_API_KEY_STATUS=PRESENT"
            DOMAIN_RESULT=$(curl -fsS -H "Authorization: Bearer $KEY" https://api.resend.com/domains)
            node -e 'const d=JSON.parse(process.argv[1]); const x=(d.data||[]).find(v=>v.name==="aurafirming.in"); console.log("RESEND_DOMAIN_STATUS="+(x?.status||"NOT_FOUND")); console.log("RESEND_DOMAIN_SENDING="+(x?.capabilities?.sending||"UNKNOWN"));' "$DOMAIN_RESULT"
