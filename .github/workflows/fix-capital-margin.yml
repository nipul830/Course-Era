name: Enforce capital based trading margin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch trading margin guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()

          if 'const marginLeverage = kind =>' in s:
              print('Margin guard already present')
              raise SystemExit(0)

          anchor = '''    if ((data.status||"active")!=="active") return res.status(403).json({error:"Trading account is not active",status:data.status||"inactive"});
              if (req.terminal?.terminalRole !== "trader") return res.status(403).json({error:"Investor password is read-only. Use the trading password to place orders."});
              const positionRef=ref.collection("positions").doc();'''
          replacement = '''    if ((data.status||"active")!=="active") return res.status(403).json({error:"Trading account is not active",status:data.status||"inactive"});
              if (req.terminal?.terminalRole !== "trader") return res.status(403).json({error:"Investor password is read-only. Use the trading password to place orders."});

              // Capital-based margin: crypto 1:10, gold 1:50, forex 1:100.
              const marginLeverage = kind => ({ crypto:10, gold:50, forex:100, "forex-jpy":100 }[String(kind||"")] || null);
              const orderSpec = MARKET_SYMBOLS[symbol];
              const orderLeverage = marginLeverage(orderSpec?.kind);
              let orderMargin = 0;
              let usedMargin = 0;
              if (orderLeverage) {
                const existingSnap = await ref.collection("positions").where("status","==","open").get();
                const existingSymbols = existingSnap.docs.map(d => d.data()?.symbol).filter(Boolean);
                const marginQuotes = await getMarketQuotes([...new Set([symbol, ...existingSymbols])]);
                const marginFor = (position, quote) => {
                  const spec = MARKET_SYMBOLS[position.symbol];
                  const leverage = marginLeverage(spec?.kind);
                  const lotSize = Number(position.lot || 0);
                  const price = Number(quote?.price || position.currentPrice || position.entryPrice || 0);
                  if (!spec || !leverage || !lotSize || !price) return 0;
                  const notional = spec.kind === "forex-jpy"
                    ? Math.abs(lotSize * spec.contractSize)
                    : Math.abs(price * lotSize * spec.contractSize);
                  return notional / leverage;
                };
                for (const doc of existingSnap.docs) {
                  usedMargin += marginFor(doc.data() || {}, marginQuotes[doc.data()?.symbol]);
                }
                orderMargin = marginFor({ symbol, lot, entryPrice }, marginQuotes[symbol]);
                const equity = Number(data.equity ?? (Number(data.balance ?? data.startingBalance ?? 0) + Number(data.openPnl ?? 0)));
                const freeMargin = equity - usedMargin;
                if (orderMargin > freeMargin + 0.01) {
                  return res.status(400).json({
                    error:"Insufficient free margin",
                    requiredMargin:Number(orderMargin.toFixed(2)),
                    usedMargin:Number(usedMargin.toFixed(2)),
                    freeMargin:Number(freeMargin.toFixed(2)),
                    leverage:orderLeverage
                  });
                }
              }

              const positionRef=ref.collection("positions").doc();'''
          if anchor not in s:
              raise SystemExit('Trading order anchor not found')
          s = s.replace(anchor, replacement, 1)

          old_set = '''      accountId:String(req.terminal.accountId),
      symbol, side, lot:Number(lot.toFixed(4)), entryPrice,
      stopLoss:stopLoss===null?null:Number(stopLoss), takeProfit:takeProfit===null?null:Number(takeProfit),
      status:"open", openedAt:now, updatedAt:now'''
          new_set = '''      accountId:String(req.terminal.accountId),
      symbol, side, lot:Number(lot.toFixed(4)), entryPrice,
      leverage:orderLeverage || null,
      marginUsed:orderMargin ? Number(orderMargin.toFixed(2)) : 0,
      stopLoss:stopLoss===null?null:Number(stopLoss), takeProfit:takeProfit===null?null:Number(takeProfit),
      status:"open", openedAt:now, updatedAt:now'''
          if old_set not in s:
              raise SystemExit('Position write anchor not found')
          s = s.replace(old_set, new_set, 1)

          p.write_text(s)
          PY
          node --check backend/server.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix capital based margin enforcement"
            git push
          fi
