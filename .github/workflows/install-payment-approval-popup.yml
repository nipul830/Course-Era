name: Install payment approval popup

on:
  push:
    branches: [main]
    paths:
      - 'payment-approval-popup.js'
      - '.github/workflows/install-payment-approval-popup.yml'
      - 'checkout.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject approval watcher into checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('checkout.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="payment-approval-popup.js?v=1"></script>'
          if marker not in s:
              if '</body>' not in s:
                  raise SystemExit('checkout.html does not contain </body>')
              s = s.replace('</body>', marker + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              print('APPROVAL_WATCHER=INJECTED')
          else:
              print('APPROVAL_WATCHER=ALREADY_PRESENT')
          PY

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet -- checkout.html; then
            echo 'No checkout change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout.html
          git commit -m 'Inject payment approval watcher into checkout'
          git push
