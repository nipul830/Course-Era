name: Patch Position Dashboard Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Position dashboard colors and tab spacing
        shell: python
        run: |
          from pathlib import Path
          p = Path('position.html')
          s = p.read_text(encoding='utf-8')
          old = '.account-top{background:#c99a00;color:#111;border-radius:0 0 20px 20px;margin:-22px -16px 16px;padding:0 0 7px;box-shadow:0 4px 14px #0002;overflow:hidden}'
          new = '.account-top{background:#050505;color:#fff;border-radius:0 0 20px 20px;margin:-22px -16px 16px;padding:0 0 7px;box-shadow:0 4px 14px #0008;overflow:hidden;border:1px solid #242424}'
          replacements = {
            old: new,
            '.account-summary .balance-main{font-size:18px;font-weight:900;color:#111}': '.account-summary .balance-main{font-size:18px;font-weight:900;color:#fff}',
            '.account-toggle{justify-self:end;width:34px;height:34px;border:0;border-radius:10px;background:rgba(0,0,0,.04);color:#111;font-size:22px;line-height:1;display:grid;place-items:center}': '.account-toggle{justify-self:end;width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}',
            '.account-detail .detail-label{display:block;color:#604b00;font-size:10px;font-weight:600;margin-bottom:3px}': '.account-detail .detail-label{display:block;color:#aaa;font-size:10px;font-weight:600;margin-bottom:3px}',
            '.account-detail .detail-value{display:block;color:#111;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}': '.account-detail .detail-value{display:block;color:#f5f5f5;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
            '.account-expanded-logout{grid-column:3;justify-self:end;border:0;background:rgba(0,0,0,.06);color:#111;border-radius:16px;padding:4px 9px;font-size:9px;font-weight:800}': '.account-expanded-logout{grid-column:3;justify-self:end;border:1px solid #333;background:#151515;color:#fff;border-radius:16px;padding:4px 9px;font-size:9px;font-weight:800}',
            '.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;': '.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;'
          }
          changed = False
          for a,b in replacements.items():
            if a in s:
              s = s.replace(a,b,1)
              changed = True
          if changed:
            p.write_text(s,encoding='utf-8')
          else:
            print('Position dashboard already patched or source changed; no modification made.')
      - name: Commit patch
        run: |
          if git diff --quiet -- position.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add position.html
          git commit -m 'Increase Position tab spacing'
          git push

# one-time trigger
