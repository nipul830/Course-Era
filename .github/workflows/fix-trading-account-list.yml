name: Fix trading account list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-trading-account-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch account list endpoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/server.js')
          text = path.read_text()

          old = '''app.get("/api/trading-accounts", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const base = db.collection("users").doc(req.user.uid);
    const snap = await base.collection("tradingAccounts").orderBy("createdAt", "desc").limit(5).get();
    const accounts = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));
    if (!accounts.length) {
      const current = await base.collection("trading").doc("account").get();
      if (current.exists) return res.json({ accounts:[{ id:current.id, ...(current.data() || {}) }] });
    }
    return res.json({ accounts });
  } catch (e) {
    return res.status(500).json({ error:"Could not load trading accounts", detail:e.message });
  }
});'''

          new = '''app.get("/api/trading-accounts", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const base = db.collection("users").doc(req.user.uid);

    // Keep every purchased account visible. Older purchases may exist only in
    // the legacy `trading/account` document, while newer purchases are stored
    // in `tradingAccounts/{accountId}`. Merge both sources and de-duplicate by
    // accountId so a new purchase never hides an older account.
    const [accountsSnap, currentSnap] = await Promise.all([
      base.collection("tradingAccounts").orderBy("createdAt", "desc").get(),
      base.collection("trading").doc("account").get()
    ]);

    const accounts = accountsSnap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));
    if (currentSnap.exists) {
      const current = { id:currentSnap.id, ...(currentSnap.data() || {}) };
      const currentAccountId = String(current.accountId || current.id || "");
      const alreadyListed = accounts.some(account => String(account.accountId || account.id || "") === currentAccountId);
      if (!alreadyListed && currentAccountId) accounts.push(current);
    }

    accounts.sort((a, b) => {
      const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
      const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
      return bTime - aTime;
    });

    return res.json({ accounts });
  } catch (e) {
    return res.status(500).json({ error:"Could not load trading accounts", detail:e.message });
  }
});'''

          if old not in text:
              if new in text:
                  print('Account list fix already applied.')
              else:
                  raise SystemExit('Target trading account endpoint not found; no changes made.')
          else:
              path.write_text(text.replace(old, new, 1))
              print('Trading account list endpoint patched.')

      - name: Add fast navigation cache
        shell: python
        run: |
          from pathlib import Path
          sw = r'''const CACHE='aura-speed-v1';
const CORE=['/terminal.html','/position.html','/aura.css','/aura-account.js','/firebase-config.js'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('fetch',e=>{
  const r=e.request;
  if(r.method!=='GET') return;
  const u=new URL(r.url);
  if(u.origin!==self.location.origin) return;
  if(r.mode==='navigate' || CORE.includes(u.pathname)){
    e.respondWith(caches.open(CACHE).then(async c=>{
      const key=r.mode==='navigate'?'/'+(u.pathname.split('/').pop()||'terminal.html'):r;
      const cached=await c.match(key);
      const fresh=fetch(r).then(res=>{if(res.ok)c.put(key,res.clone());return res}).catch(()=>null);
      return cached || await fresh || new Response('Offline',{status:503});
    }));
  }
});'''
          Path('sw.js').write_text(sw)
          reg="<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));}</script>"
          for name in ['terminal.html','position.html']:
              path=Path(name)
              text=path.read_text()
              if '/sw.js' not in text:
                  path.write_text(text.replace('</body>',reg+'</body>',1))
          print('Fast navigation cache added.')

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js sw.js terminal.html position.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve terminal and position navigation speed"
          git push origin HEAD:main
