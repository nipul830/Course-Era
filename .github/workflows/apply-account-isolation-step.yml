name: Apply account isolation step

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server account isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text()

          changes=0
          old='''    const accountRef = db.collection("users").doc(token.uid).collection("trading").doc("account");
    const accountSnap = await accountRef.get();
    const account = accountSnap.exists ? (accountSnap.data() || {}) : {};
    if (!accountSnap.exists || account.status !== "active") {'''
          new='''    const accountBase = db.collection("users").doc(token.uid);
    const accountRef = accountBase.collection("tradingAccounts").doc(String(token.accountId));
    const accountSnap = await accountRef.get();
    const account = accountSnap.exists ? (accountSnap.data() || {}) : {};
    if (!accountSnap.exists || account.accountId !== String(token.accountId) || account.status !== "active") {'''
          if old in s:
            s=s.replace(old,new,1); changes+=1

          old='''    const accountRef = db.collection("users").doc(String(credential.userId)).collection("trading").doc("account");
    const accountSnap = await accountRef.get();
    const account = accountSnap.exists ? (accountSnap.data() || {}) : {};
    if (!accountSnap.exists || account.accountId !== credential.accountId || account.status !== "active") {'''
          new='''    const accountRef = db.collection("users").doc(String(credential.userId)).collection("tradingAccounts").doc(String(credential.accountId));
    const accountSnap = await accountRef.get();
    const account = accountSnap.exists ? (accountSnap.data() || {}) : {};
    if (!accountSnap.exists || account.accountId !== credential.accountId || account.status !== "active") {'''
          if old in s:
            s=s.replace(old,new,1); changes+=1

          old='''async function loadTradingAccount(uid) {
  initFirebase();
  const ref = db.collection("users").doc(uid).collection("trading").doc("account");
  const snap = await ref.get();
  if (!snap.exists) throw new Error("Trading account not found");
  return { ref, data:snap.data() || {} };
}'''
          new='''async function loadTradingAccount(uid, accountId = "") {
  initFirebase();
  const userRef = db.collection("users").doc(uid);
  const id = String(accountId || "").trim();
  if (id) {
    const accountRef = userRef.collection("tradingAccounts").doc(id);
    const snap = await accountRef.get();
    if (snap.exists && String(snap.data()?.accountId || snap.id) === id) {
      return { ref:accountRef, data:snap.data() || {} };
    }
  }
  const ref = userRef.collection("trading").doc("account");
  const snap = await ref.get();
  if (!snap.exists) throw new Error("Trading account not found");
  return { ref, data:snap.data() || {} };
}'''
          if old in s:
            s=s.replace(old,new,1); changes+=1

          if 'loadTradingAccount(req.terminal.uid)' in s:
            s=s.replace('loadTradingAccount(req.terminal.uid)', 'loadTradingAccount(req.terminal.uid, req.terminal.accountId)')
            changes+=1

          old='''    await positionRef.set({
      symbol, side, lot:Number(lot.toFixed(4)), entryPrice,
      stopLoss:stopLoss===null?null:Number(stopLoss), takeProfit:takeProfit===null?null:Number(takeProfit),
      status:"open", openedAt:now, updatedAt:now
    });'''
          new='''    await positionRef.set({
      accountId:String(req.terminal.accountId),
      symbol, side, lot:Number(lot.toFixed(4)), entryPrice,
      stopLoss:stopLoss===null?null:Number(stopLoss), takeProfit:takeProfit===null?null:Number(takeProfit),
      status:"open", openedAt:now, updatedAt:now
    });'''
          if old in s:
            s=s.replace(old,new,1); changes+=1

          if changes == 0:
            print('Account isolation already applied; nothing to commit.')
            raise SystemExit(0)
          p.write_text(s)
          print('Applied account isolation changes:', changes)
          PY
          node --check backend/server.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git commit -m "Fix account-specific trading data isolation"
          git push origin main
