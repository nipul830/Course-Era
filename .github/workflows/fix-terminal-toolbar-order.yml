name: Fix terminal toolbar Close LIVE order

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix terminal toolbar order permanently' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply terminal toolbar and lot-size fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('terminal.html')
          s = p.read_text(encoding='utf-8')

          live = "const live=document.createElement('span');live.textContent='● LIVE';live.className='aura-chart-live';toolbar.appendChild(live);"
          countdown = "const countdown=document.createElement('span');countdown.id='auraCandleCountdown';countdown.className='aura-chart-countdown';countdown.textContent='—:—';toolbar.appendChild(countdown);"
          canvas = "const canvas=document.createElement('div');canvas.className='aura-chart-canvas';"

          close_block = '''const closeTradeBtn=document.createElement('button');
          closeTradeBtn.type='button';
          closeTradeBtn.id='chartToolbarCloseTrade';
          closeTradeBtn.className='chart-toolbar-close';
          closeTradeBtn.textContent='Close';
          closeTradeBtn.style.display='none';
          closeTradeBtn.addEventListener('click',ev=>{
            ev.preventDefault();
            ev.stopPropagation();
            const id=String(closeTradeBtn.dataset.positionId||'');
            const position=terminalPositions.find(x=>String(x.id)===id)||terminalPositions.find(x=>x&&x.symbol===currentSymbol);
            if(position)confirmCloseTrade(position);
          });
          toolbar.appendChild(closeTradeBtn);
          const live=document.createElement('span');live.textContent='● LIVE';live.className='aura-chart-live';toolbar.appendChild(live);
          const canvas=document.createElement('div');canvas.className='aura-chart-canvas';'''

          exact = countdown + "\n    " + live + "\n    " + canvas
          replacement = countdown + "\n    " + close_block
          if exact in s:
              s = s.replace(exact, replacement, 1)
          else:
              pattern = re.compile(
                  re.escape(countdown) + r"\s*" +
                  r"(?:const closeTradeBtn=.*?toolbar\.appendChild\(closeTradeBtn\);\s*)?" +
                  re.escape(live) + r"\s*" + re.escape(canvas),
                  re.S
              )
              m = pattern.search(s)
              if not m:
                  raise SystemExit('Expected chart toolbar block not found')
              s = s[:m.start()] + replacement + s[m.end():]

          old_update = '''function updateChartOrderActions(){\n  if(!chartOrderActions||!candleSeries)return;\n  updateChartRiskHandles();'''
          new_update = '''function updateChartToolbarCloseTrade(){\n  const btn=document.getElementById('chartToolbarCloseTrade');\n  if(!btn)return;\n  const positions=Array.isArray(terminalPositions)?terminalPositions.filter(p=>p&&p.symbol===currentSymbol&&p.id):[];\n  const position=positions[0]||null;\n  btn.style.display=position?'inline-flex':'none';\n  btn.dataset.positionId=position?String(position.id):'';\n}\nfunction updateChartOrderActions(){\n  if(!chartOrderActions||!candleSeries)return;\n  updateChartToolbarCloseTrade();\n  updateChartRiskHandles();'''
          if old_update in s and 'function updateChartToolbarCloseTrade()' not in s:
              s = s.replace(old_update, new_update, 1)

          s = s.replace(
              '.chart-close-btn{position:absolute;',
              '.chart-close-btn{display:none!important;position:absolute;',
              1
          )

          live_css = '.aura-chart-live{margin-left:auto;color:#00a875;font-size:9px;font-weight:900;white-space:nowrap}'
          new_css = '.aura-chart-live{margin-left:4px;color:#00a875;font-size:9px;font-weight:900;white-space:nowrap}.chart-toolbar-close{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;height:30px;min-width:44px;padding:0 9px;border:1px solid #e6004d;border-radius:8px;background:#e6004d;color:#fff;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer;touch-action:manipulation}.chart-toolbar-close:active{transform:scale(.96)}'
          if '.chart-toolbar-close{' not in s:
              if live_css in s:
                  s = s.replace(live_css, new_css, 1)

          # Keep the original MT5-style scroll selector; only change the default to 0.01.
          s = s.replace(
              '<label class="lot-control">Lot <input id="lotSize" type="number" min="0.01" step="0.01" value="0.01" inputmode="decimal" aria-label="Lot size"></label>',
              '<label class="lot-control">Lot <select id="lotSize" aria-label="Lot size"></select></label>',
              1
          )
          s = s.replace(
              '.lot-control input{width:70px;border:0;outline:0;background:transparent;text-align:center;font-size:13px;font-weight:800;color:#182332;padding:0}',
              '.lot-control select{width:70px;border:0;outline:0;background:transparent;text-align:center;font-size:13px;font-weight:800;color:#182332}',
              1
          )
          s = s.replace("Number(document.getElementById('lotSize')?.value||'0.10')", "Number(document.getElementById('lotSize')?.value||'0.01')", 1)

          # Restore the original 0.01-100.00 scroll selector if the previous editable-input patch removed it.
          if "const fillLots=()=>" not in s:
              marker = "})();\n\nconst symbolBtn=document.getElementById('symbolBtn'),symbolList=document.getElementById('symbolList');"
              generator = """(function(){
            const lot=document.getElementById('lotSize');
            if(lot){
              const fillLots=()=>{
                if(lot.options.length>1)return;
                const frag=document.createDocumentFragment();
                for(let i=1;i<=10000;i++){
                  const v=(i/100).toFixed(2),o=document.createElement('option');
                  o.value=v;o.textContent=v;if(v==='0.01')o.selected=true;frag.appendChild(o);
                }
                lot.appendChild(frag);
              };
              if('requestIdleCallback' in window)requestIdleCallback(fillLots,{timeout:1200});else setTimeout(fillLots,0);
            }
          })();

          const symbolBtn=document.getElementById('symbolBtn'),symbolList=document.getElementById('symbolList');"""
              if marker in s:
                  s = s.replace(marker, generator, 1)
          else:
              s = s.replace("if(v==='0.10')o.selected=true", "if(v==='0.01')o.selected=true", 1)

          p.write_text(s, encoding='utf-8')
          print('TERMINAL_TOOLBAR_ORDER=Close_then_LIVE')
          print('LOT_SIZE_DEFAULT=0.01_SCROLL_SELECTOR=true')

      - name: Apply readable purchased challenge rules
        shell: python
        run: |
          from pathlib import Path
          p = Path('courses.html')
          s = p.read_text(encoding='utf-8')
          old = """    const rules=(d.rules||{})[model]||[];
    const items=[['Challenge Type',account.challenge||'Purchased Account'],['Account Size',auraMoney(account.startingBalance)]];
    rules.forEach((rule,i)=>items.push(['Rule '+(i+1),rule]));
    box.innerHTML=items.map(x=>'<div class=\"rule-item\"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');"""
          new = """    const rules=(d.rules||{})[model]||[];
    const items=[['Challenge Type',account.challenge||'Purchased Account'],['Account Size',auraMoney(account.startingBalance)]];
    const labels={stage:'Stage',floatingLossEnabled:'Floating Loss',floatingLossPercent:'Floating Loss Limit',minimumTradingDays:'Minimum Trading Days',maxDailyLossPercent:'Max Daily Loss',dailyLossPercent:'Daily Loss Limit',overallLossPercent:'Overall Loss Limit',maxDrawdownPercent:'Max Drawdown Limit',profitTargetPercent:'Profit Target',profitTarget:'Profit Target',consistencyPercent:'Consistency Rule',newsTrading:'News Trading',weekendHolding:'Weekend Holding',minimumDays:'Minimum Trading Days',leverage:'Leverage',timeLimit:'Time Limit'};
    function prettyRule(rule){
      if(!rule || typeof rule!=='object') return String(rule ?? '—');
      const parts=[];
      for(const [key,val] of Object.entries(rule)){
        if(val===null || val===undefined || val==='') continue;
        const label=labels[key] || key.replace(/([A-Z])/g,' $1').replace(/^./,m=>m.toUpperCase());
        let value=val;
        if(typeof val==='boolean') value=val?'Allowed':'Not allowed';
        else if(typeof val==='number' && /percent|loss|drawdown|target|consistency/i.test(key)) value=val+'%';
        else if(typeof val==='object') value=JSON.stringify(val);
        parts.push(label+': '+value);
      }
      return parts.join(' • ') || '—';
    }
    rules.forEach((rule,i)=>items.push(['Rule '+(i+1),prettyRule(rule)]));
    box.innerHTML=items.map(x=>'<div class=\"rule-item\"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "function prettyRule(rule)" not in s:
              raise SystemExit('Expected purchased challenge rules renderer not found')
          p.write_text(s, encoding='utf-8')
          print('PURCHASED_CHALLENGE_RULES=READABLE')

      - name: Commit permanent fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.html courses.html
          git diff --cached --quiet && { echo "No terminal/course rules change needed"; exit 0; }
          git commit -m "fix terminal toolbar order permanently"
          git push
