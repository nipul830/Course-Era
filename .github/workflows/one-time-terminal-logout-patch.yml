name: One-time terminal logout patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-terminal-logout-patch.yml'
      - 'terminal.html'

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[terminal-logout-patch]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch terminal logout confirmation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('terminal.html')
          s=p.read_text()
          old="""document.getElementById('terminalLogout')?.addEventListener('click',()=>{
  terminalSessionToken='';
  if(marketWs){try{marketWs.close()}catch{}marketWs=null;}
  if(marketWsReconnectTimer){clearTimeout(marketWsReconnectTimer);marketWsReconnectTimer=null;}
  sessionStorage.removeItem('auraTerminalSession');
  sessionStorage.removeItem('auraTerminalRole');
  showTerminalLogin('');
});"""
          new="""function performTerminalLogout(){
  terminalSessionToken='';
  if(marketWs){try{marketWs.close()}catch{}marketWs=null;}
  if(marketWsReconnectTimer){clearTimeout(marketWsReconnectTimer);marketWsReconnectTimer=null;}
  sessionStorage.removeItem('auraTerminalSession');
  sessionStorage.removeItem('auraTerminalRole');
  sessionStorage.removeItem('auraTerminalAccount');
  window.location.href='index.html';
}

function showTerminalLogoutConfirm(){
  let modal=document.getElementById('terminalLogoutModal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='terminalLogoutModal';
    modal.className='terminal-logout-modal';
    modal.innerHTML='<div class="terminal-logout-card" role="dialog" aria-modal="true" aria-labelledby="terminalLogoutTitle"><h3 id="terminalLogoutTitle">Logout?</h3><p>Are you sure you want to logout from the terminal?</p><div class="terminal-logout-actions"><button type="button" class="terminal-logout-cancel" id="terminalLogoutCancel">❌ Cancel</button><button type="button" class="terminal-logout-confirm" id="terminalLogoutConfirm">✅ Logout</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('terminalLogoutCancel').addEventListener('click',()=>modal.classList.remove('open'));
    document.getElementById('terminalLogoutConfirm').addEventListener('click',()=>{modal.classList.remove('open');performTerminalLogout();});
    modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
  }
  modal.classList.add('open');
}

document.getElementById('terminalLogout')?.addEventListener('click',showTerminalLogoutConfirm);"""
          if old not in s:
              raise SystemExit('Expected terminal logout handler not found; refusing to modify file.')
          s=s.replace(old,new,1)
          css="""\n<style id=\"terminal-logout-modal-style\">\n.terminal-logout-modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10000;font-family:Arial,Helvetica,sans-serif}.terminal-logout-modal.open{display:flex}.terminal-logout-card{width:min(360px,92vw);background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 55px #0006}.terminal-logout-card h3{margin:0 0 8px;color:#182332;font-size:20px}.terminal-logout-card p{margin:0 0 18px;color:#687786;font-size:13px;line-height:1.45}.terminal-logout-actions{display:flex;gap:10px}.terminal-logout-actions button{flex:1;height:44px;border-radius:11px;font-size:13px;font-weight:800;cursor:pointer}.terminal-logout-cancel{border:1px solid #dce2e7;background:#f7f8fa;color:#344252}.terminal-logout-confirm{border:0;background:#e6b83f;color:#101010}\n</style>\n"""
          marker='</head>'
          if 'id="terminal-logout-modal-style"' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-terminal-logout-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add terminal.html .github/workflows/one-time-terminal-logout-patch.yml
          git commit -m '[terminal-logout-patch] Add terminal logout confirmation and dashboard redirect'
          git push
