name: Implement password reset OTP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-password-reset-otp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch backend and forgot password UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('backend/server.js')
          text = server.read_text()
          marker = 'app.use((err, req, res, next) => {'
          if '/api/auth/password-reset/request' not in text:
              block = r'''

          // Email OTP password reset. This changes only the Firebase Auth password;
          // the user's UID, email, profile, trading data and account records remain untouched.
          const PASSWORD_RESET_COLLECTION = "passwordResetOtps";
          const PASSWORD_RESET_TTL_MS = 10 * 60 * 1000;
          const PASSWORD_RESET_RESEND_COOLDOWN_MS = 60 * 1000;
          const PASSWORD_RESET_MAX_ATTEMPTS = 5;

          function passwordResetEmailKey(email) {
            return crypto.createHash("sha256").update(String(email).trim().toLowerCase()).digest("hex");
          }

          function passwordResetCodeHash(email, code) {
            const secret = process.env.RESEND_API_KEY || process.env.FIREBASE_SERVICE_ACCOUNT_JSON || "password-reset-fallback";
            return crypto.createHmac("sha256", String(secret))
              .update(passwordResetEmailKey(email) + ":" + String(code))
              .digest("hex");
          }

          function generatePasswordResetCode() {
            return String(crypto.randomInt(0, 1000000)).padStart(6, "0");
          }

          async function sendPasswordResetOtp(email, code) {
            const apiKey = String(process.env.RESEND_API_KEY || "").trim();
            if (!apiKey) throw new Error("RESEND_API_KEY is not configured");
            const from = process.env.RESEND_FROM_EMAIL || "Aura Farming <onboarding@resend.dev>";
            const response = await fetch("https://api.resend.com/emails", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + apiKey,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                from,
                to: [email],
                subject: "Aura Farming password reset code",
                html: `
                  <div style="font-family:Arial,sans-serif;max-width:520px;margin:auto;padding:24px;color:#111">
                    <h2 style="margin:0 0 12px">Aura Farming</h2>
                    <p>Use this verification code to reset your password:</p>
                    <div style="font-size:32px;font-weight:700;letter-spacing:8px;padding:18px 0">${code}</div>
                    <p style="color:#666">This code expires in 10 minutes and can be used only once.</p>
                    <p style="color:#666">If you did not request a password reset, you can ignore this email.</p>
                  </div>`
              })
            });
            if (!response.ok) {
              const detail = await response.text().catch(() => "");
              console.error("RESEND_EMAIL_ERROR", response.status, detail);
              throw new Error("Could not send reset email");
            }
          }

          app.post("/api/auth/password-reset/request", async (req, res) => {
            try {
              initFirebase();
              const email = String(req.body?.email || "").trim().toLowerCase();
              if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) {
                return res.status(400).json({ error: "Please enter a valid email address" });
              }

              // Do not reveal whether an account exists for a given email.
              let user;
              try {
                user = await admin.auth().getUserByEmail(email);
              } catch (e) {
                if (e?.code === "auth/user-not-found") {
                  return res.json({ message: "If an account exists for this email, a verification code has been sent.", next: "verify" });
                }
                throw e;
              }

              const ref = db.collection(PASSWORD_RESET_COLLECTION).doc(passwordResetEmailKey(email));
              const existing = await ref.get();
              const existingData = existing.exists ? existing.data() : {};
              const lastSentAt = Number(existingData?.sentAt || 0);
              if (lastSentAt && Date.now() - lastSentAt < PASSWORD_RESET_RESEND_COOLDOWN_MS) {
                return res.status(429).json({ error: "Please wait a minute before requesting another code" });
              }

              const code = generatePasswordResetCode();
              await ref.set({
                uid: user.uid,
                email,
                codeHash: passwordResetCodeHash(email, code),
                createdAt: Date.now(),
                sentAt: Date.now(),
                expiresAt: Date.now() + PASSWORD_RESET_TTL_MS,
                attempts: 0
              });

              try {
                await sendPasswordResetOtp(email, code);
              } catch (emailError) {
                await ref.delete().catch(() => {});
                console.error("PASSWORD_RESET_EMAIL_ERROR", emailError);
                return res.status(502).json({ error: "Could not send the verification email. Please try again." });
              }

              res.json({ message: "If an account exists for this email, a verification code has been sent.", next: "verify" });
            } catch (e) {
              console.error("PASSWORD_RESET_REQUEST_ERROR", e);
              res.status(500).json({ error: "Could not start password reset" });
            }
          });

          app.post("/api/auth/password-reset/confirm", async (req, res) => {
            try {
              initFirebase();
              const email = String(req.body?.email || "").trim().toLowerCase();
              const code = String(req.body?.code || "").trim();
              const password = String(req.body?.password || "");
              const confirmPassword = String(req.body?.confirmPassword || "");

              if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: "Please enter a valid email address" });
              if (!/^\\d{6}$/.test(code)) return res.status(400).json({ error: "Enter the 6-digit verification code" });
              if (password.length < 8) return res.status(400).json({ error: "New password must be at least 8 characters" });
              if (password !== confirmPassword) return res.status(400).json({ error: "Passwords do not match" });

              const ref = db.collection(PASSWORD_RESET_COLLECTION).doc(passwordResetEmailKey(email));
              const snap = await ref.get();
              if (!snap.exists) return res.status(400).json({ error: "Invalid or expired verification code" });

              const data = snap.data() || {};
              if (Number(data.expiresAt || 0) < Date.now()) {
                await ref.delete().catch(() => {});
                return res.status(400).json({ error: "Verification code has expired. Request a new code." });
              }
              if (Number(data.attempts || 0) >= PASSWORD_RESET_MAX_ATTEMPTS) {
                await ref.delete().catch(() => {});
                return res.status(429).json({ error: "Too many incorrect attempts. Request a new code." });
              }

              const suppliedHash = passwordResetCodeHash(email, code);
              if (String(data.codeHash || "") !== suppliedHash) {
                await ref.update({ attempts: admin.firestore.FieldValue.increment(1) });
                return res.status(400).json({ error: "Invalid verification code" });
              }

              const user = await admin.auth().getUserByEmail(email);
              if (user.uid !== data.uid) return res.status(400).json({ error: "Invalid password reset request" });

              await admin.auth().updateUser(user.uid, { password });
              await admin.auth().revokeRefreshTokens(user.uid);
              await ref.delete();

              res.json({ message: "Password reset successfully. Please log in with your new password." });
            } catch (e) {
              console.error("PASSWORD_RESET_CONFIRM_ERROR", e);
              res.status(500).json({ error: "Could not reset password" });
            }
          });
          '''
              text = text.replace(marker, block + '\n' + marker, 1)
              server.write_text(text)

          forgot = Path('forgot-password.html')
          forgot.write_text(r'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Forgot Password — Aura Farming</title>
            <link rel="stylesheet" href="styles.css">
            <style>
              .auth-card{max-width:430px}.msg{min-height:22px}.hidden{display:none!important}
              .hint{font-size:13px;color:#777;line-height:1.45}.code{letter-spacing:6px;text-align:center;font-size:20px}
            </style>
          </head>
          <body>
            <div class="auth-wrap"><div class="auth-card">
              <a class="brand" href="index.html">Aura <span>Farming</span></a>
              <h1>Reset password</h1>
              <p>Enter your account email and we’ll send a verification code.</p>
              <form id="requestForm">
                <label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
                <button id="sendBtn" class="btn primary full" type="submit">Send code</button>
              </form>
              <form id="confirmForm" class="hidden" style="margin-top:16px">
                <label>Verification code<input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required placeholder="000000"></label>
                <label>New password<input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimum 8 characters"></label>
                <label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter password again"></label>
                <button id="resetBtn" class="btn primary full" type="submit">Reset password</button>
              </form>
              <p id="resetMsg" class="msg"></p>
              <p id="hint" class="hint hidden">The verification code is valid for 10 minutes. If you request another code, wait one minute between requests.</p>
              <a class="back" href="login.html">Back to login</a>
            </div></div>
            <script>
              const requestForm=document.getElementById("requestForm"),confirmForm=document.getElementById("confirmForm");
              const emailEl=document.getElementById("email"),codeEl=document.getElementById("code");
              const sendBtn=document.getElementById("sendBtn"),resetBtn=document.getElementById("resetBtn");
              const msg=document.getElementById("resetMsg"),hint=document.getElementById("hint");
              const api=path=>path;
              requestForm.addEventListener("submit",async e=>{
                e.preventDefault(); sendBtn.disabled=true; msg.textContent="Sending verification code…";
                try{
                  const r=await fetch(api("/api/auth/password-reset/request"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:emailEl.value.trim()})});
                  const d=await r.json().catch(()=>({}));
                  if(!r.ok) throw new Error(d.error||"Could not send verification code");
                  msg.textContent="If an account exists for this email, a verification code has been sent. Check your inbox and spam folder.";
                  confirmForm.classList.remove("hidden"); hint.classList.remove("hidden"); codeEl.focus();
                }catch(err){msg.textContent=err.message||"Could not send verification code. Please try again.";}
                finally{sendBtn.disabled=false;}
              });
              confirmForm.addEventListener("submit",async e=>{
                e.preventDefault(); resetBtn.disabled=true; msg.textContent="Resetting password…";
                try{
                  const r=await fetch(api("/api/auth/password-reset/confirm"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:emailEl.value.trim(),code:codeEl.value.trim(),password:document.getElementById("password").value,confirmPassword:document.getElementById("confirmPassword").value})});
                  const d=await r.json().catch(()=>({}));
                  if(!r.ok) throw new Error(d.error||"Could not reset password");
                  msg.textContent="Password reset successfully. Redirecting to login…";
                  setTimeout(()=>location.href="login.html",900);
                }catch(err){msg.textContent=err.message||"Could not reset password. Please try again.";}
                finally{resetBtn.disabled=false;}
              });
            </script>
          </body></html>
          ''')
          PY

      - name: Validate
        run: node --check backend/server.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js forgot-password.html
          git diff --cached --quiet || git commit -m "Add email OTP password reset flow"
          git push

      - name: Remove patch workflow
        run: |
          git rm -f .github/workflows/implement-password-reset-otp.yml
          git commit -m "Remove one-time password reset patch workflow"
          git push
