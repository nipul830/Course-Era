name: Patch close popup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[close-popup-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale close response
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('position.html')
          s=p.read_text()
          old="catch(e){btn.disabled=false;btn.textContent='Close Trade';alert(e.message)}"
          new="catch(e){btn.disabled=false;btn.textContent='Close Trade';if(String(e&&e.message||'').toLowerCase().includes('already closed')){tabData.open=(tabData.open||[]).filter(x=>String(x.id)!==String(btn.dataset.id));livePositions=tabData.open;renderCurrentTab();loadPositions().catch(()=>{});return;}alert(e.message)}"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add position.html
          git commit -m 'Fix stale close popup [close-popup-patched]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/patch-close-popup.yml
          git commit -m 'Remove temporary close popup workflow [close-popup-patched]'
          git push
