name: Fix legacy dashboard account list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-legacy-account-list.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch legacy account API
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()

          old = '''app.get("/api/trading-accounts", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const base = db.collection("users").doc(req.user.uid);
    const snap = await base.collection("tradingAccounts").orderBy("createdAt", "desc").limit(5).get();
    const accounts = snap.docs.map(d => ({ id:d.id, ...(d.data() || {}) }));
    if (!accounts.length) {
      const current = await base.collection("trading").doc("account").get();
      if (current.exists) return res.json({ accounts:[{ id:current.id, ...(current.data() || {}) }] });
    }
    return res.json({ accounts });
  } catch (e) {
    return res.status(500).json({ error:"Could not load trading accounts", detail:e.message });
  }
});'''

          new = '''app.get("/api/trading-accounts", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const base = db.collection("users").doc(req.user.uid);
    const [accountsSnap, legacySnap, currentSnap] = await Promise.all([
      base.collection("tradingAccounts").orderBy("createdAt", "desc").get(),
      base.collection("challengeAccounts").orderBy("createdAt", "desc").get(),
      base.collection("trading").doc("account").get()
    ]);

    const byId = new Map();
    const add = (a) => {
      const id = String(a.accountId || a.id || "").trim();
      if (id && !byId.has(id)) byId.set(id, { id, ...a, accountId:id });
    };

    accountsSnap.docs.forEach(d => add({ id:d.id, ...(d.data() || {}) }));
    legacySnap.docs.forEach(d => {
      const x = d.data() || {};
      const size = Number(x.accountSize || x.startingBalance || x.size || 0);
      add({
        id:d.id,
        accountId:String(x.accountId || d.id),
        startingBalance:size,
        balance:Number(x.balance ?? size),
        equity:Number(x.equity ?? x.balance ?? size),
        pnl:Number(x.pnl || 0),
        currency:x.currency || "USD",
        challenge:x.challenge || ((x.model || "") + (x.size ? " " + x.size : "")),
        challengeId:x.challengeId,
        status:x.status || "active",
        terminalCredentialId:x.terminalCredentialId,
        createdAt:x.createdAt,
        updatedAt:x.updatedAt
      });
    });
    if (currentSnap.exists) add({ id:currentSnap.id, ...(currentSnap.data() || {}) });

    const accounts = Array.from(byId.values()).sort((a,b) => {
      const at = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
      const bt = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
      return bt - at;
    });
    return res.json({ accounts });
  } catch (e) {
    return res.status(500).json({ error:"Could not load trading accounts", detail:e.message });
  }
});'''

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Legacy account list target not found')

          old2 = '''app.post("/api/trading-account/select", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const accountId = String(req.body?.accountId || "").trim();
    if (!accountId) return res.status(400).json({ error:"accountId is required" });
    const userRef = db.collection("users").doc(req.user.uid);
    const selectedRef = userRef.collection("tradingAccounts").doc(accountId);
    const selectedSnap = await selectedRef.get();
    if (!selectedSnap.exists) return res.status(404).json({ error:"Trading account not found" });
    const selected = selectedSnap.data() || {};
    if (selected.status && selected.status !== "active") return res.status(403).json({ error:"Trading account is not active" });
    await userRef.collection("trading").doc("account").set(selected, { merge:false });
    return res.json({ account:{ id:accountId, ...selected } });
  } catch (e) {
    return res.status(500).json({ error:"Could not select trading account", detail:e.message });
  }
});'''

          new2 = '''app.post("/api/trading-account/select", requireAuth, async (req, res) => {
  try {
    initFirebase();
    const accountId = String(req.body?.accountId || "").trim();
    if (!accountId) return res.status(400).json({ error:"accountId is required" });
    const userRef = db.collection("users").doc(req.user.uid);
    const selectedRef = userRef.collection("tradingAccounts").doc(accountId);
    let selectedSnap = await selectedRef.get();

    if (!selectedSnap.exists) {
      const legacySnap = await userRef.collection("challengeAccounts").doc(accountId).get();
      if (!legacySnap.exists) return res.status(404).json({ error:"Trading account not found" });
      const x = legacySnap.data() || {};
      const size = Number(x.accountSize || x.startingBalance || x.size || 0);
      await selectedRef.set({
        accountId,
        startingBalance:size,
        balance:Number(x.balance ?? size),
        equity:Number(x.equity ?? x.balance ?? size),
        pnl:Number(x.pnl || 0),
        currency:x.currency || "USD",
        challenge:x.challenge || ((x.model || "") + (x.size ? " " + x.size : "")),
        challengeId:x.challengeId,
        status:x.status || "active",
        terminalCredentialId:x.terminalCredentialId,
        createdAt:x.createdAt,
        updatedAt:admin.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      selectedSnap = await selectedRef.get();
    }

    const selected = selectedSnap.data() || {};
    if (selected.status && selected.status !== "active") return res.status(403).json({ error:"Trading account is not active" });
    await userRef.collection("trading").doc("account").set(selected, { merge:false });
    return res.json({ account:{ id:accountId, ...selected } });
  } catch (e) {
    return res.status(500).json({ error:"Could not select trading account", detail:e.message });
  }
});'''

          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit('Legacy account select target not found')

          p.write_text(s)
          print('Legacy account support patched successfully.')

      - name: Commit and push server fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          if git diff --cached --quiet; then
            echo "No server changes needed."
            exit 0
          fi
          git commit -m "Fix dashboard legacy account visibility"
          git push origin HEAD:main