name: Fix password reset regex escapes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-reset-regex-2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix OTP regex escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          start = s.index('// Email OTP password reset.')
          end = s.index('app.use((err, req, res, next) => {', start)
          block = s[start:end]
          block = block.replace(chr(92)+chr(92), chr(92))
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          node --check backend/server.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --quiet || git commit -m "Fix password reset OTP validation"
          git push
      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/fix-password-reset-regex-2.yml
          git commit -m "Remove password reset regex patch workflow"
          git push
