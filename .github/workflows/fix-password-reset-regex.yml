name: Fix password reset regex

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-reset-regex.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          s = p.read_text()
          s = s.replace(chr(92) + chr(92) + 's', chr(92) + 's')
          p.write_text(s)
          PY
          node --check backend/server.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --quiet || git commit -m "Fix password reset email validation"
          git push
      - name: Remove one-time workflow
        run: |
          git rm -f .github/workflows/fix-password-reset-regex.yml
          git commit -m "Remove password reset regex patch workflow"
          git push
