name: Fix Rules Display
on:
  push:
    paths:
      - '.deploy-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix challenge rules rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('courses.html')
          s = p.read_text(encoding='utf-8')
          old = '''    const items=[['Challenge Type',account.challenge||'Purchased Account'],['Account Size',auraMoney(account.startingBalance)]];
    rules.forEach((rule,i)=>items.push(['Rule '+(i+1),rule]));
    box.innerHTML=items.map(x=>'<div class="rule-item"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');'''
          new = '''    const items=[['Challenge Type',account.challenge||'Purchased Account'],['Account Size',auraMoney(account.startingBalance)]];
    const labelMap={stage:'Stage',floatingLossEnabled:'Floating Loss',floatingLossPercent:'Floating Loss Limit',minimumTradingDays:'Minimum Trading Days',maxDailyLossPercent:'Max Daily Loss',dailyLossPercent:'Daily Loss Limit',overallLossPercent:'Overall Loss Limit',maxDrawdownPercent:'Max Drawdown Limit',profitTargetPercent:'Profit Target',profitTarget:'Profit Target',consistencyPercent:'Consistency Rule',newsTrading:'News Trading',weekendHolding:'Weekend Holding',minimumDays:'Minimum Trading Days',leverage:'Leverage',timeLimit:'Time Limit'};
    function prettyRule(rule){
      if(!rule || typeof rule!=='object') return String(rule ?? '—');
      const parts=[];
      for(const [key,val] of Object.entries(rule)){
        if(val===null || val===undefined || val==='') continue;
        const label=labelMap[key] || key.replace(/([A-Z])/g,' $1').replace(/^./,m=>m.toUpperCase());
        let value=val;
        if(typeof val==='boolean') value=val?'Allowed':'Not allowed';
        else if(typeof val==='number' && /percent|loss|drawdown|target|consistency/i.test(key)) value=val+'%';
        else if(typeof val==='object') value=JSON.stringify(val);
        parts.push(label+': '+value);
      }
      return parts.join(' • ') || '—';
    }
    rules.forEach((rule,i)=>items.push(['Rule '+(i+1),prettyRule(rule)]));
    box.innerHTML=items.map(x=>'<div class="rule-item"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');'''
          if old not in s:
              raise SystemExit('challenge rules renderer not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
      - name: Commit and clean up
        shell: bash
        run: |
          rm -f .github/workflows/fix-rules-display.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses.html .github/workflows/fix-rules-display.yml
          git commit -m "Fix challenge rules display"
          git push
