name: Fix terminal Close LIVE positions

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mongo-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps_key"
          chmod 600 "$RUNNER_TEMP/vps_key"
      - name: Repair Mongo admin authentication on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key_path: ${{ runner.temp }}/vps_key
          command_timeout: 5m
          script: |
            set -e
            cd /root/Course-Era
            git fetch origin main
            git reset --hard origin/main
            cd backend
            npm install
            node --check prepare-all-mongo.mjs
            node prepare-all-mongo.mjs
            node --check server.js
            if grep -q 'from "firebase-admin"' server.js; then
              echo 'ERROR: Firebase Admin import remains after Mongo migration'
              exit 1
            fi
            if [ -f /root/Course-Era/backend/.env ]; then
              set -a
              . /root/Course-Era/backend/.env
              set +a
            fi
            export MONGO_URI="${MONGO_URI:-mongodb://127.0.0.1:27017/courseera}"
            export MONGO_DB_NAME="${MONGO_DB_NAME:-courseera}"
            if [ -n "${ADMIN_PASSWORD:-}" ]; then
              node ensure-admin-mongo.mjs
            fi
            pm2 restart course-era-api --update-env
            sleep 4
            curl -fsS --max-time 10 http://127.0.0.1:3000/health
            echo
            echo 'MONGO_ADMIN_AUTH_REPAIR=OK'

  patch:
    if: ${{ github.event.head_commit.message != 'apply exact close live toolbar swap' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deploy workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('.github/workflows/deploy-vps.yml')
          s = p.read_text(encoding='utf-8')

          new_toolbar = '''    const closeTradeBtn=document.createElement('button');
    closeTradeBtn.type='button';
    closeTradeBtn.id='chartToolbarCloseTrade';
    closeTradeBtn.className='chart-toolbar-close';
    closeTradeBtn.textContent='Close';
    closeTradeBtn.style.display='none';
    closeTradeBtn.addEventListener('click',ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      const id=String(closeTradeBtn.dataset.positionId||'');
      const position=terminalPositions.find(x=>String(x.id)===id)||terminalPositions.find(x=>x&&x.symbol===currentSymbol);
      if(position)confirmCloseTrade(position);
    });
    toolbar.appendChild(closeTradeBtn);
    const live=document.createElement('span');live.textContent='● LIVE';live.className='aura-chart-live';toolbar.appendChild(live);
    const canvas=document.createElement('div');canvas.className='aura-chart-canvas';'''
          s, n = re.subn(r"new_toolbar='''.*?'''", "new_toolbar=" + repr(new_toolbar), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('new_toolbar block not found')
          s = s.replace("new_toolbar=" + repr(new_toolbar), "new_toolbar='''" + new_toolbar + "'''", 1)

          new_style = ".aura-chart-live{margin-left:auto;margin-right:0}.chart-toolbar-close{display:inline-flex;align-items:center;justify-content:center;margin-left:4px;height:30px;min-width:44px;padding:0 9px;border:1px solid #e6004d;border-radius:8px;background:#e6004d;color:#fff;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer;touch-action:manipulation}.chart-toolbar-close:active{transform:scale(.96)}"
          s, n = re.subn(r"new_style='[^']*'", "new_style='" + new_style + "'", s, count=1)
          if n != 1:
              raise SystemExit('new_style block not found')

          s = s.replace("closeTradeBtn.textContent='Close Trade';", "closeTradeBtn.textContent='Close';", 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove this workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-close-live-swap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-vps.yml .github/workflows/fix-close-live-swap.yml
          git commit -m "apply exact close live toolbar swap"
          git push
