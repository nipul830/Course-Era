<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Aura Farming</title><link rel="stylesheet" href="aura.css"><style>
.checkout{max-width:760px;margin:auto;padding:50px 5% 80px}.box{background:#050505;border:1px solid #302713;border-radius:18px;padding:24px;margin-top:18px}.summary{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #302713;padding-bottom:18px}.summary h2{margin:5px 0;color:#fff}.price{font-size:28px;font-weight:900;color:#f1d98a;text-align:right}.currency-note{font-size:13px;color:#9b8552;margin-top:5px;font-weight:600}.pay{margin-top:22px}.pay label{display:block;color:#9b8552;font-size:12px;font-weight:800;margin:14px 0 7px}.pay input{width:100%;padding:13px;border-radius:10px;border:1px solid #302713;background:#090806;color:#fff;box-sizing:border-box}.pay input[type=file]{padding:9px}.pay button{margin-top:18px;width:100%}.flow-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}.flow-tabs button{border:1px solid #302713;border-radius:10px;background:#090806;color:#9b8552;padding:12px;font-weight:900;cursor:pointer}.flow-tabs button.active{background:#f1d98a;color:#080808;border-color:#f1d98a}.payment-panel{padding:16px;border:1px solid #302713;border-radius:12px;background:#090806}.qr-wrap{text-align:center}.qr-box{width:270px;height:270px;background:#fff;border-radius:14px;padding:5px;margin:0 auto;display:flex;align-items:center;justify-content:center;box-sizing:border-box}.qr-box img,.qr-box canvas{max-width:260px;max-height:260px}.qr-caption{color:#d6b35a;font-size:13px;margin-top:12px}.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.app-card{border:1px solid #302713;border-radius:12px;background:#111;padding:14px}.app-btn{width:100%!important;margin:0!important;border:0;border-radius:10px;background:#f1d98a;color:#080808;padding:12px 8px;font-weight:900;cursor:pointer}.app-btn span{display:block;font-size:12px;color:#9b8552;margin-top:4px}.app-upi{display:flex;align-items:center;gap:6px;margin-top:9px}.app-upi code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d6b35a;font-size:11px}.app-copy{width:auto!important;margin:0!important;padding:7px 9px!important;border:1px solid #302713!important;background:#090806!important;color:#f1d98a!important;border-radius:8px!important;font-size:11px!important}.app-copy.copied{color:#7ee2a8!important;border-color:#7ee2a8!important}.pay-note{margin:12px 0 0;color:#9b8552;font-size:12px;line-height:1.5}.utr-row{display:flex;gap:8px}.utr-row input{flex:1}.copy-btn{width:auto!important;margin:0!important;padding:0 14px;border:1px solid #302713;background:#111;color:#d6b35a;border-radius:10px;font-weight:900}.status{margin-top:16px;color:#f1d98a;font-size:13px;line-height:1.6}.back{display:inline-block;margin-top:18px;color:#9b8552}@media(max-width:600px){.checkout{padding:35px 4% 60px}.summary{align-items:flex-start}.price{font-size:22px}.app-grid{grid-template-columns:1fr}.qr-box{width:250px;height:250px}}</style></head><body>
<header class="nav"><a class="brand" href="index.html"><span>Aura Farming</span></a></header><main class="checkout"><p class="eyebrow">AURA FARMING</p><h1 style="font-size:48px">Checkout</h1><div class="box"><div class="summary"><div><small style="color:#9b8552">Selected account</small><h2 id="challengeName">Loading…</h2><div id="challengeBalance" style="color:#9b8552"></div></div><div class="price" id="challengePrice">—</div></div>
<div class="pay"><label>UPI Payment</label><div class="flow-tabs"><button type="button" id="qrTab" class="active">QR Payment</button><button type="button" id="oneTapTab">One Tap Payment</button></div><div class="payment-panel" id="qrPanel"><div class="qr-wrap"><div class="qr-box" id="qrBox"></div><div class="qr-caption">Scan to pay with any UPI app</div><div class="pay-note" id="qrDetails"></div></div></div><div class="payment-panel" id="oneTapPanel" style="display:none"><div class="app-grid">
<div class="app-card"><button type="button" class="app-btn" data-app="gpay">Google Pay<span>Tap to Pay ₹ amount</span></button><div class="app-upi"><code id="gpayUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="gpay">Copy UPI</button></div></div>
<div class="app-card"><button type="button" class="app-btn" data-app="phonepe">PhonePe<span>Tap to Pay ₹ amount</span></button><div class="app-upi"><code id="phonepeUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="phonepe">Copy UPI</button></div></div>
<div class="app-card"><button type="button" class="app-btn" data-app="paytm">Paytm<span>Tap to Pay ₹ amount</span></button><div class="app-upi"><code id="paytmUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="paytm">Copy UPI</button></div></div>
</div><div class="pay-note">The selected app opens with the account amount and payment message pre-filled. App support can vary by device/browser.</div></div>
<label>Copy UTR Number</label><div class="utr-row"><input id="transactionId" placeholder="Enter your UTR / transaction ID"><button type="button" class="copy-btn" id="copyUtr">Copy</button></div><label>Payment Screenshot</label><input id="screenshot" type="file" accept="image/*"><button class="btn primary" id="submit">Submit Payment</button><div class="status" id="status"></div></div></div><a class="back" href="challenge.html">← Back to challenges</a></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=6"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const API='https://course-era.onrender.com';let challenge=null,settings=null,upiAmount=0,paymentRef='AF'+Date.now()+Math.random().toString(36).slice(2,8).toUpperCase();
async function token(){return await ceAuth.currentUser.getIdToken()}async function api(path,opt={}){const headers=opt.headers||{};headers.Authorization='Bearer '+await token();const response=await fetch(API+path,{...opt,headers});let data={};try{data=await response.json()}catch(e){}if(!response.ok)throw new Error(data.error||'Request failed');return data}
function paymentNote(){return 'Aura Farming - '+challenge.size+' Challenge Payment'}
function getUpiId(app){
 const fallback=app==='gpay'?'lipupoddar-3@okaxis':'nipukumar007@ibl';
 const value=app==='gpay'?(settings.googlePayUpi||settings.qrUpi||fallback):(app==='paytm'?(settings.paytmUpi||settings.phonePeUpi||settings.qrUpi||fallback):(settings.phonePeUpi||settings.qrUpi||fallback));
 return /x{3,}|y{3,}|\*{3,}|masked/i.test(String(value))?fallback:value;
}
function buildUpiUri(app){const upiId=getUpiId(app);const params=new URLSearchParams({pa:upiId,pn:settings.merchantName||'Aura Farming',tr:paymentRef,tn:paymentNote(),am:upiAmount.toFixed(2),cu:'INR'});return 'upi://pay?'+params.toString()}
function renderOneTapUpi(){['gpay','phonepe','paytm'].forEach(app=>{const el=document.getElementById(app+'Upi');if(el)el.textContent=getUpiId(app)})}
function renderQr(){renderOneTapUpi();qrBox.innerHTML='';const img=settings.qrImageUrl;if(img){const image=document.createElement('img');image.src=img;image.alt='Aura Farming UPI QR';image.style.width='260px';image.style.height='260px';image.style.objectFit='contain';qrBox.appendChild(image)}else{new QRCode(qrBox,{text:buildUpiUri('gpay'),width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}qrDetails.innerHTML='<b>UPI ID:</b> '+(settings.qrUpi||settings.googlePayUpi||'lipupoddar-3@okaxis')+'<br><b>Amount:</b> ₹'+upiAmount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'<br><b>Message:</b> '+paymentNote()}
function setFlow(flow){const qr=flow==='qr';qrTab.classList.toggle('active',qr);oneTapTab.classList.toggle('active',!qr);qrPanel.style.display=qr?'block':'none';oneTapPanel.style.display=qr?'none':'block';if(qr)renderQr()}
function launchApp(app){const uri=buildUpiUri(app);const q=uri.split('?')[1]||'';const packages={gpay:'com.google.android.apps.nbu.paisa.user',phonepe:'com.phonepe.app',paytm:'net.one97.paytm'};const pkg=packages[app];const intent='intent://pay?'+q+'#Intent;scheme=upi;package='+pkg+';end';const generic='upi://pay?'+q;window.location.href=intent;setTimeout(()=>{try{window.location.href=generic}catch(e){}},1800)}
async function init(){ceAuth.onAuthStateChanged(async user=>{if(!user){location.replace('login.html?next=checkout');return}try{const [challengeResponse,paymentResponse]=await Promise.all([fetch(API+'/api/challenges').then(r=>r.json()),api('/api/payment-settings')]);settings=paymentResponse.settings||{};const selectedId=localStorage.getItem('auraSelectedChallengeId');challenge=(challengeResponse.challenges||[]).find(x=>x.id===selectedId);if(!challenge){location.replace('challenge.html');return}challengeName.textContent=challenge.model+' '+challenge.size;challengeBalance.textContent='Starting simulated balance: $'+Number(challenge.accountSize).toLocaleString('en-US');upiAmount=Math.round(Number(challenge.price)*98);challengePrice.innerHTML='₹'+upiAmount.toLocaleString('en-IN')+'<div class="currency-note">INR • ₹98 per $1</div>';renderQr()}catch(error){status.textContent=error.message}})}
qrTab.onclick=()=>setFlow('qr');oneTapTab.onclick=()=>setFlow('oneTap');document.querySelectorAll('.app-btn').forEach(btn=>btn.onclick=()=>launchApp(btn.dataset.app));
document.querySelectorAll('.app-copy').forEach(btn=>btn.onclick=async function(e){e.stopPropagation();const app=this.dataset.copyApp;const value=getUpiId(app);try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}this.textContent='Copied ✓';this.classList.add('copied');setTimeout(()=>{this.textContent='Copy UPI';this.classList.remove('copied')},1400)});
copyUtr.onclick=async()=>{const value=transactionId.value.trim();if(!value){status.textContent='Enter your UTR number first.';return}try{await navigator.clipboard.writeText(value);status.textContent='UTR copied.'}catch{transactionId.select();document.execCommand('copy');status.textContent='UTR copied.'}};
submit.onclick=async function(){if(!challenge)return;const transaction=transactionId.value.trim();if(!transaction){status.textContent='Please enter your UTR / transaction ID.';return}if(!screenshot.files[0]){status.textContent='Please upload your payment screenshot.';return}submit.disabled=true;status.textContent='Submitting payment…';try{const fd=new FormData();fd.append('challengeId',challenge.id);fd.append('currency','INR');fd.append('amount',upiAmount);fd.append('method','UPI');fd.append('transactionId',transaction);fd.append('screenshot',screenshot.files[0]);await api('/api/challenge-payments',{method:'POST',body:fd});status.textContent='Payment submitted. Your account will activate after admin approval.';submit.textContent='Payment Submitted';localStorage.removeItem('auraSelectedChallengeId');localStorage.removeItem('auraSelectedCurrency')}catch(error){status.textContent=error.message;submit.disabled=false}};
init();
</script></body></html>
