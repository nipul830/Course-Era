<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Aura Farming</title><link rel="stylesheet" href="aura.css"><style>
.checkout{max-width:760px;margin:auto;padding:50px 5% 80px}.box{background:#050505;border:1px solid #302713;border-radius:18px;padding:24px;margin-top:18px}.summary{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #302713;padding-bottom:18px}.summary h2{margin:5px 0;color:#fff}.price{font-size:28px;font-weight:900;color:#f1d98a;text-align:right}.currency-note{font-size:13px;color:#9b8552;margin-top:5px;font-weight:600}.pay{margin-top:22px}.pay label{display:block;color:#9b8552;font-size:12px;font-weight:800;margin:14px 0 7px}.pay input{width:100%;padding:13px;border-radius:10px;border:1px solid #302713;background:#090806;color:#fff;box-sizing:border-box}.pay input[type=file]{padding:9px}.pay button{margin-top:18px;width:100%}.flow-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}.flow-tabs button{border:1px solid #302713;border-radius:10px;background:#090806;color:#9b8552;padding:12px;font-weight:900;cursor:pointer}.flow-tabs button.active{background:#f1d98a;color:#080808;border-color:#f1d98a}.payment-panel{padding:16px;border:1px solid #302713;border-radius:12px;background:#090806}.qr-wrap{text-align:center}.qr-box{width:270px;height:270px;background:#fff;border-radius:14px;padding:5px;margin:0 auto;display:flex;align-items:center;justify-content:center;box-sizing:border-box}.qr-box img,.qr-box canvas{max-width:260px;max-height:260px}.qr-caption{color:#d6b35a;font-size:13px;margin-top:12px}.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.app-card{border:1px solid #302713;border-radius:12px;background:#111;padding:14px}.app-btn{width:100%!important;margin:0!important;border:0;border-radius:10px;background:#f1d98a;color:#080808;padding:12px 8px;font-weight:900;cursor:pointer}.app-btn span{display:block;font-size:12px;color:#9b8552;margin-top:4px}.app-upi{display:flex;align-items:center;gap:6px;margin-top:9px}.app-upi code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d6b35a;font-size:11px}.app-copy{width:auto!important;margin:0!important;padding:7px 9px!important;border:1px solid #302713!important;background:#090806!important;color:#f1d98a!important;border-radius:8px!important;font-size:11px!important}.pay-note{margin:12px 0 0;color:#9b8552;font-size:12px;line-height:1.5}.utr-row{display:flex;gap:8px}.utr-row input{flex:1}.copy-btn{width:auto!important;margin:0!important;padding:0 14px;border:1px solid #302713;background:#111;color:#d6b35a;border-radius:10px;font-weight:900}.status{margin-top:16px;color:#f1d98a;font-size:13px;line-height:1.6;min-height:22px}.status.success{color:#7ee2a8}.status.error{color:#ff9b9b}.approval-timer{display:none;margin-top:12px;padding:12px;border:1px solid #302713;border-radius:10px;background:#090806;color:#d6b35a;text-align:center;font-weight:800}.approval-timer strong{color:#f1d98a;font-size:20px}.back{display:inline-block;margin-top:18px;color:#9b8552}@media(max-width:600px){.checkout{padding:35px 4% 60px}.summary{align-items:flex-start}.price{font-size:22px}.app-grid{grid-template-columns:1fr}.qr-box{width:250px;height:250px}}
</style></head><body><header class="nav"><a class="brand" href="index.html"><span>Aura Farming</span></a></header><main class="checkout"><p class="eyebrow">AURA FARMING</p><h1 style="font-size:48px">Checkout</h1><div class="box"><div class="summary"><div><small style="color:#9b8552">Selected account</small><h2 id="challengeName">Loading…</h2><div id="challengeBalance" style="color:#9b8552"></div></div><div class="price" id="challengePrice">—</div></div><div class="pay"><label>UPI Payment</label><div class="flow-tabs"><button type="button" id="qrTab" class="active">QR Payment</button><button type="button" id="oneTapTab">One Tap Payment</button></div><div class="payment-panel" id="qrPanel"><div class="qr-wrap"><div class="qr-box" id="qrBox"></div><div class="qr-caption">Scan to pay with any UPI app</div><div class="pay-note" id="qrDetails"></div></div></div><div class="payment-panel" id="oneTapPanel" style="display:none"><div class="app-grid"><div class="app-card"><button type="button" class="app-btn" data-app="gpay">Google Pay<span>Tap to Pay</span></button><div class="app-upi"><code id="gpayUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="gpay">Copy UPI</button></div></div><div class="app-card"><button type="button" class="app-btn" data-app="phonepe">PhonePe<span>Tap to Pay</span></button><div class="app-upi"><code id="phonepeUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="phonepe">Copy UPI</button></div></div><div class="app-card"><button type="button" class="app-btn" data-app="paytm">Paytm<span>Tap to Pay</span></button><div class="app-upi"><code id="paytmUpi">Loading UPI…</code><button type="button" class="app-copy" data-copy-app="paytm">Copy UPI</button></div></div></div><div class="pay-note">The selected app opens with the amount and payment message pre-filled.</div></div><label>Copy UTR Number</label><div class="utr-row"><input id="transactionId" placeholder="Enter your UTR / transaction ID"><button type="button" class="copy-btn" id="copyUtr">Copy</button></div><label>Payment Screenshot</label><input id="screenshot" type="file" accept="image/*"><button type="button" class="btn primary" id="submit">Submit Payment</button><div class="status" id="status"></div><div class="approval-timer" id="approvalTimer">Payment submitted · admin review timer <strong id="timerValue">15:00</strong></div></div></div><a class="back" href="challenge.html">← Back to challenges</a></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=8"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const API='';const FALLBACK_CHALLENGES=[{id:'instant-1000',model:'Instant',size:'$1K',accountSize:1000,price:8},{id:'instant-2500',model:'Instant',size:'$2.5K',accountSize:2500,price:15},{id:'one-5000',model:'1 Step',size:'$5K',accountSize:5000,price:40},{id:'one-10000',model:'1 Step',size:'$10K',accountSize:10000,price:75},{id:'one-25000',model:'1 Step',size:'$25K',accountSize:25000,price:150},{id:'two-5000',model:'2 Step',size:'$5K',accountSize:5000,price:25},{id:'two-10000',model:'2 Step',size:'$10K',accountSize:10000,price:45},{id:'two-25000',model:'2 Step',size:'$25K',accountSize:25000,price:110},{id:'two-50000',model:'2 Step',size:'$50K',accountSize:50000,price:200},{id:'two-100000',model:'2 Step',size:'$100K',accountSize:100000,price:350}];let challenge=null,settings={},upiAmount=0,selectedCurrency=(localStorage.getItem('auraSelectedCurrency')||new URLSearchParams(location.search).get('currency')||'INR').toUpperCase(),paymentRef='AF'+Date.now()+Math.random().toString(36).slice(2,8).toUpperCase();
async function api(path,opt={}){const user=ceAuth.currentUser;if(!user)throw new Error('Your login session expired. Please login again.');const headers={...(opt.headers||{}),Authorization:'Bearer '+await user.getIdToken(true)};let r;try{r=await fetch(API+path,{...opt,headers,cache:'no-store'})}catch{throw new Error('Payment server connection failed. Please refresh and try again.')}const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.detail||d.error||('Payment request failed (HTTP '+r.status+')'));return d}
async function loadChallenges(){try{const r=await fetch('/api/challenges',{cache:'no-store'});const d=await r.json();if(r.ok&&Array.isArray(d.challenges)&&d.challenges.length)return d.challenges}catch{}return FALLBACK_CHALLENGES}async function loadSettings(){try{return (await api('/api/payment-settings')).settings||{}}catch{return {}}}function paymentNote(){return 'Aura Farming - '+challenge.size+' Challenge Payment'}function getUpiId(app){const fallback=app==='gpay'?'lipupoddar-3@okaxis':'nipukumar007@ibl';const v=app==='gpay'?(settings.googlePayUpi||settings.qrUpi||fallback):(app==='paytm'?(settings.paytmUpi||settings.phonePeUpi||settings.qrUpi||fallback):(settings.phonePeUpi||settings.qrUpi||fallback));return /x{3,}|y{3,}|\*{3,}|masked/i.test(String(v))?fallback:String(v)}function buildUpiUri(app){const p=new URLSearchParams({pa:getUpiId(app),pn:settings.merchantName||'Aura Farming',tr:paymentRef,tn:paymentNote(),am:upiAmount.toFixed(2),cu:'INR'});return 'upi://pay?'+p.toString()}function renderOneTap(){['gpay','phonepe','paytm'].forEach(a=>{const e=document.getElementById(a+'Upi');if(e)e.textContent=getUpiId(a)})}function renderQr(){renderOneTap();const box=document.getElementById('qrBox');box.innerHTML='';new QRCode(box,{text:buildUpiUri('gpay'),width:260,height:260,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});document.getElementById('qrDetails').innerHTML='<b>UPI ID:</b> '+getUpiId('gpay')+'<br><b>Amount:</b> '+(selectedCurrency==='USDT'?upiAmount.toFixed(2)+' USDT':'₹'+upiAmount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}))+'<br><b>Message:</b> '+paymentNote()}function setFlow(qr){document.getElementById('qrTab').classList.toggle('active',qr);document.getElementById('oneTapTab').classList.toggle('active',!qr);document.getElementById('qrPanel').style.display=qr?'block':'none';document.getElementById('oneTapPanel').style.display=qr?'none':'block';if(qr)renderQr()}function launchApp(app){if(selectedCurrency!=='INR'){document.getElementById('status').textContent='One Tap UPI is available for INR payments.';return}const uri=buildUpiUri(app),q=uri.split('?')[1]||'',packages={gpay:'com.google.android.apps.nbu.paisa.user',phonepe:'com.phonepe.app',paytm:'net.one97.paytm'};location.href='intent://pay?'+q+'#Intent;scheme=upi;package='+packages[app]+';end';setTimeout(()=>location.href=uri,1800)}
async function init(){ceAuth.onAuthStateChanged(async user=>{if(!user){location.replace('login.html?next=checkout');return}try{const [items,st]=await Promise.all([loadChallenges(),loadSettings()]);settings=st;const selectedId=new URLSearchParams(location.search).get('challengeId')||localStorage.getItem('auraSelectedChallengeId');challenge=items.find(x=>String(x.id)===String(selectedId));if(!challenge){document.getElementById('status').textContent='Selected challenge was not found. Please go back and select it again.';document.getElementById('status').className='status error';return}document.getElementById('challengeName').textContent=challenge.model+' '+challenge.size;document.getElementById('challengeBalance').textContent='Starting simulated balance: $'+Number(challenge.accountSize||0).toLocaleString('en-US');const discount=Math.min(100,Math.max(0,Number(challenge.discountPercent)||0)),finalPrice=Math.round(Number(challenge.price||0)*(1-discount/100)*100)/100;upiAmount=selectedCurrency==='USDT'?finalPrice:Math.round(finalPrice*98);document.getElementById('challengePrice').innerHTML=selectedCurrency==='USDT'?finalPrice.toFixed(2)+' USDT':'₹'+upiAmount.toLocaleString('en-IN')+'<div class="currency-note">INR • ₹98 per $1</div>';renderQr()}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('status').className='status error'}})}document.getElementById('qrTab').onclick=()=>setFlow(true);document.getElementById('oneTapTab').onclick=()=>setFlow(false);document.querySelectorAll('.app-btn').forEach(b=>b.onclick=()=>launchApp(b.dataset.app));document.querySelectorAll('.app-copy').forEach(b=>b.onclick=async()=>{const v=getUpiId(b.dataset.copyApp);try{await navigator.clipboard.writeText(v)}catch{const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy UPI',1400)});document.getElementById('copyUtr').onclick=async()=>{const i=document.getElementById('transactionId'),v=i.value.trim();if(!v)return;try{await navigator.clipboard.writeText(v)}catch{i.select();document.execCommand('copy')}};let timerInterval=null;function startApprovalTimer(){const box=document.getElementById('approvalTimer'),val=document.getElementById('timerValue');let end=Number(localStorage.getItem('auraPaymentReviewEnds')||0);if(!end){end=Date.now()+900000;localStorage.setItem('auraPaymentReviewEnds',String(end))}box.style.display='block';const tick=()=>{const left=Math.max(0,end-Date.now()),s=Math.floor(left/1000);val.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(left<=0)clearInterval(timerInterval)};tick();clearInterval(timerInterval);timerInterval=setInterval(tick,1000)}document.getElementById('submit').onclick=async()=>{const status=document.getElementById('status'),btn=document.getElementById('submit'),transaction=document.getElementById('transactionId').value.trim(),file=document.getElementById('screenshot').files[0];if(!challenge){status.textContent='Challenge is still loading. Please wait.';status.className='status error';return}if(!transaction){status.textContent='Please enter your UTR / transaction ID.';status.className='status error';return}if(!file){status.textContent='Please upload your payment screenshot.';status.className='status error';return}btn.disabled=true;btn.textContent='Submitting…';status.className='status';status.textContent='Submitting payment…';try{const fd=new FormData();fd.append('challengeId',challenge.id);fd.append('transactionId',transaction);fd.append('method','UPI');fd.append('currency',selectedCurrency==='USDT'?'USDT':'INR');fd.append('amount',String(upiAmount));fd.append('screenshot',file,file.name);await api('/api/challenge-payments',{method:'POST',body:fd});status.textContent='Payment submitted successfully. Waiting for admin approval.';status.className='status success';localStorage.removeItem('auraPaymentReviewEnds');startApprovalTimer()}catch(e){status.textContent=e.message;status.className='status error'}finally{btn.disabled=false;btn.textContent='Submit Payment'}};init();
</script></body></html>
