<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invite — Aura Farming</title><link rel="stylesheet" href="aura.css"><style>.invite{max-width:700px;margin:auto;padding:80px 6%;text-align:center}.invite .panel{padding:34px}.invite h1{font-size:clamp(40px,8vw,64px);margin:10px 0 16px}.invite p{color:var(--muted);line-height:1.7}.invite-code{margin:25px auto;padding:18px;border:1px solid var(--line);border-radius:14px;background:#080808;color:var(--accent2);font-weight:800;word-break:break-all}.invite-note{font-size:13px}</style></head><body><header class="nav"><a class="brand" href="index.html">Aura Farming</a></header><main class="invite"><section class="panel"><p class="eyebrow">AURA FARMING</p><h1>Invite</h1><p>Invite traders to Aura Farming and share your account invite link.</p><div class="invite-code" id="inviteCode">Loading…</div><button class="btn primary" id="copyInvite">Copy Invite Link</button><p class="invite-note" id="inviteMsg"></p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=6"></script><script>ceAuth.onAuthStateChanged(function(user){var code=document.getElementById('inviteCode'),msg=document.getElementById('inviteMsg');if(!user){code.textContent='Login required';document.getElementById('copyInvite').disabled=true;return}var link=location.origin+location.pathname.replace(/invite\.html$/,'')+'signup.html?ref='+encodeURIComponent(user.uid);code.textContent=link;document.getElementById('copyInvite').onclick=function(){navigator.clipboard.writeText(link).then(function(){msg.textContent='Invite link copied.'}).catch(function(){msg.textContent=link})}});</script></body></html>
