<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Meeting — Course Era</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a><nav><a href="admin.html">Dashboard</a><a href="#" onclick="logout();return false">Logout</a></nav></header>
<main class="container narrow"><div class="page-title"><p class="eyebrow">LIVE CLASS</p><h1>Live Meeting</h1><p class="muted">Simple live class scheduler. Students will enter the same meeting code to join.</p></div>
<form class="panel" onsubmit="saveMeeting(event)">
<label class="check"><input id="enabled" type="checkbox"> Enable live meeting</label>
<label>Meeting title<input id="title" placeholder="Course Era Live Class"></label>
<label>Date<input id="date" type="date"></label>
<label>Time<input id="time" type="time"></label>
<label>Meeting code<input id="meetingId" placeholder="e.g. CE-12345" autocomplete="off"></label>
<p class="muted" style="font-size:12px">Example: <b>CE-12345</b>. Students use this exact code on the Live Meeting page.</p>
<label>Passcode (optional)<input id="passcode" placeholder="Optional"></label>
<div class="actions"><button class="btn primary" type="submit">Save Meeting</button><button class="btn ghost" type="button" onclick="openRoom()">Open Live Room</button></div><p id="msg" class="msg"></p>
</form></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=7"></script><script src="app.js?v=14"></script>
<script>
protectPage("admin-zoom");
ceAuth.onAuthStateChanged(async u=>{if(!u)return;try{const d=await apiFetch('/api/meeting');const m=d.meeting||{};enabled.checked=!!m.enabled;title.value=m.title||'';date.value=m.date||'';time.value=m.time||'';meetingId.value=m.meetingId||'';passcode.value=m.passcode||'';}catch(e){msg.textContent=e.message}});
async function saveMeeting(e){e.preventDefault();msg.textContent='Saving…';try{await apiFetch('/api/meeting',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:enabled.checked,title:title.value,date:date.value,time:time.value,meetingId:meetingId.value,passcode:passcode.value})});msg.textContent='Live meeting saved successfully.';}catch(e){msg.textContent=e.message}}
function openRoom(){const code=meetingId.value.trim();if(!code){msg.textContent='Enter a meeting code first.';return}location.href='zoom-meeting.html?code='+encodeURIComponent(code)+'&host=1'}
</script></body></html>
