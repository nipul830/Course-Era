<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews — Aura Farming</title><link rel="stylesheet" href="aura.css"></head><body><header class="nav"><button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" type="button"><span></span><span></span><span></span></button><div class="side-menu" id="sideMenu"><a href="index.html">Home</a><a href="challenge.html">Challenge</a><a href="transparency.html">Transparency</a><a href="reviews.html">Reviews</a><a href="leaderboard.html">Leaderboard</a><a href="competition.html">Competition</a><a href="terminal.html">Terminal</a><a href="affiliate.html">Affiliate</a><a href="help.html">Help</a></div><div class="menu-backdrop" id="menuBackdrop"></div><a class="brand" href="index.html">Aura Farming</a><nav class="top-links"><a href="index.html">Home</a><a href="challenge.html">Challenge</a><a href="transparency.html">Transparency</a><a href="reviews.html">Reviews</a><a href="leaderboard.html">Leaderboard</a><a href="competition.html">Competition</a><a href="terminal.html">Terminal</a><a href="affiliate.html">Affiliate</a><a href="help.html">Help</a></nav><div class="auth-nav"><a class="btn primary small" href="login.html">Login</a></div></header><main class="section"><p class="eyebrow">TRADER REVIEWS</p><h1>Reviews</h1><p class="muted">Reviews submitted by signed-in traders.</p><div id="reviewsList" class="grid" style="margin-top:20px"><article class="card"><p>Loading reviews…</p></article></div><div class="panel" style="margin-top:24px"><h3>Share your experience</h3><form id="reviewForm"><label>Rating<select id="reviewRating" required style="margin:8px 0;width:100%;padding:12px;background:#090806;color:#fff;border:1px solid #3a2c13"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select></label><label>Review<textarea id="reviewText" required minlength="10" maxlength="800" rows="4" style="width:100%;box-sizing:border-box;margin:8px 0;padding:12px;background:#090806;color:#fff;border:1px solid #3a2c13"></textarea></label><button class="btn primary" type="submit">Submit Review</button><p id="reviewMsg" class="muted"></p></form></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=6"></script><script>
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
async function load(){try{var r=await fetch('https://course-era.onrender.com/api/reviews'),d=await r.json(),l=document.getElementById('reviewsList');if(!d.reviews?.length){l.innerHTML='<article class="card"><h3>No reviews yet</h3><p>Be among the first traders to share your experience.</p></article>';return}l.innerHTML=d.reviews.map(function(x){return '<article class="card"><div style="color:#d6b35a">'+('★★★★★'.slice(0,x.rating)+'☆☆☆☆☆'.slice(0,5-x.rating))+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.text)+'</p></article>'}).join('')}catch(e){}}</script><script>load();document.getElementById('reviewForm').addEventListener('submit',async function(e){e.preventDefault();var u=ceAuth.currentUser,m=document.getElementById('reviewMsg');if(!u){m.textContent='Please login to submit a review.';return}try{var tok=await u.getIdToken(),r=await fetch('https://course-era.onrender.com/api/reviews',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({rating:+reviewRating.value,text:reviewText.value})}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent=d.message||'Review submitted.';load()}catch(e){m.textContent=e.message}});</script></main><script>var t=document.getElementById('menuToggle'),m=document.getElementById('sideMenu'),b=document.getElementById('menuBackdrop');t.addEventListener('click',function(){var o=m.classList.toggle('open');b.classList.toggle('open',o);t.classList.toggle('open',o)});b.addEventListener('click',function(){m.classList.remove('open');b.classList.remove('open');t.classList.remove('open')});</script></body></html>
