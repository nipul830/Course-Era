<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trader Dashboard — Aura Farming</title>
<link rel="stylesheet" href="aura.css">
<style>
.dashboard-actions{max-width:900px;margin:34px auto;padding:0 5%}
.open-terminal-card{background:#050505;border:1px solid #3a2c13;border-radius:20px;padding:34px;text-align:center;box-shadow:0 15px 40px #0008}
.open-terminal-card h2{color:var(--accent2);font-size:30px;margin:0 0 10px}
.open-terminal-card p{color:var(--muted);margin:0 0 24px}
.open-terminal-btn{display:inline-block;background:var(--accent);color:#080808;text-decoration:none;border-radius:12px;padding:15px 34px;font-size:18px;font-weight:900}
.open-terminal-btn:hover{background:var(--accent2)}
</style>
</head>
<body>
<header class="nav">
<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">
<svg viewBox="0 0 64 64"><defs><linearGradient id="auraGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7df98"/><stop offset=".45" stop-color="#d6b35a"/><stop offset="1" stop-color="#9b671f"/></linearGradient></defs><path d="M12 53 31 9l21 44h-9l-5.3-12H25l-5 12zM28 34h7l-3.5-8z" fill="none" stroke="url(#auraGold)" stroke-width="4.2" stroke-linejoin="round"/><path d="M20 42C9 39 5 31 5 25c9 1 16 6 18 13-1 1-2 2-3 4z" fill="#1f7a32" stroke="#d6b35a" stroke-width="1.4"/><path d="M25 48c1-10 8-17 19-19-1 10-7 17-18 21z" fill="#39a844" stroke="#d6b35a" stroke-width="1.4"/></svg>
</span><span>Aura Farming</span></a>
<nav><a href="index.html">Home</a><button class="linkbtn" onclick="logout()">Logout</button></nav>
</header>

<main class="dashboard">
<div class="page-title"><p class="eyebrow">TRADER PORTAL</p><h1>Dashboard</h1><p id="welcome" class="muted">Loading account…</p></div>
<div class="stats">
<div class="stat"><span>Balance</span><strong id="accountBalance">Loading…</strong></div>
<div class="stat"><span>Equity</span><strong id="accountEquity">Loading…</strong></div>
<div class="stat"><span>Daily Drawdown</span><strong>0.00%</strong></div>
<div class="stat"><span>Max Drawdown</span><strong>0.00%</strong></div>
</div>
<section class="dashboard-actions">
<div class="open-terminal-card">
<p class="eyebrow">SIMULATED CFD TRADING</p>
<h2>Open Terminal</h2>
<p>Open the trading terminal to view charts and place simulated BUY / SELL trades.</p>
<a class="open-terminal-btn" href="terminal.html">Open Terminal</a>
</div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script><script src="aura-account.js"></script><script src="aura.js"></script>
<script>
ceAuth.onAuthStateChanged(async function(user){
  if(!user)return;
  const account=await auraAccount();
  const balance=document.getElementById('accountBalance');
  const equity=document.getElementById('accountEquity');
  if(account){
    if(balance)balance.textContent=auraMoney(account.balance);
    if(equity)equity.textContent=auraMoney(account.equity);
  }else{
    if(balance)balance.textContent='—';
    if(equity)equity.textContent='—';
  }
});
</script>
</body>
</html>
