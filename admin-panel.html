<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Aura Farming</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000}
body{min-height:100vh}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=12"></script>
<script>
ceAuth.onAuthStateChanged(async user=>{
  if(!user){location.replace('admin.html');return;}
  try{
    const token=await user.getIdToken(true);
    const r=await fetch('/api/admin/payments',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok) location.replace('admin.html');
  }catch(e){location.replace('admin.html');}
});
</script>
</body>
</html>
