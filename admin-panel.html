<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Aura Farming</title>
<style>
:root{--gold:#f1d98a;--gold2:#d6b35a;--bg:#000;--card:#070707;--line:#302713;--muted:#9b8552;--ok:#7ee2a8;--err:#ff9b9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#000;z-index:10}.brand{font-size:25px;font-weight:900}.logout{border:1px solid var(--line);background:#080706;color:var(--gold);border-radius:9px;padding:9px 15px;font-weight:900;cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:28px 3% 60px}.eyebrow{color:var(--gold2);font-size:12px;font-weight:900;letter-spacing:3px}.title{display:flex;align-items:end;justify-content:space-between;gap:20px}.title h1{font-size:42px;margin:7px 0;color:var(--gold)}.live{color:var(--ok);font-size:12px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.tab{border:1px solid var(--line);background:#080706;color:var(--muted);border-radius:10px;padding:10px;font-weight:900;cursor:pointer;text-align:center}.tab.active{background:var(--gold);color:#080808;border-color:var(--gold)}.tab span{margin-left:6px;font-size:11px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:12px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.panel h2{margin:0;color:var(--gold);font-size:19px}.updated{color:var(--muted);font-size:11px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(70px,.7fr) minmax(0,1fr);grid-template-rows:auto auto;align-items:center;gap:5px 8px;border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-top:7px;background:#030303;width:100%;min-width:0}.cell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-cell{grid-column:1}.amount-cell{grid-column:2}.challenge-cell{grid-column:3}.date-cell{grid-column:1}.utr-cell{grid-column:2}.proof-cell{grid-column:3;overflow:visible}.name{font-weight:900;font-size:12px;overflow:hidden;text-overflow:ellipsis}.email,.meta-small{color:var(--muted);font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}.amount{font-size:12px;color:var(--gold);font-weight:900}.tag{display:inline-block;padding:3px 6px;border-radius:5px;background:#171207;color:var(--gold2);font-size:8px;font-weight:900}.tag.approved{background:#07170e;color:var(--ok)}.tag.rejected{background:#170707;color:var(--err)}.tap{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;cursor:pointer}.tap:hover{color:var(--gold)}.proof-link{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-weight:900;font-size:9px;text-decoration:none;cursor:pointer}.proof-thumb{width:24px;height:24px;object-fit:cover;border-radius:4px;border:1px solid var(--line);vertical-align:middle}.proof-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0}.actions{display:flex;gap:3px;justify-content:flex-end}.actions button{border-radius:5px;padding:5px 6px;font-size:9px;font-weight:900;cursor:pointer;white-space:nowrap}.approve{background:var(--gold);border:1px solid var(--gold);color:#080808}.reject{background:#120707;border:1px solid #522626;color:var(--err)}.status{min-height:17px;margin-top:8px;font-size:11px}.error{color:var(--err)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#080808;border:1px solid var(--line);border-radius:14px;padding:16px}.modal-top{display:flex;justify-content:space-between;align-items:center}.modal-top h3{margin:0;color:var(--gold)}.close{background:none;border:0;color:#fff;font-size:25px;cursor:pointer}.detail{color:#ddd;font-size:13px;line-height:1.8;margin-top:10px}.modal-img{display:block;max-width:100%;max-height:60vh;margin:12px auto 0;border-radius:9px;border:1px solid var(--line)}
@media(max-width:650px){.wrap{padding:22px 10px 50px}.title h1{font-size:30px}.brand{font-size:21px}.panel{padding:10px}.item{grid-template-columns:minmax(0,1.5fr) minmax(58px,.7fr) minmax(0,1fr);gap:4px 6px;padding:7px}.name{font-size:11px}.email,.meta-small{font-size:9px}.amount{font-size:11px}.proof-thumb{width:22px;height:22px}.proof-link{font-size:8px}.actions{gap:2px}.actions button{padding:4px 5px;font-size:8px}.tab{padding:9px 5px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Aura Farming</div><button class="logout" id="logout">Logout</button></header>
<main class="wrap">
<div class="eyebrow">AURA FARMING ADMIN</div>
<div class="title"><h1>Checkout Requests</h1><div class="live">● LIVE QUEUE</div></div>
<div class="tabs"><button class="tab active" data-tab="pending">Pending<span id="pendingCount">0</span></button><button class="tab" data-tab="approved">Approved<span id="approvedCount">0</span></button><button class="tab" data-tab="rejected">Rejected<span id="rejectedCount">0</span></button></div>
<div class="panel"><div class="panel-head"><h2 id="sectionTitle">Pending Requests</h2><div class="updated" id="updated">Connecting…</div></div><div id="queue"><div class="empty">Loading checkout requests…</div></div><div id="status" class="status"></div></div>
</main>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-top"><h3 id="modalTitle">Payment Details</h3><button class="close" id="closeModal">×</button></div><div class="detail" id="modalDetail"></div><img id="modalImg" class="modal-img" alt="Payment screenshot" style="display:none"><div id="modalImgError" class="detail" style="display:none">Screenshot could not be loaded.</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=12"></script>
<script>
const queue=document.getElementById('queue'),updated=document.getElementById('updated'),status=document.getElementById('status'),sectionTitle=document.getElementById('sectionTitle'),modal=document.getElementById('modal'),modalDetail=document.getElementById('modalDetail'),modalImg=document.getElementById('modalImg'),modalImgError=document.getElementById('modalImgError'),modalTitle=document.getElementById('modalTitle');
let currentUser=null,loading=false,currentTab='pending',allPayments=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function token(){return currentUser.getIdToken(true)}
async function api(path,opt={}){const headers={...(opt.headers||{}),Authorization:'Bearer '+await token()};const r=await fetch(path,{...opt,headers});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}
function time(v){if(!v)return '—';if(typeof v==='string')return new Date(v).toLocaleString();if(v._seconds)return new Date(v._seconds*1000).toLocaleString();if(v.seconds)return new Date(v.seconds*1000).toLocaleString();return '—'}
function paymentTitle(p){return p.type==='challenge'?((p.challengeModel||'Challenge')+' '+(p.challengeSize||'')):((p.courseTitle||'Course payment'))}
function userName(p){return p.userName||p.username||p.displayName||p.name||'User'}
function card(p){
 const proof=p.screenshotUrl?'<button type="button" class="proof-link" data-proof-id="'+esc(p.id)+'" title="Open screenshot"><img class="proof-thumb" src="'+esc(p.screenshotUrl)+'" alt="Screenshot">Screenshot</button>':'—';
 const statusTag=p.status==='approved'?'<span class="tag approved">APPROVED</span>':p.status==='rejected'?'<span class="tag rejected">REJECTED</span>':'<span class="tag">PENDING</span>';
 const actions=p.status==='pending'?'<div class="actions"><button class="approve" data-id="'+esc(p.id)+'" data-status="approved">Approve</button><button class="reject" data-id="'+esc(p.id)+'" data-status="rejected">Reject</button></div>':statusTag;
 return '<article class="item" data-open="'+esc(p.id)+'"><div class="cell user-cell"><div class="name">'+esc(userName(p))+'</div><div class="email">'+esc(p.userEmail||p.userId||'—')+'</div></div><div class="cell amount amount-cell">'+esc(p.currency||'INR')+' '+esc(Number(p.amount||0).toLocaleString('en-IN',{maximumFractionDigits:2}))+'</div><div class="cell challenge-cell"><div class="name">'+esc(paymentTitle(p))+'</div><div class="meta-small">'+statusTag+'</div></div><div class="cell meta-small date-cell">'+esc(time(p.submittedAt))+'</div><div class="cell utr-cell"><span class="tap" data-id="'+esc(p.id)+'" title="Open transaction details">'+esc(p.transactionId||'—')+'</span></div><div class="cell proof-cell"><div class="proof-actions">'+proof+actions+'</div></div></article>';
}
function render(){const list=allPayments.filter(p=>p.status===currentTab),labels={pending:'Pending Requests',approved:'Approved Requests',rejected:'Rejected Requests'};sectionTitle.textContent=labels[currentTab];if(!list.length){queue.innerHTML='<div class="empty">No '+currentTab+' checkout requests.</div>';return}queue.innerHTML='<div>'+list.map(card).join('')+'</div>';document.querySelectorAll('.actions button').forEach(b=>b.onclick=review);document.querySelectorAll('.proof-link').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openDetails(allPayments.find(x=>x.id===b.dataset.proofId))});document.querySelectorAll('.item').forEach(el=>el.onclick=e=>{if(e.target.closest('.actions')||e.target.closest('.proof-link')||e.target.closest('.tap'))return;openDetails(allPayments.find(x=>x.id===el.dataset.open))});document.querySelectorAll('.tap').forEach(el=>el.onclick=e=>{e.stopPropagation();openDetails(allPayments.find(x=>x.id===el.dataset.id))})}
function openDetails(p){if(!p)return;modalTitle.textContent=paymentTitle(p);modalDetail.innerHTML='<b>User:</b> '+esc(userName(p))+'<br><b>Email:</b> '+esc(p.userEmail||p.userId||'—')+'<br><b>Amount:</b> '+esc(p.currency||'INR')+' '+esc(Number(p.amount||0).toLocaleString('en-IN',{maximumFractionDigits:2}))+'<br><b>UTR / Transaction:</b> '+esc(p.transactionId||'—')+'<br><b>Submitted:</b> '+esc(time(p.submittedAt))+'<br><b>Status:</b> '+esc(p.status||'pending');modalImg.onerror=()=>{modalImg.style.display='none';modalImgError.style.display='block'};modalImgError.style.display='none';if(p.screenshotUrl){modalImg.src=p.screenshotUrl;modalImg.style.display='block'}else{modalImg.removeAttribute('src');modalImg.style.display='none'}modal.classList.add('open')}
document.getElementById('closeModal').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
function setCounts(){document.getElementById('pendingCount').textContent=allPayments.filter(p=>p.status==='pending').length;document.getElementById('approvedCount').textContent=allPayments.filter(p=>p.status==='approved').length;document.getElementById('rejectedCount').textContent=allPayments.filter(p=>p.status==='rejected').length}
async function load(){if(!currentUser||loading)return;loading=true;try{const d=await api('/api/admin/payments');allPayments=Array.isArray(d.payments)?d.payments:[];setCounts();render();updated.textContent='Updated '+new Date().toLocaleTimeString()}catch(e){status.className='status error';status.textContent=e.message}finally{loading=false}}
async function review(e){e.stopPropagation();const b=e.currentTarget,id=b.dataset.id,action=b.dataset.status;b.disabled=true;try{await api('/api/admin/payments/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:action})});status.className='status';status.textContent='Payment '+action+'.';await load()}catch(err){status.className='status error';status.textContent=err.message;b.disabled=false}}
document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{currentTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));status.textContent='';render()});document.getElementById('logout').onclick=async()=>{await firebase.auth().signOut();location.replace('admin.html')};firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('admin.html');return}currentUser=u;await load();setInterval(load,1000)});
</script>
</body></html>
