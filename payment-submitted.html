<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Details — Course Era</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a></header><main class="container narrow"><div class="page-title"><p class="eyebrow">PAYMENT VERIFICATION</p><h1>Submit payment details</h1><p>Send your transaction details. Access is granted after admin verification.</p></div><form class="panel form-grid" onsubmit="submitPayment(event)"><label>Name<input id="payName" required></label><label>Payment method<select id="method"><option>QR / UPI</option><option>USDT</option></select></label><label>Transaction / Reference ID<input id="txid" required></label><label>Paid amount<input id="amount" type="number" step="0.01" required></label><label>Screenshot<input id="proof" type="file" accept="image/*"></label><button class="btn primary full">Submit for Verification</button><p id="payMsg" class="msg"></p></form></main><script src="app.js"></script></body></html>
