<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments — Course Era</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a><nav><a href="admin.html">Admin</a></nav></header><main class="container"><div class="page-title"><p class="eyebrow">ADMIN / PAYMENTS</p><h1>Payment verification</h1><p class="muted">Review submitted payments and approve or reject course access.</p></div><div id="adminPayments" class="grid"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=7"></script><script src="app.js?v=11"></script><script>
async function loadAdminPayments(){
 const e=document.getElementById('adminPayments'); e.innerHTML='<div class="panel empty">Loading payments…</div>';
 try{
  const data=await apiFetch('/api/admin/payments'); const items=data.payments||[];
  if(!items.length){e.innerHTML='<div class="panel empty">No payments submitted yet.</div>';return}
  e.innerHTML='';
  items.sort((a,b)=>String(b.submittedAt?.seconds||0).localeCompare(String(a.submittedAt?.seconds||0))).forEach(p=>{
   const status=p.status||'pending';
   e.insertAdjacentHTML('beforeend',`<article class="panel"><p class="eyebrow">${status.toUpperCase()}</p><h3>${p.courseTitle||p.courseId}</h3><p class="muted">${p.userEmail||p.userId}</p><p>Amount: <b>₹${Number(p.amount||0).toLocaleString('en-IN')}</b></p><p>Method: ${p.method||'UPI'}<br>Transaction ID: <b>${p.transactionId||'—'}</b></p>${p.screenshotUrl?'<p><a class="btn ghost" target="_blank" rel="noopener" href="'+p.screenshotUrl+'">View Screenshot</a></p>':''}<div class="actions">${status==='pending'?'<button class="btn primary" onclick="reviewPayment(\\''+p.id+'\\',\\'approved\\')">Approve</button><button class="btn ghost" onclick="reviewPayment(\\''+p.id+'\\',\\'rejected\\')">Reject</button>':'<span class="muted">Reviewed: '+status+'</span>'}</div></article>`);
  });
 }catch(err){e.innerHTML='<div class="panel empty">'+err.message+'</div>'}
}
async function reviewPayment(id,status){
 try{await apiFetch('/api/admin/payments/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAdminPayments()}catch(err){alert(err.message)}
}
protectPage("admin-payments");
ceAuth.onAuthStateChanged(function(user){if(user)loadAdminPayments()});
</script></body></html>
