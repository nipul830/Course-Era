<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Positions — Aura Farming</title><link rel="stylesheet" href="aura.css">
<style>
body{background:#fff;color:#182332}.positions-page{padding:22px 16px 105px;max-width:760px;margin:auto;font-family:Arial,Helvetica,sans-serif}.positions-page h1{margin:0 0 6px;font-size:28px}.account-top{background:#078cf0;color:#fff;border-radius:0 0 24px 24px;margin: -22px -16px 18px;padding:0 0 10px;box-shadow:0 4px 18px #0002;overflow:hidden}.account-compact{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;min-height:92px;padding:16px 28px 10px}.account-demo{justify-self:start;background:#fff;color:#087fd9;border-radius:9px;padding:9px 15px;font-size:17px;font-weight:900}.account-summary{display:flex;justify-content:center;align-items:baseline;gap:9px;white-space:nowrap}.account-summary .balance-main{font-size:25px;font-weight:900}.account-summary .pnl-main{font-size:22px;font-weight:900}.account-summary .pnl-main.positive{color:#fff}.account-summary .pnl-main.negative{color:#ffd1dc}.account-toggle{justify-self:end;width:44px;height:44px;border:0;border-radius:11px;background:rgba(0,0,0,.05);color:#fff;font-size:31px;line-height:1;display:grid;place-items:center}.account-toggle .arrow{display:block;transition:transform .18s}.account-top.expanded .account-toggle .arrow{transform:rotate(180deg)}.account-details{display:none;padding:8px 28px 22px}.account-top.expanded .account-details{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;row-gap:24px}.account-detail .detail-label{display:block;color:#a9dcff;font-size:15px;font-weight:600;margin-bottom:5px}.account-detail .detail-value{display:block;color:#fff;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-detail .detail-value.negative{color:#ffd4df}.account-expanded-logout{grid-column:3;justify-self:end;border:0;background:rgba(255,255,255,.10);color:#fff;border-radius:18px;padding:7px 14px;font-size:12px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px;background:#f3f5f7;padding:4px;border-radius:12px}.tab{border:0;background:transparent;border-radius:9px;padding:11px 8px;font-weight:800;color:#687786;cursor:pointer}.tab.active{background:#fff;color:#182332;box-shadow:0 2px 8px #00000010}.sub{color:#7b8793;font-size:13px;margin-bottom:18px}.position-card{border:1px solid #e0e5e9;border-radius:16px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:0 5px 18px #0000000d}.pos-head{display:flex;justify-content:space-between;align-items:center}.side-buy{color:#00a875;font-weight:800}.side-sell{color:#e6004d;font-weight:800}.pos-symbol{font-weight:800}.pos-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;color:#687786;font-size:12px}.pos-meta b{display:block;color:#182332;font-size:14px;margin-top:3px}.close-position{margin-top:14px;width:100%;height:42px;border:0;border-radius:10px;background:#182839;color:#fff;font-weight:800;font-size:13px}.close-position:disabled{opacity:.55}.open-chart{margin-top:10px;width:100%;height:40px;border:1px solid #dce2e7;border-radius:10px;background:#f7f8fa;color:#182332;font-weight:800;font-size:13px}.empty{text-align:center;padding:70px 20px;color:#7b8793}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #e0e5e9;display:grid;grid-template-columns:repeat(3,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#68798a;text-decoration:none;font-size:14px;font-weight:600}.bottom-nav a.active{color:#60768a}.bn-icon{font-size:28px;line-height:1}.bn-label{font-size:14px}
@media(max-width:760px){
.position-card{padding:9px;margin-bottom:7px;border-radius:11px}
.pos-head{font-size:12px}
.side-buy,.side-sell{font-size:15px}
.pos-symbol{font-size:13px}
.pos-meta{grid-template-columns:repeat(3,1fr);gap:4px 7px;margin-top:7px;font-size:9px}
.pos-meta b{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-position,.open-chart{margin-top:7px;height:30px;border-radius:7px;font-size:10px}
.position-card .open-chart{width:calc(50% - 3px);display:inline-block;margin-right:3px}
.position-card .close-position{width:calc(50% - 3px);display:inline-block;margin-left:3px}
}
@media(min-width:761px){.bottom-nav{display:none}}
</style></head>
<body>
<main class="positions-page"><h1>Positions</h1>
<div class="account-top" id="positionAccountPanel"><div class="account-compact"><div class="account-demo">TRADING</div><div class="account-summary"><span class="balance-main" id="positionBalance">—</span><span class="pnl-main" id="positionHeaderPnl">+$0.00</span></div><button class="account-toggle" id="positionAccountToggle" type="button" aria-expanded="false"><span class="arrow">⌄</span></button></div><div class="account-details" id="positionAccountDetails"><div class="account-detail"><span class="detail-label">Balance</span><span class="detail-value" id="detailPositionBalance">—</span></div><div class="account-detail"><span class="detail-label">Floating Profit/Loss</span><span class="detail-value" id="detailPositionPnl">—</span></div><div class="account-detail"><span class="detail-label">Equity</span><span class="detail-value" id="detailPositionEquity">—</span></div><div class="account-detail"><span class="detail-label">Margin</span><span class="detail-value" id="detailPositionMargin">—</span></div><div class="account-detail"><span class="detail-label">Free Margin</span><span class="detail-value" id="detailPositionFreeMargin">—</span></div><div class="account-detail"><span class="detail-label">Margin Level</span><span class="detail-value" id="detailPositionMarginLevel">—</span></div><div class="account-detail"><span class="detail-label">Risk Assessment</span><span class="detail-value" id="detailPositionRisk">Safe</span></div><div class="account-detail"><span class="detail-label">Status</span><span class="detail-value" id="detailPositionStatus">LIVE</span></div><button class="account-expanded-logout" id="positionExpandedLogout" type="button">Logout</button></div></div>
<div class="tabs"><button class="tab active" data-tab="open">Open</button><button class="tab" data-tab="closed">Closed</button></div><div class="sub" id="tabSub">Open trades</div><div id="positions"></div></main>
<nav class="bottom-nav"><a href="index.html"><span class="bn-icon">⌂</span><span class="bn-label">Home</span></a><a href="terminal.html"><span class="bn-icon">▱</span><span class="bn-label">Charts</span></a><a href="position.html" class="active"><span class="bn-icon">♮</span><span class="bn-label">Position</span></a></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=6"></script>
<script src="aura-account.js"></script>
<script>
let terminalSessionToken=sessionStorage.getItem('auraTerminalSession')||'';
async function positionApi(path,opt={}){
  if(!terminalSessionToken)throw new Error('Terminal login required');
  const headers=opt.headers||{};headers.Authorization='Bearer '+terminalSessionToken;
  if(opt.body&&typeof opt.body==='object'){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const res=await fetch('https://course-era.onrender.com'+path,{...opt,headers});
  let data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(data.detail||data.error||('Request failed (HTTP '+res.status+')'));return data;
}
function money(v){return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function price(v){return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:5})}
let livePositions=[];
let liveBalance=0;
let currentTab='open';
let tabData={open:[],closed:[]};
let liveQuoteRequest=false;

function contractSize(symbol){
  if(symbol==='OANDA:XAUUSD')return 100;
  if(symbol==='FX:EURUSD'||symbol==='FX:GBPUSD'||symbol==='FX:AUDUSD'||symbol==='FX:USDJPY')return 100000;
  return 1;
}
function calcLivePnl(p,price){
  const entry=Number(p.entryPrice||0),lot=Number(p.lot||0),q=Number(price||0);
  if(!entry||!q||!lot)return 0;
  let v=(p.side==='BUY'?q-entry:entry-q)*lot*contractSize(p.symbol);
  if(p.symbol==='FX:USDJPY')v/=q;
  return Number.isFinite(v)?v:0;
}
function paintLivePositions(){
  if(currentTab!=='open'||!livePositions.length)return;
  let openPnl=0;
  document.querySelectorAll('.position-card').forEach((card,i)=>{
    const p=livePositions[i];if(!p)return;
    const current=Number(p.currentPrice||p.entryPrice||0),pnl=calcLivePnl(p,current);
    openPnl+=pnl;
    const values=card.querySelectorAll('.pos-meta b');
    if(values[2])values[2].textContent=price(current);
    if(values[3]){values[3].textContent=(pnl>=0?'+':'')+money(pnl);values[3].style.color=pnl>=0?'#00a875':'#e6004d';}
  });
  const pnlEl=document.getElementById('positionHeaderPnl'); if(pnlEl){pnlEl.textContent=(openPnl>=0?'+':'')+money(openPnl);pnlEl.classList.toggle('positive',openPnl>=0);pnlEl.classList.toggle('negative',openPnl<0);} const dp=document.getElementById('detailPositionPnl'); if(dp){dp.textContent=(openPnl>=0?'+':'')+money(openPnl);dp.classList.toggle('negative',openPnl<0);}
}
async function refreshLivePnl(){
  if(liveQuoteRequest||!livePositions.length||currentTab!=='open')return;
  liveQuoteRequest=true;
  try{
    const symbols=[...new Set(livePositions.map(p=>p.symbol).filter(Boolean))].join(',');
    const data=await positionApi('/api/market/quotes?symbols='+encodeURIComponent(symbols));
    for(const p of livePositions){const q=Number(data.quotes?.[p.symbol]?.price||0);if(q)p.currentPrice=q;}
    paintLivePositions();
  }catch(e){}finally{liveQuoteRequest=false}
}
function renderCards(items){
  const el=document.getElementById('positions');
  if(!items.length){
    const msg=currentTab==='open'?'No open trades yet.':'No closed trades yet.';
    el.innerHTML='<div class="empty">'+msg+'</div>';return;
  }
  el.innerHTML=items.map(p=>{
    const isClosed=currentTab==='closed';
    const pnl=isClosed?Number(p.realizedPnl||p.pnl||0):calcLivePnl(p,p.currentPrice||p.entryPrice);
    const opened=p.openedAt?new Date(p.openedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
    const closed=p.closedAt?new Date(p.closedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
    return '<article class="position-card"><div class="pos-head"><span class="'+(p.side==='BUY'?'side-buy':'side-sell')+'">'+p.side+'</span><span class="pos-symbol">'+(p.name||p.symbol)+'</span></div><div class="pos-meta"><div>Lot<b>'+p.lot+'</b></div><div>Entry<b>'+price(p.entryPrice)+'</b></div><div>'+(isClosed?'Close':'Current')+'<b>'+price(isClosed?p.closePrice:p.currentPrice)+'</b></div><div>P&L<b style="color:'+(pnl>=0?'#00a875':'#e6004d')+'">'+(pnl>=0?'+':'')+money(pnl)+'</b></div><div>SL<b>'+(p.stopLoss?price(p.stopLoss):'—')+'</b></div><div>TP<b>'+(p.takeProfit?price(p.takeProfit):'—')+'</b></div><div>Open time<b>'+opened+'</b></div>'+(isClosed?'<div>Close time<b>'+closed+'</b></div>':'')+'</div>'+(currentTab==='open'?'<button class="open-chart" type="button" data-symbol="'+String(p.symbol||'').replace(/"/g,'&quot;')+'">Open Chart</button><button class="close-position" data-id="'+p.id+'">Close Trade</button>':'')+'</article>';
  }).join('');
  if(currentTab==='open')document.querySelectorAll('.open-chart').forEach(btn=>btn.addEventListener('click',()=>{ const symbol=btn.dataset.symbol; if(symbol) location.href='terminal.html?symbol='+encodeURIComponent(symbol); }));
  if(currentTab==='open')document.querySelectorAll('.close-position').forEach(btn=>btn.addEventListener('click',async()=>{
    btn.disabled=true;btn.textContent='Closing…';
    try{await positionApi('/api/trading/positions/'+encodeURIComponent(btn.dataset.id)+'/close',{method:'POST'});await loadPositions();}
    catch(e){btn.disabled=false;btn.textContent='Close Trade';alert(e.message)}
  }));
}
function renderCurrentTab(){
  const labels={open:'Open trades',closed:'Closed trades'};
  document.getElementById('tabSub').textContent=labels[currentTab];
  renderCards(tabData[currentTab]||[]);
  if(currentTab==='open'){livePositions=tabData.open;paintLivePositions();}
}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{currentTab=btn.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));renderCurrentTab();}));

function renderPositionData(data){
  liveBalance=Number(data.account?.balance||0);
  document.getElementById('positionBalance').textContent=money(liveBalance); document.getElementById('detailPositionBalance').textContent=money(liveBalance);
  const initialPnl=tabData.open.reduce((sum,p)=>sum+calcLivePnl(p,p.currentPrice||p.entryPrice),0); const pnlEl=document.getElementById('positionHeaderPnl'); if(pnlEl){pnlEl.textContent=(initialPnl>=0?'+':'')+money(initialPnl);pnlEl.classList.toggle('positive',initialPnl>=0);pnlEl.classList.toggle('negative',initialPnl<0);} const dp=document.getElementById('detailPositionPnl'); if(dp)dp.textContent=(initialPnl>=0?'+':'')+money(initialPnl); const eq=liveBalance+initialPnl; const setp=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v}; setp('detailPositionEquity',money(eq)); setp('detailPositionMargin','—'); setp('detailPositionFreeMargin',money(eq)); setp('detailPositionMarginLevel','—'); setp('detailPositionRisk','Safe'); setp('detailPositionStatus','LIVE');
  tabData.open=(data.open||data.positions||[]).map(p=>({...p,currentPrice:Number(p.currentPrice||p.entryPrice||0)}));
  tabData.closed=data.closed||[];
  livePositions=tabData.open;
  renderCurrentTab();
}
async function loadPositions(){
  const data=await positionApi('/api/trading/history');
  renderPositionData(data);
}
if(!terminalSessionToken){location.replace('terminal.html');}
else{loadPositions().catch(e=>{
  if(/revoked|expired|not active|Terminal login required/i.test(e.message||'')){sessionStorage.removeItem('auraTerminalSession');sessionStorage.removeItem('auraTerminalRole');location.replace('terminal.html');return}
  document.getElementById('positions').innerHTML='<div class="empty">'+e.message+'</div>';
});}
setInterval(()=>{if(terminalSessionToken)loadPositions().catch(()=>{});},30000);
const positionAccountToggle=document.getElementById('positionAccountToggle'); if(positionAccountToggle)positionAccountToggle.addEventListener('click',()=>{const panel=document.getElementById('positionAccountPanel');const open=panel.classList.toggle('expanded');positionAccountToggle.setAttribute('aria-expanded',String(open));}); const positionLogout=document.getElementById('positionExpandedLogout'); if(positionLogout)positionLogout.addEventListener('click',()=>{sessionStorage.removeItem('auraTerminalSession');sessionStorage.removeItem('auraTerminalRole');location.href='terminal.html';});
setInterval(refreshLivePnl,3000);</script></body></html>
