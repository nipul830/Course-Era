<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Challenges Admin — Aura Farming</title><style>:root{--g:#f1d98a;--g2:#d6b35a;--bg:#000;--card:#070707;--line:#302713;--muted:#9b8552;--ok:#7ee2a8;--err:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;background:#000;z-index:5}.brand{font-size:24px;font-weight:900}.top button{color:var(--g);background:#080706;border:1px solid var(--line);border-radius:9px;padding:9px 13px;text-decoration:none;font-weight:900}.wrap{max-width:1200px;margin:auto;padding:25px 3% 60px}.eyebrow{color:var(--g2);font-size:11px;font-weight:900;letter-spacing:3px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{color:var(--g);margin:6px 0 18px;font-size:34px}.btn{border:1px solid var(--g2);background:var(--g2);color:#080808;border-radius:8px;padding:10px 14px;font-weight:900;cursor:pointer}.btn.secondary{background:#0b0a07;color:var(--g)}.group{margin-top:16px}.group-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 2px 8px;margin-bottom:9px}.group-head h2{margin:0;color:var(--g);font-size:18px}.group-count{color:var(--muted);font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#000;color:#fff}.check{display:flex;align-items:center;gap:8px;color:var(--g2);font-size:12px;font-weight:800}.actions{display:flex;gap:7px;margin-top:10px}.danger{background:#120707;color:var(--err);border-color:#522626}.status{min-height:20px;margin:12px 0;font-size:12px}.ok{color:var(--ok)}.err{color:var(--err)}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#080808;border:1px solid var(--line);border-radius:14px;padding:17px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{color:var(--g);margin:0 0 12px}.close{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head{align-items:flex-start}.head h1{font-size:28px}.actions .btn{flex:1}.top .brand{font-size:20px}}</style></head><body><header class="top"><div class="brand">Aura Farming</div><button id="logout">Logout</button></header><main class="wrap"><div class="eyebrow">AURA FARMING ADMIN</div><div class="head"><h1>Challenge Management</h1><button class="btn" id="add">+ New Challenge</button></div><div id="status" class="status"></div><div id="challengeGroups"></div></main><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Challenge</h2><button class="close" id="close">×</button></div><form id="form"><div class="row"><div class="field"><label>Model</label><select id="model"><option>1 Step</option><option>2 Step</option><option>Instant</option></select></div><div class="field"><label>Size</label><input id="size" placeholder="$10K" required></div></div><div class="row"><div class="field"><label>Challenge ID</label><input id="id" placeholder="one-10000" required></div><div class="field"><label>Account Size</label><input id="accountSize" type="number" min="1" required></div></div><div class="row"><div class="field"><label>Price (USDT)</label><input id="price" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Discount %</label><input id="discount" type="number" min="0" max="100" step="1" value="0"></div></div><div class="row"><div class="field"><label>Daily Drawdown</label><input id="daily" placeholder="4%"></div><div class="field"><label>Total Drawdown</label><input id="total" placeholder="8%"></div></div><div class="row"><div class="field"><label>Profit Target</label><input id="profit" placeholder="10%"></div><div class="field"><label>Evaluation</label><input id="evaluation" placeholder="None"></div></div><div class="row"><div class="field"><label>Phase 1 Profit</label><input id="phase1" placeholder="8%"></div><div class="field"><label>Phase 2 Profit</label><input id="phase2" placeholder="6%"></div></div><label class="check"><input id="enabled" type="checkbox" checked> Enabled — visible on challenge page</label><div class="actions"><button class="btn" type="submit">Save Challenge</button><button class="btn secondary" type="button" id="cancel">Cancel</button></div></form></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=13"></script><script>let user=null,items=[],editing=null;const $=id=>document.getElementById(id),status=$("status"),DIS="__DISABLED__";function meta(x){const s=String(x.evaluation||"");if(!s.startsWith(DIS+"::"))return{model:x.model||"1 Step",evaluation:s};const parts=s.slice((DIS+"::").length).split("::");return{model:decodeURIComponent(parts[0]||x.model||"1 Step"),evaluation:decodeURIComponent(parts.slice(1).join("::")||"")}}function enabledOf(x){return String(x.model||"")!=="Disabled"}function packDisabled(model,evaluation){return DIS+"::"+encodeURIComponent(model)+"::"+encodeURIComponent(evaluation||"")}function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const h={...(opt.headers||{}),Authorization:'Bearer '+await user.getIdToken(true)};const r=await fetch(path,{...opt,headers:h});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}function card(x,i){const m=meta(x),on=enabledOf(x);return '<article class="card"><div class="row"><div><b>'+esc(m.model)+' '+esc(x.size)+'</b><div style="color:var(--muted);font-size:11px;margin-top:4px">'+esc(x.id)+' · $'+Number(x.accountSize).toLocaleString()+'</div></div><div style="text-align:right;color:var(--g);font-weight:900">$'+Number(x.price).toFixed(2)+'<div style="font-size:10px;color:var(--g2)">'+Number(x.discountPercent||0)+'% OFF</div></div></div><div style="margin-top:10px" class="check"><input type="checkbox" data-enable="'+i+'" '+(on?'checked':'')+'> '+(on?'Enabled':'Disabled')+'</div><div class="actions"><button class="btn secondary" data-edit="'+i+'">Edit</button><button class="btn danger" data-delete="'+i+'">Delete</button></div></article>'}function render(){const root=$("challengeGroups");const models=['Instant','1 Step','2 Step'];root.innerHTML=models.map(model=>{const entries=items.map((x,i)=>({x,i})).filter(({x})=>meta(x).model===model);return '<section class="group"><div class="group-head"><h2>'+model+'</h2><div class="group-count">'+entries.length+' challenge'+(entries.length===1?'':'s')+'</div></div><div class="grid">'+(entries.length?entries.map(({x,i})=>card(x,i)).join(''):'<div class="card" style="color:var(--muted);font-size:12px">No '+model+' challenges.</div>')+'</div></section>'}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(Number(b.dataset.delete)));document.querySelectorAll('[data-enable]').forEach(b=>b.onchange=()=>toggle(Number(b.dataset.enable),b.checked))}async function save(){status.className='status';status.textContent='Saving…';try{const d=await api('/api/challenges',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenges:items})});items=d.challenges||items;status.className='status ok';status.textContent='Challenges saved.';render()}catch(e){status.className='status err';status.textContent=e.message}}function openEdit(i){editing=i;const x=items[i];$('modalTitle').textContent='Edit Challenge';fill(x);$('modal').classList.add('open')}function fill(x){const m=meta(x);$('model').value=m.model;$('size').value=x.size||'';$('id').value=x.id||'';$('accountSize').value=x.accountSize||'';$('price').value=x.price||'';$('discount').value=x.discountPercent||0;$('daily').value=x.dailyDrawdown||'';$('total').value=x.totalDrawdown||'';$('profit').value=x.profitTarget||'';$('evaluation').value=m.evaluation;$('phase1').value=x.phase1Profit||'';$('phase2').value=x.phase2Profit||'';$('enabled').checked=enabledOf(x)}function openNew(){editing=null;$('modalTitle').textContent='New Challenge';fill({model:'1 Step',discountPercent:0,evaluation:''});$('id').value='';$('size').value='';$('accountSize').value='';$('price').value='';$('daily').value='4%';$('total').value='8%';$('profit').value='10%';$('evaluation').value='';$('phase1').value='';$('phase2').value='';$('enabled').checked=true;$('modal').classList.add('open')}function close(){$('modal').classList.remove('open')}function formData(){return{id:$('id').value.trim(),model:$('model').value,size:$('size').value.trim(),accountSize:Number($('accountSize').value),price:Number($('price').value),discountPercent:Number($('discount').value)||0,dailyDrawdown:$('daily').value.trim(),totalDrawdown:$('total').value.trim(),profitTarget:$('profit').value.trim(),evaluation:$('evaluation').value.trim(),phase1Profit:$('phase1').value.trim(),phase2Profit:$('phase2').value.trim(),enabled:$('enabled').checked}}function del(i){if(!confirm('Delete this challenge?'))return;items.splice(i,1);save()}function toggle(i,on){const m=meta(items[i]);if(on){items[i].model=m.model;items[i].evaluation=m.evaluation}else{items[i].model='Disabled';items[i].evaluation=packDisabled(m.model,m.evaluation)}save()}$('form').onsubmit=e=>{e.preventDefault();const x=formData();if(!x.id||!x.model||!x.size||!x.accountSize||!x.price){status.className='status err';status.textContent='Fill ID, model, size, account size and price.';return}x.model=x.enabled?x.model:'Disabled';x.evaluation=x.enabled?x.evaluation:packDisabled($('model').value,x.evaluation);if(editing===null)items.push(x);else items[editing]=x;close();save()};$('add').onclick=openNew;$('cancel').onclick=close;$('close').onclick=close;$('logout').onclick=async()=>{await firebase.auth().signOut();location.replace('admin.html')};firebase.auth().onAuthStateChanged(async u=>{if(!u){location.replace('admin.html');return}user=u;try{const d=await api('/api/challenges');items=d.challenges||[];render()}catch(e){status.className='status err';status.textContent=e.message}});</script></body></html>
