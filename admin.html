<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Payments — Aura Farming</title><link rel="stylesheet" href="aura.css"><style>
.admin{max-width:1200px;margin:auto;padding:45px 5%}.payment{background:#050505;border:1px solid #302713;border-radius:16px;padding:18px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:center}.muted2{color:#9b8552;font-size:12px}.actions{margin:0}.btn.reject{background:#2a0909;color:#ff9b9b;border-color:#5a1717}.proof{max-width:120px;max-height:90px;border-radius:8px;margin-top:8px}@media(max-width:800px){.row{grid-template-columns:1fr}.actions{margin-top:8px}}
</style></head><body><header class="nav"><a class="brand" href="index.html"><span>Aura Farming</span></a></header><main class="admin"><p class="eyebrow">AURA FARMING ADMIN</p><h1 style="font-size:48px">Payment Queue</h1><p id="status" class="muted2">Checking admin access…</p><div id="list"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=6"></script><script>
const API='https://course-era.onrender.com';
async function api(path,opt={}){const t=await ceAuth.currentUser.getIdToken();const h=opt.headers||{};h.Authorization='Bearer '+t;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const d=await api('/api/admin/payments');const list=document.getElementById('list');const ps=d.payments||[];if(!ps.length){list.innerHTML='<p class="muted2">No payments found.</p>';return}list.innerHTML=ps.map(p=>'<article class="payment"><div class="row"><div><b style="color:#f1d98a">'+esc(p.type==='challenge'?'Challenge':'Course')+'</b><div style="color:#fff;margin-top:5px">'+esc(p.challengeModel? p.challengeModel+' '+p.challengeSize:p.courseTitle)+'</div><div class="muted2">'+esc(p.userEmail)+'</div></div><div><b style="color:#fff">$'+Number(p.amount||0).toFixed(2)+'</b><div class="muted2">'+esc(p.method)+' · '+esc(p.transactionId)+'</div></div><div><span class="muted2">Status</span><div style="color:#fff">'+esc(p.status)+'</div>'+(p.screenshotUrl?'<img class="proof" src="'+esc(p.screenshotUrl)+'">':'')+'</div><div class="actions">'+(p.status==='pending'?'<button class="btn primary" onclick="review(\''+p.id+'\',\'approved\')">Approve</button> <button class="btn reject" onclick="review(\''+p.id+'\',\'rejected\')">Reject</button>':'')+'</div></div></article>').join('')}catch(e){status.textContent=e.message}}
async function review(id,statusValue){if(!confirm(statusValue==='approved'?'Approve this payment and activate the simulated account?':'Reject this payment?'))return;try{await api('/api/admin/payments/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:statusValue})});await load()}catch(e){alert(e.message)}}
ceAuth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html?next=admin.html');return}try{await load();status.textContent='Admin payment queue';}catch(e){status.textContent=e.message}});
</script></body></html>
