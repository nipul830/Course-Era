<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Payments — Aura Farming</title><link rel="stylesheet" href="aura.css"><style>
.admin{max-width:1200px;margin:auto;padding:45px 5%}.payment{background:#050505;border:1px solid #302713;border-radius:16px;padding:18px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:center}.muted2{color:#9b8552;font-size:12px}.actions{margin:0}.btn.reject{background:#2a0909;color:#ff9b9b;border-color:#5a1717}.proof{max-width:120px;max-height:90px;border-radius:8px;margin-top:8px}.rules-admin{margin-top:28px;background:#050505;border:1px solid #302713;border-radius:18px;padding:20px}.rules-admin h2{color:#f1d98a;margin:0 0 6px}.rules-admin>p{color:#9b8552;font-size:13px}.rule-model{border:1px solid #302713;border-radius:14px;margin:12px 0;padding:14px}.rule-model h3{color:#fff;margin:0 0 12px}.rule-row{display:flex;gap:8px;margin:8px 0}.rule-row input{flex:1;background:#000;color:#fff;border:1px solid #302713;border-radius:9px;padding:11px}.rule-add,.rule-remove,.rules-save{border:1px solid #302713;border-radius:9px;font-weight:900;cursor:pointer}.rule-add{background:#111;color:#f1d98a;padding:9px 13px}.rule-remove{background:#260909;color:#ff9b9b;padding:0 13px}.rules-save{background:#d6b35a;color:#080808;padding:12px 18px;margin-top:8px}@media(max-width:800px){.row{grid-template-columns:1fr}.actions{margin-top:8px}}
</style></head><body><header class="nav"><a class="brand" href="index.html"><span>Aura Farming</span></a></header><main class="admin"><p class="eyebrow">AURA FARMING ADMIN</p><h1 style="font-size:48px">Payment Queue</h1><p id="status" class="muted2">Checking admin access…</p><section class="rules-admin"><h2>Challenge Rules</h2><p>Manage the rules shown inside purchased accounts. Add or remove numbered rules with the + button.</p><div id="rulesEditor"></div><button class="rules-save" type="button" onclick="saveRules()">Save Rules</button><span id="rulesStatus" class="muted2" style="margin-left:10px"></span></section><div id="list"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="firebase-config.js?v=6"></script><script>
const API='https://course-era.onrender.com';
async function api(path,opt={}){const t=await ceAuth.currentUser.getIdToken();const h=opt.headers||{};h.Authorization='Bearer '+t;const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.error||'Request failed');return d}
const RULE_MODELS=["1 Step","2 Step","Instant"];
let challengeRules={"1 Step":["Daily Drawdown: 4%","Total Drawdown: 8%","Profit Target: 10%"],"2 Step":["Daily Drawdown: 4%","Total Drawdown: 8%","Phase 1 Profit Target: 8%","Phase 2 Profit Target: 6%"],"Instant":["Daily Drawdown: 3%"]};
function renderRulesEditor(){const root=document.getElementById('rulesEditor');root.innerHTML=RULE_MODELS.map(model=>'<div class="rule-model"><h3>'+esc(model)+'</h3><div id="rules-'+model.replace(/ /g,'-')+'">'+(challengeRules[model]||[]).map((x,i)=>ruleRow(model,x,i)).join('')+'</div><button type="button" class="rule-add" onclick="addRule('+JSON.stringify(model)+')">+ Add Rule</button></div>').join('')}
function ruleRow(model,value,index){return '<div class="rule-row"><input data-model="'+esc(model)+'" value="'+esc(value)+'" placeholder="Rule '+(index+1)+'"><button type="button" class="rule-remove" onclick="this.parentElement.remove()">×</button></div>'}
function addRule(model){const box=document.getElementById('rules-'+model.replace(/ /g,'-'));const n=box.querySelectorAll('.rule-row').length;box.insertAdjacentHTML('beforeend',ruleRow(model,'',n))}
async function loadRules(){try{const d=await api('/api/challenge-rules');challengeRules=d.rules||challengeRules;renderRulesEditor()}catch(e){document.getElementById('rulesStatus').textContent=e.message}}
async function saveRules(){const rules={};for(const model of RULE_MODELS){const box=document.getElementById('rules-'+model.replace(/ /g,'-'));rules[model]=Array.from(box.querySelectorAll('input')).map(x=>x.value.trim()).filter(Boolean)}const st=document.getElementById('rulesStatus');st.textContent='Saving…';try{await api('/api/challenge-rules',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules})});challengeRules=rules;st.textContent='Saved ✓';setTimeout(()=>st.textContent='',1800)}catch(e){st.textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{await loadRules();const d=await api('/api/admin/payments');const list=document.getElementById('list');const ps=d.payments||[];if(!ps.length){list.innerHTML='<p class="muted2">No payments found.</p>';return}list.innerHTML=ps.map(p=>'<article class="payment"><div class="row"><div><b style="color:#f1d98a">'+esc(p.type==='challenge'?'Challenge':'Course')+'</b><div style="color:#fff;margin-top:5px">'+esc(p.challengeModel? p.challengeModel+' '+p.challengeSize:p.courseTitle)+'</div><div class="muted2">'+esc(p.userEmail)+'</div></div><div><b style="color:#fff">$'+Number(p.amount||0).toFixed(2)+'</b><div class="muted2">'+esc(p.method)+' · '+esc(p.transactionId)+'</div></div><div><span class="muted2">Status</span><div style="color:#fff">'+esc(p.status)+'</div>'+(p.screenshotUrl?'<img class="proof" src="'+esc(p.screenshotUrl)+'">':'')+'</div><div class="actions">'+(p.status==='pending'?'<button class="btn primary" onclick="review(\''+p.id+'\',\'approved\')">Approve</button> <button class="btn reject" onclick="review(\''+p.id+'\',\'rejected\')">Reject</button>':(p.status==='approved'&&p.type==='challenge'&&p.userId?'<button class="btn reject" onclick="breachAccount(\''+p.userId+'\')">Breach & Revoke</button>':''))+'</div></div></article>').join('')}catch(e){status.textContent=e.message}}
async function review(id,statusValue){if(!confirm(statusValue==='approved'?'Approve this payment and activate the simulated account?':'Reject this payment?'))return;try{await api('/api/admin/payments/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:statusValue})});await load()}catch(e){alert(e.message)}}
async function breachAccount(uid){if(!confirm('Mark this trading account as BREACHED and revoke both terminal passwords?'))return;try{await api('/api/admin/trading-accounts/'+encodeURIComponent(uid)+'/breach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'Account breached by admin'})});await load()}catch(e){alert(e.message)}}
ceAuth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html?next=admin.html');return}try{await load();status.textContent='Admin payment queue';}catch(e){status.textContent=e.message}});
</script></body></html>
