<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Management — Course Era</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="nav"><a class="brand" href="index.html">Course<span>Era</span></a><nav><a href="admin.html">Dashboard</a></nav></header>
<main class="container">
<div class="page-title"><p class="eyebrow">ADMIN / COURSES</p><h1>Course Management</h1><p class="muted">Create courses and control what customers can buy.</p></div>
<form class="panel form-grid" onsubmit="saveCourse(event)">
<input type="hidden" id="courseId">
<label>Course title<input id="courseTitle" required></label>
<label>Price (INR)<input id="coursePrice" type="number" min="1" required></label>
<label>Thumbnail URL<input id="courseImage" placeholder="https://..."></label>
<label>Description<textarea id="courseDesc" rows="4"></textarea></label>
<label>Video URL<input id="courseVideo" placeholder="https://..."></label>
<label class="check"><input id="coursePublished" type="checkbox" checked> Published / visible in store</label>
<div class="actions"><button class="btn primary" id="saveBtn">Create Course</button><button type="button" class="btn ghost" onclick="resetForm()">Clear</button></div>
<p id="adminMsg" class="msg"></p>
</form>
<h2 style="margin-top:45px">Existing Courses</h2><div id="courseList" class="grid"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=7"></script><script src="app.js?v=11"></script>
<script>
protectPage("admin-courses");
let items=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadAdminCourses(){
 const box=document.getElementById('courseList');box.innerHTML='<div class="panel empty">Loading…</div>';
 try{
  const data=await apiFetch('/api/admin/courses');items=data.courses||[];
  if(!items.length){box.innerHTML='<div class="panel empty">No courses yet.</div>';return}
  box.innerHTML=items.map(c=>'<article class="panel"><p class="eyebrow">'+(c.published?'PUBLISHED':'HIDDEN')+'</p><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.description)+'</p><p class="price">₹'+Number(c.price||0).toLocaleString('en-IN')+'</p><div class="actions"><button class="btn primary" onclick="editCourse(\''+c.id+'\')">Edit</button><button class="btn ghost" onclick="deleteCourse(\''+c.id+'\')">Delete</button></div></article>').join('');
 }catch(e){box.innerHTML='<div class="panel empty">'+esc(e.message)+'</div>'}
}
function editCourse(id){
 const c=items.find(x=>x.id===id);if(!c)return;
 courseId.value=c.id;courseTitle.value=c.title||'';coursePrice.value=c.price||'';courseImage.value=c.thumbnail||'';courseDesc.value=c.description||'';courseVideo.value=c.videoUrl||'';coursePublished.checked=c.published!==false;saveBtn.textContent='Update Course';scrollTo({top:0,behavior:'smooth'});
}
function resetForm(){document.querySelector('form').reset();courseId.value='';coursePublished.checked=true;saveBtn.textContent='Create Course';adminMsg.textContent=''}
async function saveCourse(e){
 e.preventDefault();adminMsg.textContent='Saving…';
 const body={title:courseTitle.value.trim(),price:Number(coursePrice.value),thumbnail:courseImage.value.trim(),description:courseDesc.value.trim(),videoUrl:courseVideo.value.trim(),published:coursePublished.checked};
 try{
  if(courseId.value) await apiFetch('/api/courses/'+encodeURIComponent(courseId.value),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  else await apiFetch('/api/courses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  adminMsg.textContent='Saved successfully.';resetForm();loadAdminCourses();
 }catch(e){adminMsg.textContent=e.message}
}
async function deleteCourse(id){
 if(!confirm('Delete this course? Existing paid access records will remain but the course will disappear.'))return;
 try{await apiFetch('/api/courses/'+encodeURIComponent(id),{method:'DELETE'});loadAdminCourses()}catch(e){alert(e.message)}
}
ceAuth.onAuthStateChanged(u=>{if(u)loadAdminCourses()});
</script></body></html>
